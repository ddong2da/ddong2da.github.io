<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;700&display=swap">
<style>

.song{display:flex;gap:11px;align-items:center;background:#ffffff26;border-radius:20px;padding:9px;border:1.5px solid #ffffff44;flex-wrap:wrap;cursor:pointer;flex:none}
.song.sel{background:#fff;color:var(--ink);box-shadow:0 0 0 3px var(--butter),0 0 22px #ffe27a}
.jk{width:52px;height:52px;border-radius:14px;flex:none;display:grid;place-items:center;font:700 22px var(--f-n);color:#fff;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:inset 0 -3px 0 #0002}
.song .nm{font:400 18px/1.15 var(--f-d)}
.song .ar{font:500 12px var(--f-n);opacity:.8}

.diff{display:flex;gap:6px}

.d0{background:#3fc68f}.d1{background:#3b98f5}.d2{background:#ff4fa3}.d3{background:#9c4dff}
