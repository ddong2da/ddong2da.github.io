<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>햄스터 키우기</title>
<meta name="description" content="먹이 주고, 청소하고, 바라보는 햄스터 키우기">
<meta name="theme-color" content="#fbefeb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="햄스터 키우기">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --sys: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  --text: #333333;
  --shadow: 1.5px 1.5px 1.5px rgba(0, 0, 0, .28);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: #fbefeb;
  font-family: var(--sys); color: var(--text);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid #0a84ff; outline-offset: 2px; }

#field { position: fixed; inset: 0; overflow: hidden; }
#grass { position: absolute; inset: 0; width: 100%; height: 100%; }
.prop { position: absolute; pointer-events: none; }
.prop svg { display: block; width: 100%; height: auto; }
#house { width: 50vw; max-width: 250px; }
#bottle { width: 26vw; max-width: 130px; }
.poop { position: absolute; width: 15px; height: 10px; pointer-events: none; transition: opacity .5s, transform .5s; }
.poop.gone { opacity: 0; transform: scale(.3); }
.seed { position: absolute; width: 18px; height: 11px; pointer-events: none; transition: opacity .3s; }
.seed.gone { opacity: 0; }

#ham { position: absolute; left: 0; top: 0; width: 92px; will-change: transform; cursor: pointer; }
#ham .flip { transform-origin: 50% 100%; }
#ham svg { display: block; width: 100%; height: auto; overflow: visible; }
#ham .hb { transform-origin: 60px 80px; }
#ham.walking .hb { animation: bob .26s ease-in-out infinite alternate; }
#ham.walking .lf { animation: step .26s ease-in-out infinite alternate; }
#ham.walking .lb { animation: step .26s ease-in-out -.13s infinite alternate; }
#ham.groom .paws { animation: groom .35s ease-in-out infinite alternate; }
#ham.eating .head { animation: nibble .3s ease-in-out infinite alternate; }
#ham .pouch { transform-origin: 98px 58px; transform: scale(0); transition: transform .4s; }
#ham.eating .pouch, #ham.full .pouch { transform: scale(1); }
#ham .closed { display: none; }
#ham.sleeping .open { display: none; }
#ham.sleeping .closed { display: inline; }
#ham.sleeping .hb { animation: breathe 2.4s ease-in-out infinite; }
#ham.hop .hb { animation: hop .45s ease-out; }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-2.5px); } }
@keyframes step { from { transform: translateY(0); } to { transform: translateY(-3px); } }
@keyframes groom { from { transform: translate(0, 0); } to { transform: translate(2px, -6px); } }
@keyframes nibble { from { transform: rotate(0); } to { transform: rotate(4deg); } }
@keyframes breathe { 0%, 100% { transform: scale(1, .93); } 50% { transform: scale(1.02, .9); } }
@keyframes hop { 0% { transform: translateY(0); } 40% { transform: translateY(-16px); } 100% { transform: translateY(0); } }

.bubble {
  position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -4px);
  background: #fff; border-radius: 12px; padding: 4px 10px; font-size: 13px; white-space: nowrap;
  box-shadow: 0 1px 2px rgba(0,0,0,.15); opacity: 0; transition: opacity .3s; pointer-events: none;
}
.bubble.on { opacity: 1; }
.bubble::after { content: ''; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: #fff; }
.zz { position: absolute; right: -4px; top: -10px; font-size: 15px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.3); display: none; }
#ham.sleeping .zz { display: block; animation: zz 2.4s ease-in-out infinite; }
@keyframes zz { 0% { opacity: 0; transform: translate(0, 4px); } 50% { opacity: 1; } 100% { opacity: 0; transform: translate(8px, -10px); } }
.heart { position: absolute; font-size: 18px; color: #ff6f8a; pointer-events: none; z-index: 6000; animation: rise .9s ease-out forwards; }
.sparkle { position: absolute; pointer-events: none; z-index: 6000; font-size: 16px; color: #fff; animation: rise .8s ease-out forwards; text-shadow: 0 0 6px rgba(255,255,255,.9); }
@keyframes rise { from { opacity: 1; transform: translate(-50%, 0) scale(.6); } to { opacity: 0; transform: translate(-50%, -40px) scale(1.2); } }

/* 상태 글씨 */
.ui { position: fixed; z-index: 7000; transition: opacity .35s; }
.ui[hidden] { display: none !important; }
.viewing .ui { opacity: 0; pointer-events: none; }
#status {
  top: calc(env(safe-area-inset-top, 0px) + 11vh); left: calc(env(safe-area-inset-left, 0px) + 10px);
  text-shadow: var(--shadow); pointer-events: none;
}
#status .nm { font-size: 21px; line-height: 1.25; margin-bottom: 1px; max-width: 60vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#status .row { display: flex; align-items: baseline; height: 28px; }
#status .row .lb { width: 62px; font-size: 16px; }
#status .row .vl { font-family: Helvetica, Arial, var(--sys); font-size: 27px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
#days {
  top: calc(env(safe-area-inset-top, 0px) + 11vh - 2px); right: calc(env(safe-area-inset-right, 0px) + 14px);
  font-size: 26px; text-shadow: var(--shadow); pointer-events: none;
}
#days b { font-family: Helvetica, Arial, var(--sys); font-weight: 400; }

/* 초록 버튼 */
.col { display: flex; flex-direction: column; gap: 3px; }
#right { right: calc(env(safe-area-inset-right, 0px) + 4px); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); }
#left { left: calc(env(safe-area-inset-left, 0px) + 4px); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); }
.gbtn {
  display: grid; place-items: center; height: 36px; padding: 0 14px; border-radius: 999px;
  background: linear-gradient(#6fd257, #3ea32c 70%, #46ad33); border: 2.5px solid rgba(255, 255, 255, .9);
  color: #dff7cf; box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
}
#right .gbtn { width: 100px; padding: 0; font-size: 18px; white-space: nowrap; }
#left .gbtn { width: 60px; font-size: 13px; line-height: 1.05; text-align: center; }
.gbtn:active { filter: brightness(.92); transform: translateY(1px); }
#viewhint {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%);
  z-index: 7000; font-size: 13px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.4);
  opacity: 0; transition: opacity .6s; pointer-events: none; white-space: nowrap;
}
#viewhint.on { opacity: 1; }

/* 알림창 (아이폰 알림 모양) */
#dim { position: fixed; inset: 0; z-index: 9000; background: rgba(70, 70, 70, .38); display: flex; align-items: center; justify-content: center; padding: 24px; }
#dim[hidden] { display: none; }
.alert {
  width: 270px; max-width: 100%; border-radius: 14px; overflow: hidden; text-align: center;
  background: rgba(45, 46, 36, .9); -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4);
  color: #fff; animation: pop .22s ease-out;
}
@keyframes pop { from { transform: scale(1.12); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.alert .at { padding: 19px 16px 18px; }
.alert h2 { margin: 0 0 4px; font-size: 17px; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; }
.alert p { margin: 0; font-size: 13px; line-height: 1.4; white-space: pre-line; }
.alert .ab { display: block; width: 100%; height: 44px; border-top: .5px solid rgba(255, 255, 255, .22); color: #0a84ff; font-size: 17px; }
.alert .ab.bold { font-weight: 600; }
.alert .ab.red { color: #ff453a; }
.alert .ab:active { background: rgba(255, 255, 255, .08); }
.alert input {
  display: block; width: 100%; height: 38px; margin-top: 8px; padding: 0 10px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.12); color: #fff;
  font: inherit; font-size: 16px; -webkit-user-select: text; user-select: text; -webkit-appearance: none; appearance: none;
}
.alert input::placeholder { color: rgba(255,255,255,.45); }
.alert input:focus { outline: none; border-color: #0a84ff; }
.alert .err { min-height: 18px; margin-top: 8px; color: #ff6b61; font-size: 12.5px; }
.alert .ab:disabled { color: rgba(255,255,255,.35); }
.alert img { display: block; width: 100%; border-radius: 8px; margin-top: 12px; -webkit-touch-callout: default; }

@media (prefers-reduced-motion: reduce) {
  #ham .hb, #ham .lf, #ham .lb, #ham .paws, #ham .head { animation: none !important; }
}
</style>
</head>
<body>
<div id="field">
  <canvas id="grass" aria-hidden="true"></canvas>
  <div class="prop" id="house" aria-hidden="true">
    <svg viewBox="0 0 160 130">
      <ellipse cx="80" cy="124" rx="70" ry="6" fill="rgba(60,80,30,.22)"/>
      <path d="M10 56 L80 8 L150 56 Z" fill="#c99158"/>
      <path d="M10 56 L80 8 L150 56" fill="none" stroke="#a87440" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="22" y="52" width="116" height="70" rx="4" fill="#ecd09f"/>
      <g stroke="#d9b680" stroke-width="2"><line x1="22" y1="70" x2="138" y2="70"/><line x1="22" y1="88" x2="138" y2="88"/><line x1="22" y1="106" x2="138" y2="106"/></g>
      <path d="M58 122 V96 a22 22 0 0 1 44 0 V122 Z" fill="#6b5236"/>
      <path d="M62 122 V97 a18 18 0 0 1 36 0 V122" fill="none" stroke="#4d3a24" stroke-width="2"/>
    </svg>
  </div>
  <div class="prop" id="bottle" aria-hidden="true">
    <svg viewBox="0 0 120 150">
      <ellipse cx="60" cy="144" rx="52" ry="6" fill="rgba(60,80,30,.2)"/>
      <path d="M26 30 Q26 8 60 8 Q94 8 94 30 V140 H26 Z" fill="#bfe6dc"/>
      <path d="M30 34 Q32 16 60 14 Q88 16 90 34" fill="none" stroke="#7fcabd" stroke-width="3"/>
      <path d="M32 42 Q60 50 88 42" fill="none" stroke="#7fcabd" stroke-width="3"/>
      <rect x="34" y="20" width="8" height="110" rx="4" fill="rgba(255,255,255,.55)"/>
      <path d="M48 140 V100 a12 12 0 0 1 24 0 V140 Z" fill="#a6d8cc"/>
      <circle cx="84" cy="110" r="6" fill="#4eb3a6"/><circle cx="100" cy="112" r="5" fill="#4eb3a6"/>
      <path d="M6 112 Q6 140 32 140 H48 V112 Z" fill="#d6f0e9"/>
      <ellipse cx="27" cy="112" rx="21" ry="7" fill="#a6d8cc"/>
    </svg>
  </div>
  <div id="ham" role="button" aria-label="햄스터">
    <div class="bubble" id="bubble"></div>
    <div class="flip">
      <svg viewBox="0 0 124 92" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="62" cy="88" rx="40" ry="4.5" fill="rgba(60,80,30,.25)"/>
        <g class="hb">
          <g class="lb"><ellipse cx="34" cy="83" rx="7" ry="4" fill="#f2b8b2"/><ellipse cx="50" cy="85" rx="7" ry="4" fill="#f2b8b2"/></g>
          <ellipse cx="13" cy="58" rx="5" ry="4" fill="#f6c9b6"/>
          <path d="M14 56 C12 26 38 12 64 14 C92 16 112 30 112 54 C112 76 92 86 62 86 C34 86 16 78 14 56 Z" fill="#f0a95b"/>
          <path d="M26 30 C40 16 64 13 84 18 C70 18 52 22 40 32 Z" fill="#d98a3c" opacity=".55"/>
          <path d="M36 70 C40 82 58 86 74 86 C94 86 106 78 108 64 C96 74 66 76 36 70 Z" fill="#fff3e3"/>
          <g class="head">
            <circle cx="76" cy="20" r="9.5" fill="#e79b50"/><circle cx="76" cy="21" r="5.5" fill="#f5b3b3"/>
            <circle cx="93" cy="19" r="8.5" fill="#f0a95b"/><circle cx="93" cy="20" r="4.8" fill="#f7bdbd"/>
            <path d="M84 40 C88 28 104 28 112 40 C120 50 118 66 104 68 C92 70 82 62 84 40 Z" fill="#fff3e3"/>
            <g class="pouch"><ellipse cx="99" cy="60" rx="13" ry="10" fill="#fff3e3"/><ellipse cx="99" cy="60" rx="13" ry="10" fill="none" stroke="#f0d4b8" stroke-width="1.2"/></g>
            <g class="open"><circle cx="99" cy="39" r="4.6" fill="#2b2420"/><circle cx="100.6" cy="37.4" r="1.6" fill="#fff"/></g>
            <path class="closed" d="M94.5 40 Q99 44 103.5 40" fill="none" stroke="#2b2420" stroke-width="2" stroke-linecap="round"/>
            <ellipse cx="117" cy="47" rx="3.2" ry="2.5" fill="#e8838f"/>
            <path d="M113 52 Q115 55 117 52" fill="none" stroke="#c9737e" stroke-width="1.2" stroke-linecap="round"/>
            <ellipse cx="103" cy="52" rx="5.5" ry="3.6" fill="#f7a1a8" opacity=".6"/>
            <g stroke="#d6b79a" stroke-width=".9" stroke-linecap="round"><line x1="114" y1="49" x2="124" y2="46"/><line x1="114" y1="51" x2="124" y2="52"/></g>
          </g>
          <g class="paws"><ellipse cx="96" cy="76" rx="4.5" ry="3.5" fill="#f2b8b2"/></g>
          <g class="lf"><ellipse cx="82" cy="85" rx="7" ry="4" fill="#f2b8b2"/><ellipse cx="96" cy="84" rx="6" ry="3.6" fill="#f2b8b2"/></g>
        </g>
      </svg>
    </div>
    <span class="zz">z z</span>
  </div>
</div>

<div class="ui" id="status" aria-live="polite">
  <div class="nm" id="nm">햄스터</div>
  <div class="row"><span class="lb">크기</span><span class="vl" id="sz"></span></div>
  <div class="row"><span class="lb">만복도</span><span class="vl" id="fd"></span></div>
  <div class="row"><span class="lb">청결도</span><span class="vl" id="cl"></span></div>
</div>
<div class="ui" id="days"><b id="dn">1</b>일째</div>
<div class="ui col" id="left">
  <button class="gbtn" id="menu">메뉴</button>
  <button class="gbtn" id="view">감상<br>모드</button>
</div>
<div class="ui col" id="right">
  <button class="gbtn" id="feed">먹이 주기</button>
  <button class="gbtn" id="clean">청소</button>
  <button class="gbtn" id="photo">촬영</button>
</div>
<div id="viewhint">화면을 누르면 버튼이 다시 나와요</div>
<div id="dim" hidden></div>

<script>
/* ───── 저장 ───── */
const SB_URL = 'https://dqozoyzxsosnzegqqdpz.supabase.co';
const SB_KEY = 'sb_publishable_jXaCakxSow679VzOdyCWYQ_lwWJouCp';
const TOKEN_KEY = 'hamster.token';
const FOOD_H = 96, CLEAN_H = 168;          // 4일에 한 번 먹이, 일주일에 한 번 청소
const FEED_STEP = 25;
let st = null, token = null;
try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {}
function setToken(t) { token = t; try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
async function rpc(fn, args, keepalive) {
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST', keepalive: !!keepalive,
    headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args)
  });
  if (!r.ok) throw new Error('http ' + r.status);
  return r.json();
}
let saveTimer = null, dirty = false;
function save() { if (!st || !token) return; dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1500); }
async function flush(keepalive) {
  if (!st || !token || !dirty) return;
  dirty = false;
  try {
    const r = await rpc('hamster_save', { p_token: token, p_state: st }, keepalive);
    if (r && r.error === 'not_logged_in') { setToken(null); location.reload(); }
  } catch (e) { dirty = true; }
}

/* ───── 화면 ───── */
const $ = id => document.getElementById(id);
const field = $('field'), ham = $('ham'), bubble = $('bubble');
let W = innerWidth, H = innerHeight;
const WALL = () => H * 0.25;
const area = () => ({ x0: W * 0.08, x1: W * 0.92, y0: H * 0.34, y1: H * 0.84 });

function drawScene() {
  const c = $('grass'), dpr = Math.min(devicePixelRatio || 1, 2);
  c.width = W * dpr; c.height = H * dpr;
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const wall = WALL();
  // 벽 (분홍 모눈)
  g.fillStyle = '#fbefeb'; g.fillRect(0, 0, W, wall);
  g.strokeStyle = 'rgba(232, 196, 186, .45)'; g.lineWidth = 1;
  for (let x = 0; x < W; x += 5) { g.beginPath(); g.moveTo(x + .5, 0); g.lineTo(x + .5, wall); g.stroke(); }
  for (let y = 0; y < wall; y += 5) { g.beginPath(); g.moveTo(0, y + .5); g.lineTo(W, y + .5); g.stroke(); }
  // 울타리
  const ft = wall * 0.42;
  g.fillStyle = '#fdfaf6'; g.fillRect(0, ft, W, wall - ft);
  for (let x = 6; x < W; x += 26) {
    g.fillStyle = 'rgba(190, 180, 170, .35)'; g.fillRect(x + 7, ft, 2, wall - ft);
    g.fillStyle = '#ffffff'; g.fillRect(x, ft, 7, wall - ft);
  }
  g.fillStyle = 'rgba(200, 220, 230, .35)'; g.fillRect(0, wall - 14, W, 14);
  // 풀 바닥
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const top = wall - 6;
  const grd = g.createLinearGradient(0, top, 0, H);
  grd.addColorStop(0, '#b6dc7e'); grd.addColorStop(1, '#a6d06c');
  g.fillStyle = grd; g.fillRect(0, top, W, H - top);
  const greens = ['#9cc864', '#c3e48f', '#8fbd57', '#d0eba4', '#a9d273', '#7fb24a'];
  const n = Math.round(W * (H - top) / 30);
  for (let i = 0; i < n; i++) {
    const x = rnd() * W, y = top + rnd() * (H - top), len = 10 + rnd() * 22, a = (rnd() - .5) * Math.PI;
    g.strokeStyle = greens[(rnd() * greens.length) | 0]; g.globalAlpha = .5 + rnd() * .45;
    g.lineWidth = 2 + rnd() * 3; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len * .5); g.stroke();
  }
  g.globalAlpha = 1;
  // 풀 윗부분 들쭉날쭉
  g.fillStyle = '#b9de82';
  for (let x = 0; x < W; x += 6) { g.beginPath(); g.ellipse(x, top + 2, 6, 4 + rnd() * 5, 0, 0, Math.PI * 2); g.fill(); }
}

function placeProps() {
  const house = $('house'), bottle = $('bottle'), wall = WALL();
  house.style.left = (-W * 0.03) + 'px';
  house.style.top = (wall - house.offsetHeight * 0.82) + 'px';
  house.style.zIndex = Math.round(wall + 10);
  bottle.style.right = (W * 0.02) + 'px';
  bottle.style.top = (wall - bottle.offsetHeight * 0.86) + 'px';
  bottle.style.zIndex = Math.round(wall + 10);
}
function houseDoor() {
  const h = $('house');
  return { x: h.offsetLeft + h.offsetWidth / 2, y: h.offsetTop + h.offsetHeight * 0.97 };
}

/* ───── 상태 계산 ───── */
function catchUp(now) {
  const dtH = Math.max(0, (now - st.last) / 3.6e6);
  if (!dtH) return;
  st.fedH += Math.min(dtH, st.food / (100 / FOOD_H));
  st.food = Math.max(0, st.food - dtH * 100 / FOOD_H);
  st.clean = Math.max(0, st.clean - dtH * 100 / CLEAN_H);
  st.last = now;
}
const sizeCm = () => 5 + 10 * (1 - Math.exp(-st.fedH / 960));
const sizeScale = () => 0.8 + (sizeCm() - 5) / 10 * 0.6;
const dayNo = () => Math.max(1, Math.floor((Date.now() - st.start) / 864e5) + 1);
const isNight = () => { const h = new Date().getHours(); return h >= 23 || h < 7; };

function renderStatus() {
  $('nm').textContent = st.name;
  $('sz').textContent = sizeCm().toFixed(6) + 'cm';
  $('fd').textContent = Math.ceil(st.food) + '%';
  $('cl').textContent = Math.ceil(st.clean) + '%';
  $('dn').textContent = dayNo();
}

/* 똥 */
const POOP_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 14" width="15" height="10"><ellipse cx="7" cy="8" rx="6" ry="4" fill="#7a5230"/><ellipse cx="15" cy="6" rx="6" ry="4" fill="#6a4628"/></svg>';
function syncPoops(force) {
  const want = Math.min(12, Math.floor((100 - st.clean) / 8));
  while (st.poops.length < want) st.poops.push({ x: Math.random(), y: Math.random() });
  if (st.poops.length > want) st.poops.length = want;
  const have = field.querySelectorAll('.poop:not(.gone)');
  if (!force && have.length === st.poops.length) return;
  have.forEach(p => p.remove());
  const a = area();
  st.poops.forEach(p => {
    const el = document.createElement('div');
    el.className = 'poop';
    const x = a.x0 + p.x * (a.x1 - a.x0), y = a.y0 + p.y * (a.y1 - a.y0);
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.zIndex = Math.round(y);
    el.innerHTML = POOP_SVG;
    field.appendChild(el);
  });
}

/* 먹이 (해바라기씨) */
const SEED_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 22" width="18" height="11"><ellipse cx="18" cy="12" rx="16" ry="8" fill="#3f3b35"/><path d="M4 12 Q18 6 32 12" fill="none" stroke="#e8e2d0" stroke-width="2"/><path d="M6 15 Q18 11 30 15" fill="none" stroke="#bdb6a3" stroke-width="1.2"/></svg>';
const foods = [];
function dropSeed() {
  const a = area();
  const x = a.x0 + Math.random() * (a.x1 - a.x0), y = a.y0 + Math.random() * (a.y1 - a.y0) * .9;
  const el = document.createElement('div');
  el.className = 'seed'; el.innerHTML = SEED_SVG;
  el.style.left = (x - 9) + 'px'; el.style.top = (y - 6) + 'px'; el.style.zIndex = Math.round(y);
  field.appendChild(el);
  foods.push({ x, y, el });
  sparkle(x, y - 14);
}

/* ───── 햄스터 ───── */
const hm = { x: 0, y: 0, dir: 1, state: 'idle', t: 1, tx: 0, ty: 0, goal: null, food: null };
function setState(s, t) {
  hm.state = s; hm.t = t;
  ham.classList.toggle('walking', s === 'walk');
  ham.classList.toggle('eating', s === 'eat');
  ham.classList.toggle('groom', s === 'groom');
  ham.classList.toggle('sleeping', s === 'sleep');
}
function walkTo(x, y, goal, food) {
  const a = area();
  hm.tx = Math.min(a.x1, Math.max(a.x0, x)); hm.ty = Math.min(a.y1, Math.max(a.y0, y));
  hm.goal = goal || null; hm.food = food || null;
  setState('walk', 0);
}
function goEat() {
  if (!foods.length) return false;
  let best = foods[0], bd = Infinity;
  foods.forEach(f => { const d = Math.hypot(f.x - hm.x, f.y - hm.y); if (d < bd) { bd = d; best = f; } });
  const side = best.x > hm.x ? -1 : 1;
  walkTo(best.x + side * 30 * sizeScale(), best.y + 4, 'eat', best);
  return true;
}
function decide() {
  if (goEat()) return;
  const a = area(), r = Math.random();
  if (isNight() && r < 0.5) { const d = houseDoor(); return walkTo(d.x, d.y + 8, 'sleep'); }
  if (r < 0.6) return walkTo(a.x0 + Math.random() * (a.x1 - a.x0), a.y0 + Math.random() * (a.y1 - a.y0));
  if (r < 0.78) return setState('groom', 1.5 + Math.random() * 2);
  if (r < 0.86) return setState('sleep', 8 + Math.random() * 12);
  setState('idle', 1 + Math.random() * 3);
}
function say(text, ms = 2200) {
  bubble.textContent = text; bubble.classList.add('on');
  clearTimeout(say.t); say.t = setTimeout(() => bubble.classList.remove('on'), ms);
}
function hamWidth() {
  const a = area();
  return 112 * sizeScale() * (0.88 + 0.24 * (hm.y - a.y0) / (a.y1 - a.y0));
}
function place() {
  const w = hamWidth();
  ham.style.width = w + 'px';
  ham.style.transform = `translate(${hm.x - w / 2}px, ${hm.y - w * 0.74}px)`;
  ham.style.zIndex = Math.round(hm.y) + 1;
  ham.querySelector('.flip').style.transform = `scaleX(${hm.dir})`;
}
let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - lastFrame) / 1000); lastFrame = now;
  if (hm.state === 'walk') {
    const dx = hm.tx - hm.x, dy = hm.ty - hm.y, d = Math.hypot(dx, dy);
    const v = (st.food > 0 ? 85 : 42) * sizeScale();
    if (Math.abs(dx) > 2) hm.dir = dx > 0 ? 1 : -1;
    if (d < 2) {
      if (hm.goal === 'eat' && hm.food && foods.includes(hm.food)) {
        hm.dir = hm.food.x > hm.x ? 1 : -1;
        setState('eat', 2.6);
      } else if (hm.goal === 'sleep') setState('sleep', isNight() ? 90 : 20);
      else setState('idle', 0.8 + Math.random() * 2.5);
      if (hm.goal !== 'eat') hm.food = null;
      hm.goal = null;
    } else { hm.x += dx / d * Math.min(d, v * dt); hm.y += dy / d * Math.min(d, v * dt); }
  } else {
    hm.t -= dt;
    if (hm.t <= 0) {
      if (hm.state === 'eat' && hm.food) {
        const f = hm.food, i = foods.indexOf(f);
        if (i > -1) { foods.splice(i, 1); f.el.classList.add('gone'); setTimeout(() => f.el.remove(), 320); }
        hm.food = null;
        ham.classList.add('full'); setTimeout(() => ham.classList.remove('full'), 3000);
      }
      decide();
    }
  }
  place();
  requestAnimationFrame(frame);
}

function sparkle(x, y, ch = '✦') {
  const s = document.createElement('div');
  s.className = 'sparkle'; s.textContent = ch; s.style.left = x + 'px'; s.style.top = y + 'px';
  document.body.appendChild(s); setTimeout(() => s.remove(), 900);
}

/* ───── 알림창 ───── */
const dim = $('dim');
function alertBox(title, body, buttons) {
  return new Promise(res => {
    dim.innerHTML = `<div class="alert" role="alertdialog" aria-modal="true"><div class="at"><h2></h2><p></p></div></div>`;
    const box = dim.firstChild;
    box.querySelector('h2').textContent = title;
    if (typeof body === 'string') box.querySelector('p').textContent = body;
    else { box.querySelector('p').remove(); box.querySelector('.at').appendChild(body); }
    (buttons || [{ label: '닫기' }]).forEach((b, i) => {
      const el = document.createElement('button');
      el.className = 'ab' + (b.bold ? ' bold' : '') + (b.red ? ' red' : '');
      el.textContent = b.label;
      el.onclick = e => { e.stopPropagation(); dim.hidden = true; dim.innerHTML = ''; res(b.value ?? i); };
      box.appendChild(el);
    });
    dim.hidden = false;
  });
}
async function intro() {
  await alertBox('당신의 햄스터를 키워봅시다.', '키우는 방법은 매우 간단합니다.\n4일에 1번은 먹이를 주고 일주일에 한 번은 청소를 해줍니다.\n햄스터는 매일 조금씩 커집니다.');
  await alertBox('바로 먹이를 줘보도록 합시다.', '햄스터는 조금 배가 고픈 모양입니다.\n만복이 될 때까지 먹이를 줍시다.');
}

/* ───── 버튼 ───── */
$('feed').onclick = e => {
  e.stopPropagation();
  catchUp(Date.now());
  if (st.food >= 100) { say('배불러요'); return; }
  st.food = Math.min(100, st.food + FEED_STEP); save(); renderStatus();
  dropSeed();
  if (hm.state === 'sleep') setState('idle', 0.3);
  if (hm.state !== 'eat' && hm.goal !== 'eat') goEat();
};
$('clean').onclick = e => {
  e.stopPropagation();
  catchUp(Date.now()); st.clean = 100;
  field.querySelectorAll('.poop').forEach(p => { sparkle(p.offsetLeft, p.offsetTop - 10); p.classList.add('gone'); setTimeout(() => p.remove(), 520); });
  st.poops = []; save(); renderStatus();
};
let viewing = false;
$('view').onclick = e => {
  e.stopPropagation();
  viewing = true; document.body.classList.add('viewing');
  const hint = $('viewhint'); hint.classList.add('on'); setTimeout(() => hint.classList.remove('on'), 2200);
};
$('menu').onclick = async e => {
  e.stopPropagation();
  const pick = await alertBox('메뉴', '', [
    { label: '키우는 방법', value: 'help' },
    { label: '이름 바꾸기', value: 'name' },
    { label: '처음부터 다시 키우기', value: 'reset', red: true },
    { label: '로그아웃', value: 'logout' },
    { label: '닫기', value: 'close', bold: true }
  ]);
  if (pick === 'help') intro();
  else if (pick === 'name') {
    const n = prompt('새 이름을 입력해 주세요.', st.name);
    if (n && n.trim()) { st.name = n.trim().slice(0, 12); save(); renderStatus(); }
  } else if (pick === 'reset') {
    const ok = await alertBox('처음부터 다시 키울까요?', `${st.name}와 함께한 ${dayNo()}일의 기록이 사라집니다.`, [
      { label: '취소', value: false }, { label: '다시 키우기', value: true, red: true }]);
    if (ok) { newPet(); intro(); }
  } else if (pick === 'logout') {
    catchUp(Date.now()); dirty = true; await flush();
    try { await rpc('hamster_logout', { p_token: token }); } catch (e) {}
    setToken(null); location.reload();
  }
};
field.addEventListener('click', e => {
  if (viewing) { viewing = false; document.body.classList.remove('viewing'); return; }
  if (e.target.closest('#ham') || hm.state === 'sleep' || hm.state === 'eat') return;
  walkTo(e.clientX, e.clientY);
});
ham.addEventListener('click', e => {
  e.stopPropagation();
  if (viewing) { viewing = false; document.body.classList.remove('viewing'); return; }
  const h = document.createElement('div');
  h.className = 'heart'; h.textContent = '♥';
  h.style.left = hm.x + 'px'; h.style.top = (hm.y - hamWidth() * 0.7) + 'px';
  document.body.appendChild(h); setTimeout(() => h.remove(), 950);
  if (hm.state === 'sleep') { setState('idle', 1.5); say('…응?'); return; }
  ham.classList.remove('hop'); void ham.offsetWidth; ham.classList.add('hop');
  setTimeout(() => ham.classList.remove('hop'), 460);
});

/* 촬영: 지금 화면을 사진으로 */
function svgImg(svgEl, styleFix) {
  const c = svgEl.cloneNode(true);
  c.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  if (styleFix) styleFix(c);
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(c));
  return img.decode().then(() => img);
}
$('photo').onclick = async e => {
  e.stopPropagation();
  const dpr = 2, cv = document.createElement('canvas');
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  g.drawImage($('grass'), 0, 0, W, H);
  const items = [...field.querySelectorAll('.prop, .poop:not(.gone), .seed:not(.gone)')].map(el => ({ el, z: +el.style.zIndex || 0 }));
  items.push({ el: ham, z: +ham.style.zIndex || 0 });
  items.sort((a, b) => a.z - b.z);
  for (const it of items) {
    const svg = it.el.querySelector('svg'); if (!svg) continue;
    const r = svg.getBoundingClientRect();
    if (it.el === ham) {
      const img = await svgImg(svg, c => {
        const eat = ham.classList.contains('eating') || ham.classList.contains('full');
        const sleep = ham.classList.contains('sleeping');
        c.querySelector('.pouch').setAttribute('style', eat ? '' : 'display:none');
        c.querySelector('.open').setAttribute('style', sleep ? 'display:none' : '');
        c.querySelector('.closed').setAttribute('style', sleep ? '' : 'display:none');
      });
      g.save();
      if (hm.dir < 0) { g.translate(r.left + r.width, r.top); g.scale(-1, 1); g.drawImage(img, 0, 0, r.width, r.height); }
      else g.drawImage(img, r.left, r.top, r.width, r.height);
      g.restore();
    } else {
      g.drawImage(await svgImg(svg), r.left, r.top, r.width, r.height);
    }
  }
  // 글씨
  g.fillStyle = '#333'; g.shadowColor = 'rgba(0,0,0,.28)'; g.shadowOffsetX = 1.5; g.shadowOffsetY = 1.5; g.shadowBlur = 1.5;
  const sys = getComputedStyle(document.body).fontFamily;
  [['nm', 'status'], ['sz'], ['fd'], ['cl']].forEach(([id]) => {
    const el = $(id), r = el.getBoundingClientRect(), cs = getComputedStyle(el);
    g.font = `${cs.fontSize} ${cs.fontFamily}`; g.textBaseline = 'alphabetic';
    g.fillText(el.textContent, r.left, r.bottom - parseFloat(cs.fontSize) * 0.22);
  });
  document.querySelectorAll('#status .lb').forEach(el => {
    const r = el.getBoundingClientRect(); g.font = `16px ${sys}`; g.fillText(el.textContent, r.left, r.bottom - 5);
  });
  const dr = $('days').getBoundingClientRect(); g.font = `26px ${sys}`; g.textAlign = 'right';
  g.fillText($('days').textContent, dr.right, dr.bottom - 7);
  const url = cv.toDataURL('image/png');
  const wrap = document.createElement('div');
  wrap.innerHTML = `<p>사진을 길게 눌러서 저장할 수 있어요.</p><img alt="${st.name} 사진">`;
  wrap.querySelector('img').src = url;
  const pick = await alertBox(`${st.name} ${dayNo()}일째`, wrap, [{ label: '사진 내려받기', value: 'dl' }, { label: '닫기', value: 'close', bold: true }]);
  if (pick === 'dl') { const a = document.createElement('a'); a.href = url; a.download = `hamster-${dayNo()}.png`; a.click(); }
};

/* 가끔 하는 말 */
setInterval(() => {
  if (!st || hm.state === 'sleep' || viewing || !dim.hidden) return;
  if (st.food <= 0) say('배고파요…');
  else if (st.clean <= 15) say('여기 좀 치워 줘요…');
  else if (st.food <= 20) say('꼬르륵');
}, 18000);

/* 1초마다 상태 갱신 */
setInterval(() => {
  if (!st) return;
  catchUp(Date.now()); syncPoops(); renderStatus();
}, 1000);
setInterval(() => { if (st) { dirty = true; flush(); } }, 60000);
document.addEventListener('visibilitychange', () => {
  if (!st) return;
  catchUp(Date.now()); dirty = true;
  if (document.visibilityState === 'hidden') flush(true); else save();
});

/* ───── 시작 ───── */
function newPet() {
  const now = Date.now();
  st = { name: '햄스터', start: now, last: now, food: 30, clean: 100, fedH: 0, poops: [] };
  foods.splice(0).forEach(f => f.el.remove());
  save(); syncPoops(true); renderStatus();
}
function layout() {
  W = innerWidth; H = innerHeight;
  drawScene(); placeProps();
  if (st) syncPoops(true);
}
addEventListener('resize', layout);

let running = false;
function showGame(on) {
  ham.style.visibility = on ? '' : 'hidden';
  document.querySelectorAll('.ui').forEach(u => u.hidden = !on);
}
function startGame(first) {
  catchUp(Date.now()); renderStatus(); syncPoops(true); showGame(true);
  const a = area();
  hm.x = (a.x0 + a.x1) / 2; hm.y = (a.y0 + a.y1) / 2;
  if (isNight()) { const d = houseDoor(); hm.x = d.x; hm.y = Math.max(a.y0, d.y + 8); setState('sleep', 60); }
  else setState('idle', 1);
  if (!running) { running = true; lastFrame = performance.now(); requestAnimationFrame(frame); }
  if (first) intro();
}
function enter(r) {
  const s0 = r.state;
  if (s0 && s0.start) {
    st = Object.assign({ name: '햄스터', food: 0, clean: 0, fedH: 0, poops: [] }, s0);
    if (!Array.isArray(st.poops)) st.poops = [];
    startGame(false);
  } else { newPet(); startGame(true); }
}

const ERR = {
  bad_username: '아이디는 2~16자의 한글, 영어, 숫자, _만 쓸 수 있어요.',
  bad_password: '비밀번호는 4자 이상이어야 해요.',
  username_taken: '이미 있는 아이디예요.',
  wrong_login: '아이디나 비밀번호가 맞지 않아요.',
  locked: '너무 많이 틀렸어요. 5분 뒤에 다시 해 주세요.',
  mismatch: '비밀번호 확인이 서로 달라요.',
  network: '인터넷 연결을 확인해 주세요.'
};
function loginBox(mode, msg) {
  const signup = mode === 'signup';
  dim.innerHTML = `<div class="alert" role="dialog" aria-modal="true" aria-labelledby="lt"><div class="at">
      <h2 id="lt">${signup ? '회원가입' : '로그인'}</h2>
      <p>${signup ? '아이디와 비밀번호를 정해 주세요.' : '로그인하면 어느 폰에서든\n내 햄스터를 키울 수 있어요.'}</p>
      <input id="lid" placeholder="아이디" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="16" aria-label="아이디">
      <input id="lpw" type="password" placeholder="비밀번호" autocomplete="${signup ? 'new-password' : 'current-password'}" maxlength="72" aria-label="비밀번호">
      ${signup ? '<input id="lpw2" type="password" placeholder="비밀번호 확인" autocomplete="new-password" maxlength="72" aria-label="비밀번호 확인">' : ''}
      <p class="err" id="lerr" role="alert"></p>
    </div>
    <button class="ab bold" id="lgo">${signup ? '가입하기' : '로그인'}</button>
    <button class="ab" id="lsw">${signup ? '로그인으로 돌아가기' : '회원가입'}</button></div>`;
  dim.hidden = false;
  const id = $('lid'), pw = $('lpw'), pw2 = $('lpw2'), go = $('lgo'), err = $('lerr');
  if (msg) err.textContent = msg;
  $('lsw').onclick = () => loginBox(signup ? 'login' : 'signup');
  const submit = async () => {
    err.textContent = '';
    if (!id.value.trim() || !pw.value) { err.textContent = '아이디와 비밀번호를 입력해 주세요.'; return; }
    if (signup && pw.value !== pw2.value) { err.textContent = ERR.mismatch; return; }
    go.disabled = true; go.textContent = '잠깐만요…';
    try {
      const r = await rpc(signup ? 'hamster_signup' : 'hamster_login', { p_username: id.value, p_password: pw.value });
      if (r.error) { err.textContent = ERR[r.error] || '다시 시도해 주세요.'; return; }
      setToken(r.token);
      const l = await rpc('hamster_load', { p_token: r.token });
      if (l.error) { err.textContent = '다시 시도해 주세요.'; return; }
      dim.hidden = true; dim.innerHTML = '';
      enter(l);
    } catch (e) { err.textContent = ERR.network; }
    finally { if (document.contains(go)) { go.disabled = false; go.textContent = signup ? '가입하기' : '로그인'; } }
  };
  go.onclick = submit;
  [id, pw, pw2].forEach(el => el && el.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); }));
}

async function boot() {
  layout(); showGame(false);
  if (token) {
    try {
      const r = await rpc('hamster_load', { p_token: token });
      if (!r.error) return enter(r);
      setToken(null);
    } catch (e) { return loginBox('login', ERR.network); }
  }
  loginBox('login');
}
boot();
</script>
