<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>햄스터 키우기</title>
<meta name="description" content="먹이 주고, 청소하고, 바라보는 햄스터 키우기">
<meta name="theme-color" content="#fbefeb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="햄스터 키우기">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --sys: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  --text: #333333;
  --shadow: 1.5px 1.5px 1.5px rgba(0, 0, 0, .28);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: #fbefeb;
  font-family: var(--sys); color: var(--text);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid #0a84ff; outline-offset: 2px; }

#field { position: fixed; inset: 0; overflow: hidden; }
#grass { position: absolute; inset: 0; width: 100%; height: 100%; }
.prop { position: absolute; pointer-events: none; }
.prop img { display: block; width: 100%; height: auto; }
#house { width: 50vw; max-width: 250px; }
#bottle { width: 26vw; max-width: 130px; }
.poop { position: absolute; width: 14px; height: 8.4px; pointer-events: none; transition: opacity .5s, transform .5s; }
.poop.gone { opacity: 0; transform: scale(.3); }
.seed { position: absolute; width: 22px; height: 12px; pointer-events: none; transition: opacity .3s; }
.seed.gone { opacity: 0; }

#ham { position: absolute; left: 0; top: 0; width: 92px; will-change: transform; cursor: pointer; }
#ham .flip { transform-origin: 50% 100%; }
#ham .hb { position: relative; width: 100%; height: 66px; transform-origin: 50% 90%; }
#ham .hb canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
#ham .hb .v-open { display: block; }
#ham.eating .v-open, #ham.full .v-open, #ham.sleeping .v-open { display: none; }
#ham.eating .v-cheek, #ham.full .v-cheek { display: block; }
#ham.sleeping .v-cheek { display: none; }
#ham.sleeping .v-sleep { display: block; }
#ham.walking .hb { animation: bob .24s ease-in-out infinite alternate; }
#ham.groom .hb { animation: groom .4s ease-in-out infinite alternate; }
#ham.eating .hb { animation: nibble .28s ease-in-out infinite alternate; }
#ham.sleeping .hb { animation: breathe 2.4s ease-in-out infinite; }
#ham.hop .hb { animation: hop .45s ease-out; }
@keyframes bob { from { transform: translateY(0) scale(1, 1); } to { transform: translateY(-2.5px) scale(.985, 1.015); } }
@keyframes step { from { transform: translateY(0); } to { transform: translateY(-3px); } }
@keyframes groom { from { transform: scale(1, 1); } to { transform: scale(1.02, .97); } }
@keyframes nibble { from { transform: rotate(0); } to { transform: rotate(1.8deg) scale(1.01, .99); } }
@keyframes breathe { 0%, 100% { transform: scale(1, .93); } 50% { transform: scale(1.02, .9); } }
@keyframes hop { 0% { transform: translateY(0); } 40% { transform: translateY(-16px); } 100% { transform: translateY(0); } }

.bubble {
  position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -4px);
  background: #fff; border-radius: 12px; padding: 4px 10px; font-size: 13px; white-space: nowrap;
  box-shadow: 0 1px 2px rgba(0,0,0,.15); opacity: 0; transition: opacity .3s; pointer-events: none;
}
.bubble.on { opacity: 1; }
.bubble::after { content: ''; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: #fff; }
.zz { position: absolute; right: -4px; top: -10px; font-size: 15px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.3); display: none; }
#ham.sleeping .zz { display: block; animation: zz 2.4s ease-in-out infinite; }
@keyframes zz { 0% { opacity: 0; transform: translate(0, 4px); } 50% { opacity: 1; } 100% { opacity: 0; transform: translate(8px, -10px); } }
.heart { position: absolute; font-size: 18px; color: #ff6f8a; pointer-events: none; z-index: 6000; animation: rise .9s ease-out forwards; }
.sparkle { position: absolute; pointer-events: none; z-index: 6000; font-size: 16px; color: #fff; animation: rise .8s ease-out forwards; text-shadow: 0 0 6px rgba(255,255,255,.9); }
@keyframes rise { from { opacity: 1; transform: translate(-50%, 0) scale(.6); } to { opacity: 0; transform: translate(-50%, -40px) scale(1.2); } }

/* 상태 글씨 */
.ui { position: fixed; z-index: 7000; transition: opacity .35s; }
.ui[hidden] { display: none !important; }
.viewing .ui { opacity: 0; pointer-events: none; }
#status {
  top: calc(env(safe-area-inset-top, 0px) + 11vh); left: calc(env(safe-area-inset-left, 0px) + 10px);
  text-shadow: var(--shadow); pointer-events: none;
}
#status .nm { font-size: 21px; line-height: 1.25; margin-bottom: 1px; max-width: 60vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#status .row { display: flex; align-items: baseline; height: 28px; }
#status .row .lb { width: 62px; font-size: 16px; }
#status .row .vl { font-family: Helvetica, Arial, var(--sys); font-size: 27px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
#days {
  top: calc(env(safe-area-inset-top, 0px) + 11vh - 2px); right: calc(env(safe-area-inset-right, 0px) + 14px);
  font-size: 26px; text-shadow: var(--shadow); pointer-events: none;
}
#days b { font-family: Helvetica, Arial, var(--sys); font-weight: 400; }

/* 초록 버튼 */
.col { display: flex; flex-direction: column; gap: 3px; }
#right { right: calc(env(safe-area-inset-right, 0px) + 4px); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); }
#left { left: calc(env(safe-area-inset-left, 0px) + 4px); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); }
.gbtn {
  display: grid; place-items: center; height: 36px; padding: 0 14px; border-radius: 999px;
  background: linear-gradient(#6fd257, #3ea32c 70%, #46ad33); border: 2.5px solid rgba(255, 255, 255, .9);
  color: #dff7cf; box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
}
#right .gbtn { width: 100px; padding: 0; font-size: 18px; white-space: nowrap; }
#left .gbtn { width: 60px; font-size: 13px; line-height: 1.05; text-align: center; }
.gbtn:active { filter: brightness(.92); transform: translateY(1px); }
#back {
  position: fixed; z-index: 7000; display: none; width: 80px; padding: 0; font-size: 14px; white-space: nowrap;
  left: calc(env(safe-area-inset-left, 0px) + 4px); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
}
.viewing #back { display: grid; }

/* 메뉴 */
.msheet { display: flex; flex-direction: column; align-items: center; gap: 7px; animation: pop .2s ease-out; }
.mbtn {
  width: 148px; height: 54px; border-radius: 999px; border: 4px solid #fff;
  background: linear-gradient(#61cc4d, #33a025 72%, #3fae31); color: #fff; font-size: 17px;
  display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 2px 5px rgba(0, 0, 0, .25);
}
.mbtn.red { color: #ff2b1c; }
.mbtn:active { filter: brightness(.92); }
.mbtn svg { width: 22px; height: 22px; flex-shrink: 0; }

/* 알림창 (아이폰 알림 모양) */
#dim { position: fixed; inset: 0; z-index: 9000; background: rgba(70, 70, 70, .38); display: flex; align-items: center; justify-content: center; padding: 24px; }
#dim[hidden] { display: none; }
.alert {
  width: 270px; max-width: 100%; border-radius: 14px; overflow: hidden; text-align: center;
  background: rgba(45, 46, 36, .9); -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4);
  color: #fff; animation: pop .22s ease-out;
}
@keyframes pop { from { transform: scale(1.12); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.alert .at { padding: 19px 16px 18px; }
.alert h2 { margin: 0 0 4px; font-size: 17px; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; }
.alert p { margin: 0; font-size: 13px; line-height: 1.4; white-space: pre-line; }
.alert .ab { display: block; width: 100%; height: 44px; border-top: .5px solid rgba(255, 255, 255, .22); color: #0a84ff; font-size: 17px; }
.alert .ab.bold { font-weight: 600; }
.alert .ab.red { color: #ff453a; }
.alert .ab:active { background: rgba(255, 255, 255, .08); }
.alert input {
  display: block; width: 100%; height: 38px; margin-top: 8px; padding: 0 10px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.12); color: #fff;
  font: inherit; font-size: 16px; -webkit-user-select: text; user-select: text; -webkit-appearance: none; appearance: none;
}
.alert input::placeholder { color: rgba(255,255,255,.45); }
.alert input:focus { outline: none; border-color: #0a84ff; }
.alert .err { min-height: 18px; margin-top: 8px; color: #ff6b61; font-size: 12.5px; }
.alert .ab:disabled { color: rgba(255,255,255,.35); }
.alert img { display: block; width: 100%; border-radius: 8px; margin-top: 12px; -webkit-touch-callout: default; }

@media (prefers-reduced-motion: reduce) {
  #ham .hb { animation: none !important; }
}
.whiteout{position:fixed;inset:0;background:#fff;opacity:0;transition:opacity .35s ease;z-index:9000;pointer-events:all}
.whiteout.on{opacity:1}
</style>
</head>
<body>
<div id="field">
  <canvas id="grass" aria-hidden="true"></canvas>
  <div class="prop" id="house" aria-hidden="true"><img alt=""></div>
  <div class="prop" id="bottle" aria-hidden="true"><img alt=""></div>
  <div id="ham" role="button" aria-label="햄스터">
    <div class="bubble" id="bubble"></div>
    <div class="flip"><div class="hb"><canvas class="v-open"></canvas><canvas class="v-sleep"></canvas><canvas class="v-cheek"></canvas></div></div>
    <span class="zz">z z</span>
  </div>
</div>

<div class="ui" id="status" aria-live="polite">
  <div class="nm" id="nm">햄스터</div>
  <div class="row"><span class="lb" id="lbS">크기</span><span class="vl" id="sz"></span></div>
  <div class="row"><span class="lb" id="lbF">만복도</span><span class="vl" id="fd"></span></div>
  <div class="row"><span class="lb" id="lbC">청결도</span><span class="vl" id="cl"></span></div>
</div>
<div class="ui" id="days">1일째</div>
<div class="ui col" id="left">
  <button class="gbtn" id="menu">메뉴</button>
  <button class="gbtn" id="view">감상<br>모드</button>
</div>
<div class="ui col" id="right">
  <button class="gbtn" id="feed">먹이 주기</button>
  <button class="gbtn" id="clean">청소</button>
  <button class="gbtn" id="photo">촬영</button>
</div>
<button class="gbtn" id="back">돌아가기</button>
<div id="dim" hidden></div>

<script>
/* ───── 그림: 캔버스에 직접 그림 ───── */
function mkCanvas(w, h, R) {
  const c = document.createElement('canvas');
  c.width = Math.round(w * R); c.height = Math.round(h * R);
  const g = c.getContext('2d'); g.scale(R, R);
  return [c, g];
}
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const mixc = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function softShadow(g, x, y, rx, ry, a) {
  g.save(); g.translate(x, y); g.scale(1, ry / rx);
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, rx);
  gr.addColorStop(0, `rgba(40,50,20,${a})`); gr.addColorStop(.6, `rgba(40,50,20,${a * .55})`); gr.addColorStop(1, 'rgba(40,50,20,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, rx, 0, Math.PI * 2); g.fill(); g.restore();
}

/* 보내준 사진 속 햄스터를 오려서 씀. variant: open | sleep | cheek */
const SPR_W = 264, SPR_H = 300, SPR_FOOT = 0.955;
const EYES = [[136, 152, 10], [207, 157, 8.5]];
function hamVariant(img, variant) {
  const R = 2, [c, g] = mkCanvas(SPR_W, SPR_H, R);
  softShadow(g, 134, 284, 100, 13, .34);
  if (variant === 'cheek') {        // 볼 빵빵: 아래쪽을 살짝 넓게
    g.drawImage(img, 0, 0, 264, 150, 0, 0, 264, 150);
    g.drawImage(img, 0, 150, 264, 138, -8, 150, 280, 138);
  } else g.drawImage(img, 0, 0, 264, 288);
  if (variant === 'sleep') {
    const d = g.getImageData(0, 0, c.width, c.height).data;
    EYES.forEach(([x, y, r]) => {
      let sr = 0, sg = 0, sb = 0, n = 0;
      for (let a = 0; a < 24; a++) {
        const px = Math.round((x + Math.cos(a / 24 * Math.PI * 2) * r * 1.8) * R), py = Math.round((y + Math.sin(a / 24 * Math.PI * 2) * r * 1.8) * R);
        const i = (py * c.width + px) * 4; sr += d[i]; sg += d[i + 1]; sb += d[i + 2]; n++;
      }
      const gr = g.createRadialGradient(x, y, 1, x, y, r * 1.5);
      gr.addColorStop(0, `rgb(${sr / n | 0},${sg / n | 0},${sb / n | 0})`); gr.addColorStop(.7, `rgba(${sr / n | 0},${sg / n | 0},${sb / n | 0},.95)`); gr.addColorStop(1, `rgba(${sr / n | 0},${sg / n | 0},${sb / n | 0},0)`);
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * 1.5, 0, Math.PI * 2); g.fill();
      g.strokeStyle = 'rgba(25,22,20,.9)'; g.lineWidth = 2; g.lineCap = 'round';
      g.beginPath(); g.moveTo(x - r, y); g.quadraticCurveTo(x, y + r * .75, x + r, y); g.stroke();
    });
  }
  return c;
}
function drawSeed() {
  const R = 3, [c, g] = mkCanvas(40, 22, R);
  g.translate(20, 11); g.rotate(-.12);
  const p = new Path2D();
  p.moveTo(-16, .5); p.bezierCurveTo(-16, -8.5, 7, -8, 17, 0); p.bezierCurveTo(7, 8, -16, 9.5, -16, .5);
  let gr = g.createLinearGradient(0, -8, 0, 9);
  gr.addColorStop(0, '#5d5a54'); gr.addColorStop(.45, '#302e2b'); gr.addColorStop(1, '#171614');
  g.fillStyle = gr; g.fill(p);
  g.save(); g.clip(p);
  g.strokeStyle = 'rgba(228,224,210,.9)'; g.lineWidth = 1.3;
  [-4.2, -.2, 3.8].forEach(o => { g.beginPath(); g.moveTo(-15, o); g.quadraticCurveTo(1, o * 1.15 - .8, 16.5, 0); g.stroke(); });
  g.fillStyle = 'rgba(255,255,255,.28)'; g.beginPath(); g.ellipse(-2, -4.6, 9, 1.5, -.05, 0, Math.PI * 2); g.fill();
  g.restore();
  return c;
}

function drawPoop() {
  const R = 3, [c, g] = mkCanvas(20, 12, R);
  g.translate(10, 6); g.rotate(.3);
  const gr = g.createRadialGradient(-2, -2, .5, 0, 0, 8.5);
  gr.addColorStop(0, '#80603f'); gr.addColorStop(1, '#3b2818');
  g.fillStyle = gr; g.beginPath(); g.ellipse(0, 0, 8, 3.7, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(255,255,255,.25)'; g.beginPath(); g.ellipse(-2, -1.6, 3.2, .9, 0, 0, Math.PI * 2); g.fill();
  return c;
}

function poly(g, pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); pts.slice(1).forEach(p => g.lineTo(p[0], p[1])); g.closePath(); }
function woodFace(g, pts, c0, c1, gx0, gy0, gx1, gy1, rnd, grainDir) {
  g.save(); poly(g, pts);
  const gr = g.createLinearGradient(gx0, gy0, gx1, gy1); gr.addColorStop(0, c0); gr.addColorStop(1, c1);
  g.fillStyle = gr; g.fill(); g.clip();
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  for (let k = 0; k < 46; k++) {               // 나뭇결
    g.strokeStyle = `rgba(150,105,55,${.08 + rnd() * .14})`; g.lineWidth = .6 + rnd() * 1.1;
    g.beginPath();
    if (grainDir === 'h') {
      const y = y0 + rnd() * (y1 - y0); g.moveTo(x0, y);
      for (let x = x0; x <= x1; x += 8) g.lineTo(x, y + Math.sin(x / 13 + k) * 1.4 + (rnd() - .5) * .6);
    } else {
      const x = x0 + rnd() * (x1 - x0); g.moveTo(x, y0);
      for (let y = y0; y <= y1; y += 8) g.lineTo(x + Math.sin(y / 13 + k) * 1.4, y);
    }
    g.stroke();
  }
  g.restore();
}
function drawHouse() {
  const R = 2, [c, g] = mkCanvas(260, 205, R), rnd = rng(77);
  softShadow(g, 138, 190, 128, 14, .3);
  woodFace(g, [[200, 80], [244, 48], [244, 152], [200, 188]], '#c59a60', '#a87d45', 200, 0, 244, 0, rnd, 'h');
  woodFace(g, [[52, 80], [200, 80], [200, 188], [52, 188]], '#efd5a5', '#d8b178', 0, 80, 0, 188, rnd, 'h');
  woodFace(g, [[52, 80], [96, 48], [244, 48], [200, 80]], '#f7e6c4', '#ebcf9c', 0, 48, 0, 80, rnd, 'h');
  // 문 (아치)
  const door = new Path2D();
  door.moveTo(100, 188); door.lineTo(100, 142); door.arc(128, 142, 28, Math.PI, 0); door.lineTo(156, 188); door.closePath();
  let gr = g.createRadialGradient(128, 168, 4, 128, 160, 46);
  gr.addColorStop(0, '#1f140a'); gr.addColorStop(1, '#55391f');
  g.fillStyle = gr; g.fill(door);
  g.strokeStyle = 'rgba(255,240,210,.55)'; g.lineWidth = 2; g.stroke(door);
  g.strokeStyle = 'rgba(110,75,40,.55)'; g.lineWidth = 1; g.stroke(door);
  // 경사로
  woodFace(g, [[4, 192], [42, 192], [86, 82], [60, 80]], '#ead0a0', '#d0a96e', 0, 80, 0, 192, rnd, 'v');
  g.strokeStyle = 'rgba(140,100,55,.7)'; g.lineWidth = 2;
  for (let k = 1; k < 10; k++) {
    const t = k / 10, lx = 4 + (60 - 4) * t, ly = 192 + (80 - 192) * t, rx = 42 + (86 - 42) * t, ry = 192 + (82 - 192) * t;
    g.beginPath(); g.moveTo(lx, ly); g.lineTo(rx, ry); g.stroke();
  }
  // 모서리
  g.lineJoin = 'round';
  g.strokeStyle = 'rgba(120,82,42,.5)'; g.lineWidth = 1.2;
  poly(g, [[52, 80], [96, 48], [244, 48], [244, 152], [200, 188], [52, 188]]); g.stroke();
  g.beginPath(); g.moveTo(200, 80); g.lineTo(200, 188); g.stroke();
  g.strokeStyle = 'rgba(255,250,235,.8)'; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(53, 80.5); g.lineTo(200, 80.5); g.lineTo(243, 49); g.stroke();
  return c;
}

function drawBottle() {
  const R = 2, [c, g] = mkCanvas(160, 212, R);
  softShadow(g, 84, 200, 80, 10, .26);
  const body = new Path2D();
  body.moveTo(44, 198); body.lineTo(44, 82); body.bezierCurveTo(44, 44, 140, 44, 140, 82); body.lineTo(140, 198); body.closePath();
  let gr = g.createLinearGradient(44, 0, 140, 0);
  gr.addColorStop(0, '#b6e5d9'); gr.addColorStop(.3, '#dff6f0'); gr.addColorStop(.62, '#abdcd0'); gr.addColorStop(1, '#78bcab');
  g.fillStyle = gr; g.fill(body);
  // 뚜껑 손잡이
  gr = g.createLinearGradient(72, 0, 108, 0); gr.addColorStop(0, '#bfe9de'); gr.addColorStop(.4, '#e6f8f3'); gr.addColorStop(1, '#86c6b6');
  g.fillStyle = gr; g.fillRect(74, 34, 32, 18);
  g.beginPath(); g.ellipse(90, 52, 16, 5, 0, 0, Math.PI); g.fill();
  g.fillStyle = '#e9faf5'; g.beginPath(); g.ellipse(90, 34, 18, 6.5, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = 'rgba(80,160,145,.45)'; g.lineWidth = 1; g.stroke();
  // 장식 줄
  g.strokeStyle = '#45b0a1'; g.lineWidth = 2.6;
  [74, 84].forEach(y => { g.beginPath(); g.ellipse(92, y, 46, 8, 0, .12, Math.PI - .12); g.stroke(); });
  // 물 나오는 곳
  const arch = new Path2D();
  arch.moveTo(58, 198); arch.lineTo(58, 162); arch.arc(76, 162, 18, Math.PI, 0); arch.lineTo(94, 198); arch.closePath();
  gr = g.createLinearGradient(58, 0, 94, 0); gr.addColorStop(0, '#c8eee4'); gr.addColorStop(1, '#9fd6c9');
  g.fillStyle = gr; g.fill(arch);
  g.strokeStyle = 'rgba(80,160,145,.35)'; g.lineWidth = 1.2; g.stroke(arch);
  // 점 장식

  hamHb.style.height = h + 'px';
  ham.style.transform = `translate(${hm.x - tw / 2}px, ${hm.y - h * SPR_FOOT}px)`;
  ham.style.zIndex = Math.round(hm.y) + 1;
  ham.querySelector('.flip').style.transform = `scaleX(${hm.dir})`;
}
let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - lastFrame) / 1000); lastFrame = now;
  if (hm.state === 'walk') {
    const dx = hm.tx - hm.x, dy = hm.ty - hm.y, d = Math.hypot(dx, dy);
    const v = (st.food > 0 ? 85 : 42) * Math.min(sizeScale(), 1.4);
    if (Math.abs(dx) > 2) hm.dir = dx > 0 ? 1 : -1;
    if (d < 2) {
      if (hm.goal === 'eat' && hm.food && foods.includes(hm.food)) {
        hm.dir = hm.food.x > hm.x ? 1 : -1;
        setState('eat', 2.6);
      } else if (hm.goal === 'sleep') setState('sleep', isNight() ? 90 : 20);
      else setState('idle', 0.8 + Math.random() * 2.5);
      if (hm.goal !== 'eat') hm.food = null;
      hm.goal = null;
    } else { hm.x += dx / d * Math.min(d, v * dt); hm.y += dy / d * Math.min(d, v * dt); }
  } else {
    hm.t -= dt;
    if (hm.t <= 0) {
      if (hm.state === 'eat' && hm.food) {
        const f = hm.food, i = foods.indexOf(f);
        if (i > -1) { foods.splice(i, 1); f.el.classList.add('gone'); setTimeout(() => f.el.remove(), 320); }
        hm.food = null;
        ham.classList.add('full'); setTimeout(() => ham.classList.remove('full'), 3000);
      }
      decide();
    }
  }
  place();
  requestAnimationFrame(frame);
}

function sparkle(x, y, ch = '✦') {
  const s = document.createElement('div');
  s.className = 'sparkle'; s.textContent = ch; s.style.left = x + 'px'; s.style.top = y + 'px';
  document.body.appendChild(s); setTimeout(() => s.remove(), 900);
}

/* ───── 알림창 ───── */
const dim = $('dim');
function alertBox(title, body, buttons) {
  return new Promise(res => {
    dim.innerHTML = `<div class="alert" role="alertdialog" aria-modal="true"><div class="at"><h2></h2><p></p></div></div>`;
    const box = dim.firstChild;
    box.querySelector('h2').textContent = title;
    if (typeof body === 'string') box.querySelector('p').textContent = body;
    else { box.querySelector('p').remove(); box.querySelector('.at').appendChild(body); }
    (buttons || [{ label: T('close') }]).forEach((b, i) => {
      const el = document.createElement('button');
      el.className = 'ab' + (b.bold ? ' bold' : '') + (b.red ? ' red' : '');
      el.textContent = b.label;
      el.onclick = e => { e.stopPropagation(); dim.hidden = true; dim.innerHTML = ''; res(b.value ?? i); };
      box.appendChild(el);
    });
    dim.hidden = false;
  });
}
async function intro() {
  await alertBox(T('intro1t'), T('intro1b'));
  await alertBox(T('intro2t'), T('intro2b'));
}

/* ───── 버튼 ───── */
$('feed').onclick = e => {
  e.stopPropagation();
  catchUp(Date.now());
  if (st.food >= 100) { say(T('full')); return; }
  st.food = Math.min(100, st.food + FEED_STEP); save(); renderStatus();
  dropSeed();
  if (hm.state === 'sleep') setState('idle', 0.3);
  if (hm.state !== 'eat' && hm.goal !== 'eat') goEat();
};
let cleaning = false;
$('clean').onclick = async e => {
  e.stopPropagation();
  if (cleaning) return; cleaning = true;
  const wf = document.createElement('div'); wf.className = 'whiteout';
  document.body.appendChild(wf);
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  field.querySelectorAll('.poop').forEach(p => p.remove());

  await new Promise(r => setTimeout(r, 1000));
  wf.classList.remove('on');
  await new Promise(r => setTimeout(r, 350));

};
let viewing = false;
$('view').onclick = e => { e.stopPropagation(); viewing = true; document.body.classList.add('viewing'); };
$('back').onclick = e => { e.stopPropagation(); viewing = false; document.body.classList.remove('viewing'); };

const LANG_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="2.5" fill="#fff"/><text x="7" y="11" font-size="7.5" font-family="Arial" font-weight="700" fill="#2f9a22">Aa</text><g stroke="#2f9a22" stroke-width="1.4" stroke-linecap="round"><line x1="7" y1="14" x2="17" y2="14"/><line x1="7" y1="17" x2="15" y2="17"/></g></svg>';
function openMenu() {
  const items = [
    ['rename', () => T('rename')],
    ['bgm', () => 'BGM:' + (bgmOn ? 'ON' : 'OFF')],
    ['lang', () => LANG_ICON + '<span>' + T('lang') + '</span>'],
    ['other', () => T('other')],
    ['privacy', () => 'Privacy Policy'],
    ['reset', () => T('reset')],
    ['logout', () => T('logout')],
    ['close', () => T('closeMenu')]
  ];
  dim.innerHTML = `<div class="msheet" role="menu">${items.map(([k]) => `<button class="mbtn${k === 'reset' ? ' red' : ''}" data-k="${k}" role="menuitem"></button>`).join('')}</div>`;
  const paint = () => items.forEach(([k, f]) => { dim.querySelector(`[data-k="${k}"]`).innerHTML = f(); });
  paint();
  dim.hidden = false;
  const close = () => { dim.hidden = true; dim.innerHTML = ''; };
  dim.onclick = e => { if (e.target === dim) { close(); dim.onclick = null; } };
  dim.querySelectorAll('.mbtn').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const k = b.dataset.k;
    if (k === 'bgm') { setBgm(!bgmOn); paint(); return; }
    if (k === 'lang') {
      LANG = LANGS[(LANGS.indexOf(LANG) + 1) % LANGS.length];
      try { localStorage.setItem('hamster.lang', LANG); } catch (er) {}
      applyLang(); paint(); return;
    }
    dim.onclick = null; close();
    if (k === 'rename') {
      const n = prompt(T('renameAsk'), petName());
      if (n && n.trim()) { st.name = n.trim().slice(0, 12); save(); renderStatus(); }
    } else if (k === 'other') location.href = '../trashcan/';
    else if (k === 'privacy') await alertBox('Privacy Policy', T('privacyB'));
    else if (k === 'reset') {
      const ok = await alertBox(T('resetT'), T('resetB', petName(), dayNo()), [
        { label: T('cancel'), value: false }, { label: T('resetOk'), value: true, red: true }]);
      if (ok) { newPet(); intro(); }
    } else if (k === 'logout') {
      catchUp(Date.now()); dirty = true; await flush();
      try { await rpc('hamster_logout', { p_token: token }); } catch (er) {}
      setToken(null); location.reload();
    }
  });
}
$('menu').onclick = e => { e.stopPropagation(); openMenu(); };

/* ───── BGM (오르골) ───── */
let bgmOn = true;
try { bgmOn = localStorage.getItem('hamster.bgm') !== 'off'; } catch (e) {}
let actx = null, master = null, bgmTimer = null, nextT = 0, step = 0;
const MEL = [76, 79, 84, 79, 81, 79, 76, 74, 72, 76, 79, 76, 74, 76, 74, 0, 76, 79, 84, 86, 84, 81, 79, 76, 77, 76, 74, 72, 74, 72, 0, 0];
const BASS = [48, 55, 57, 53];
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function tone(t, m, vol, dur) {
  const o = actx.createOscillator(), o2 = actx.createOscillator(), g = actx.createGain(), g2 = actx.createGain();
  o.type = 'sine'; o2.type = 'sine'; o.frequency.value = hz(m); o2.frequency.value = hz(m) * 2;
  g2.gain.value = 0.22; o2.connect(g2).connect(g); o.connect(g); g.connect(master);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
}
function sched() {
  const spb = 60 / 96 / 2;
  while (nextT < actx.currentTime + 0.35) {
    const m = MEL[step % MEL.length];
    if (m) tone(nextT, m, 0.11, 1.5);
    if (step % 8 === 0) tone(nextT, BASS[(step / 8 | 0) % BASS.length], 0.07, 2.4);
    nextT += spb; step++;
  }
}
function bgmStart() {
  if (!bgmOn || document.hidden) return;
  try {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      actx = new AC(); master = actx.createGain(); master.gain.value = 0.45; master.connect(actx.destination);
    }
    if (actx.state === 'suspended') actx.resume();
    if (!bgmTimer) { nextT = actx.currentTime + 0.1; bgmTimer = setInterval(sched, 100); }
  } catch (e) {}
}
function bgmStop() { clearInterval(bgmTimer); bgmTimer = null; try { actx && actx.suspend(); } catch (e) {} }
function setBgm(on) {
  bgmOn = on;
  try { localStorage.setItem('hamster.bgm', on ? 'on' : 'off'); } catch (e) {}
  on ? bgmStart() : bgmStop();
}
document.addEventListener('pointerdown', () => { if (st && bgmOn && !bgmTimer) bgmStart(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) bgmStop(); });

field.addEventListener('click', e => {
  if (e.target.closest('#ham') || hm.state === 'sleep' || hm.state === 'eat') return;
  walkTo(e.clientX, e.clientY);
});
ham.addEventListener('click', e => {
  e.stopPropagation();
  const h = document.createElement('div');
  h.className = 'heart'; h.textContent = '♥';
  h.style.left = hm.x + 'px'; h.style.top = (hm.y - hamWidth() * 1.05) + 'px';
  document.body.appendChild(h); setTimeout(() => h.remove(), 950);
  if (hm.state === 'sleep') { setState('idle', 1.5); return; }
  ham.classList.remove('hop'); void ham.offsetWidth; ham.classList.add('hop');
  setTimeout(() => ham.classList.remove('hop'), 460);
});

/* 촬영: 지금 화면을 사진으로 */
$('photo').onclick = async e => {
  e.stopPropagation();
  const dpr = 2, cv = document.createElement('canvas');
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  g.drawImage($('grass'), 0, 0, W, H);
  const items = [...field.querySelectorAll('.prop, .poop:not(.gone), .seed:not(.gone)')].map(el => ({ el, z: +el.style.zIndex || 0 }));
  items.push({ el: ham, z: +ham.style.zIndex || 0 });
  items.sort((a, b) => a.z - b.z);
  for (const it of items) {
    let src = it.el.querySelector('img');
    if (it.el === ham) src = [...ham.querySelectorAll('canvas')].find(cv => getComputedStyle(cv).display !== 'none');
    if (!src) continue;
    const r = src.getBoundingClientRect();
    g.save();
    if (it.el === ham && hm.dir < 0) { g.translate(r.left + r.width, r.top); g.scale(-1, 1); g.drawImage(src, 0, 0, r.width, r.height); }
    else g.drawImage(src, r.left, r.top, r.width, r.height);
    g.restore();
  }
  // 글씨
  g.fillStyle = '#333'; g.shadowColor = 'rgba(0,0,0,.28)'; g.shadowOffsetX = 1.5; g.shadowOffsetY = 1.5; g.shadowBlur = 1.5;
  const sys = getComputedStyle(document.body).fontFamily;
  ['nm', 'sz', 'fd', 'cl'].forEach(id => {
    const el = $(id), r = el.getBoundingClientRect(), cs = getComputedStyle(el);
    g.font = `${cs.fontSize} ${cs.fontFamily}`; g.textBaseline = 'alphabetic';
    g.fillText(el.textContent, r.left, r.bottom - parseFloat(cs.fontSize) * 0.22);
  });
  document.querySelectorAll('#status .lb').forEach(el => {
    const r = el.getBoundingClientRect(); g.font = `16px ${sys}`; g.fillText(el.textContent, r.left, r.bottom - 5);
  });
  const dr = $('days').getBoundingClientRect(); g.font = `26px ${sys}`; g.textAlign = 'right';
  g.fillText($('days').textContent, dr.right, dr.bottom - 7);
  const url = cv.toDataURL('image/png');
  const wrap = document.createElement('div');
  wrap.innerHTML = `<p>${T('photoHint')}</p><img alt="">`;
  wrap.querySelector('img').src = url;
  const pick = await alertBox(`${petName()} ${T('day', dayNo())}`, wrap, [{ label: T('photoDl'), value: 'dl' }, { label: T('close'), value: 'close', bold: true }]);
  if (pick === 'dl') { const a = document.createElement('a'); a.href = url; a.download = `hamster-${dayNo()}.png`; a.click(); }
};

/* 가끔 하는 말 */
setInterval(() => {
  if (!st || hm.state === 'sleep' || viewing || !dim.hidden) return;
  if (st.food <= 0) say(T('hungry'));
  else if (st.clean <= 15) say(T('dirty'));
  else if (st.food <= 20) say(T('growl'));
}, 18000);

/* 1초마다 상태 갱신 */
setInterval(() => {
  if (!st) return;
  catchUp(Date.now()); syncPoops(); renderStatus();
}, 1000);
setInterval(() => { if (st) { dirty = true; flush(); } }, 60000);
document.addEventListener('visibilitychange', () => {
  if (!st) return;
  catchUp(Date.now()); dirty = true;
  if (document.visibilityState === 'hidden') flush(true); else save();
});

/* ───── 시작 ───── */
function newPet() {
  const now = Date.now();
  st = { name: '햄스터', start: now, last: now, food: 30, clean: 100, fedH: 0, poops: [] };
  foods.splice(0).forEach(f => f.el.remove());
  save(); syncPoops(true); renderStatus();
}
function layout() {
  W = innerWidth; H = innerHeight;
  drawScene(); placeProps();
  if (st) syncPoops(true);
}
addEventListener('resize', layout);

let running = false;
function showGame(on) {
  ham.style.visibility = on ? '' : 'hidden';
  document.querySelectorAll('.ui').forEach(u => u.hidden = !on);
}
function startGame(first) {
  const before = sizeCm();
  catchUp(Date.now()); renderStatus(); syncPoops(true); showGame(true);
  const grew = sizeCm() - before;
  const a = area();
  hm.x = (a.x0 + a.x1) / 2; hm.y = (a.y0 + a.y1) / 2;
  if (isNight()) { const d = houseDoor(); hm.x = d.x; hm.y = Math.max(a.y0, d.y + 8); setState('sleep', 60); }
  else setState('idle', 1);
  if (!running) { running = true; lastFrame = performance.now(); requestAnimationFrame(frame); }
  if (first) intro();
  else if (grew >= 0.0000005) alertBox(T('grewT', petName()), T('grewB', grew.toFixed(6)));
}
function enter(r) {
  const s0 = r.state;
  if (s0 && s0.start) {
    st = Object.assign({ name: '햄스터', food: 0, clean: 0, fedH: 0, poops: [] }, s0);
    if (!Array.isArray(st.poops)) st.poops = [];
    startGame(false);
  } else { newPet(); startGame(true); }
}

const ERRK = ['bad_username', 'bad_password', 'username_taken', 'wrong_login', 'locked', 'mismatch', 'network'];
const errText = k => ERRK.includes(k) ? T(k) : T('retry');
function loginBox(mode, msg) {
  const signup = mode === 'signup';
  dim.innerHTML = `<div class="alert" role="dialog" aria-modal="true" aria-labelledby="lt"><div class="at">
      <h2 id="lt">${signup ? T('signup') : T('login')}</h2>
      <p>${signup ? T('signupSub') : T('loginSub')}</p>
      <input id="lid" placeholder="${T('id')}" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="16" aria-label="${T('id')}">
      <input id="lpw" type="password" placeholder="${T('pw')}" autocomplete="${signup ? 'new-password' : 'current-password'}" maxlength="72" aria-label="${T('pw')}">
      ${signup ? `<input id="lpw2" type="password" placeholder="${T('pw2')}" autocomplete="new-password" maxlength="72" aria-label="${T('pw2')}">` : ''}
      <p class="err" id="lerr" role="alert"></p>
    </div>
    <button class="ab bold" id="lgo">${signup ? T('join') : T('login')}</button>
    <button class="ab" id="lsw">${signup ? T('backLogin') : T('signup')}</button></div>`;
  dim.hidden = false;
  const id = $('lid'), pw = $('lpw'), pw2 = $('lpw2'), go = $('lgo'), err = $('lerr');
  if (msg) err.textContent = msg;
  $('lsw').onclick = () => loginBox(signup ? 'login' : 'signup');
  const submit = async () => {
    err.textContent = '';
    if (!id.value.trim() || !pw.value) { err.textContent = T('needBoth'); return; }
    if (signup && pw.value !== pw2.value) { err.textContent = T('mismatch'); return; }
    go.disabled = true; go.textContent = T('wait');
    try {
      const r = await rpc(signup ? 'hamster_signup' : 'hamster_login', { p_username: id.value, p_password: pw.value });
      if (r.error) { err.textContent = errText(r.error); return; }
      setToken(r.token);
      const l = await rpc('hamster_load', { p_token: r.token });
      if (l.error) { err.textContent = T('retry'); return; }
      dim.hidden = true; dim.innerHTML = '';
      enter(l);
    } catch (e) { err.textContent = T('network'); }
    finally { if (document.contains(go)) { go.disabled = false; go.textContent = signup ? T('join') : T('login'); } }
  };
  go.onclick = submit;
  [id, pw, pw2].forEach(el => el && el.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); }));
}

function paintArt() {
  [['house', drawHouse()], ['bottle', drawBottle()]].forEach(([id, cv]) => {
    const img = $(id).querySelector('img');
    img.width = cv.width; img.height = cv.height; img.src = cv.toDataURL();
  });
  POOP_URL = drawPoop().toDataURL(); SEED_URL = drawSeed().toDataURL();
  hamHb = ham.querySelector('.hb');
  const hi = new Image();
  hi.onload = () => ['open', 'sleep', 'cheek'].forEach(v => {
    const src = hamVariant(hi, v), dst = ham.querySelector('.v-' + v);
    dst.width = src.width; dst.height = src.height; dst.getContext('2d').drawImage(src, 0, 0);
  });
  hi.src = 'ham.png?v=3';
}
async function boot() {
  applyLang(); paintArt(); layout(); showGame(false);
  if (token) {
    try {
      const r = await rpc('hamster_load', { p_token: token });
      if (!r.error) return enter(r);
      setToken(null);
    } catch (e) { return loginBox('login', T('network')); }
  }
  loginBox('login');
}
boot();
