<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시험대비</title>
<meta name="description" content="역사, 수학, 영어 기말고사 단계별 문제">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="시험대비">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #ffffff;
  --ink: #222222;
  --ink-2: #4a4a4a;
  --sub: #8b8b8b;
  --faint: #c4c4c4;
  --line: #ededed;
  --fill: #f6f6f6;
  --red: #e2372b;
  --omr: #e79aa3;
  --pen: 'Nanum Pen Script', cursive;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  font-size: 16px;
  line-height: 1.5;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.wrap {
  max-width: 520px;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(20px, env(safe-area-inset-right, 0px)) 140px max(20px, env(safe-area-inset-left, 0px));
}

/* top bar */
.top { height: 48px; display: flex; align-items: center; margin-left: -10px; }
.icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: var(--ink); }
.icon:active { background: var(--fill); }

/* home */
.home { padding-top: calc(env(safe-area-inset-top, 0px) + 56px); }
.title { margin: 0; font-weight: 800; letter-spacing: -0.045em; line-height: 0.98; }
.title .t1 { display: block; font-size: 64px; letter-spacing: -0.05em; }
.lead { margin: 14px 0 0; color: var(--sub); font-size: 15px; line-height: 1.6; }

.subjs { margin-top: 40px; border-top: 1px solid var(--line); }
.subj {
  width: 100%; display: flex; align-items: center; gap: 12px;
  padding: 22px 0; border-bottom: 1px solid var(--line);
}
.subj:active { background: var(--fill); }
.subj-main { flex: 1; min-width: 0; }
.subj-name { display: block; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.subj-meta { display: block; margin-top: 3px; font-size: 13px; color: var(--sub); line-height: 1.5; }
.subj.off .subj-name { color: var(--faint); }
.soon { font-size: 13px; color: var(--sub); white-space: nowrap; }
.steps { display: flex; gap: 6px; flex-shrink: 0; }
.step {
  position: relative; width: 26px; height: 26px; display: grid; place-items: center;
  font-size: 14px; font-weight: 700; color: var(--faint); font-variant-numeric: tabular-nums;
}
.step.open { color: var(--ink); }
.step.ok { color: var(--ink); }

/* subject */
.h-subj { margin: 18px 0 0; font-size: 34px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.15; }
.stages { margin-top: 32px; border-top: 1px solid var(--line); }
.stage {
  width: 100%; display: flex; align-items: center; gap: 18px;
  padding: 20px 0; border-bottom: 1px solid var(--line);
}
.stage:active:not(:disabled) { background: var(--fill); }
.stage:disabled { cursor: default; }
.stage-no { width: 36px; font-size: 40px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }
.stage:disabled .stage-no, .stage:disabled .stage-title { color: var(--faint); }
.stage-main { flex: 1; min-width: 0; }
.stage-title { display: block; font-size: 17px; font-weight: 700; }
.stage-meta { display: block; margin-top: 2px; font-size: 13px; color: var(--sub); }
.stage-side { flex-shrink: 0; color: var(--faint); display: flex; align-items: center; }
.best { position: relative; font-family: var(--pen); font-size: 30px; color: var(--red); line-height: 1; padding: 0 6px; }

.row-link { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--line); font-weight: 600; }
.row-link:active { background: var(--fill); }
.row-link .cnt { display: flex; align-items: center; gap: 4px; color: var(--sub); font-weight: 500; font-size: 15px; }

/* quiz */
.qtop {
  position: sticky; top: 0; z-index: 5; background: var(--paper);
  display: flex; align-items: center; gap: 12px;
  height: calc(env(safe-area-inset-top, 0px) + 56px); padding-top: env(safe-area-inset-top, 0px);
  margin: calc(-12px - env(safe-area-inset-top, 0px)) -20px 0; padding-left: 10px; padding-right: 20px;
}
.prog { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--ink); border-radius: 2px; transition: width .3s ease; }
.count { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 42px; text-align: right; }
.count span { color: var(--sub); font-weight: 500; }
.combo { font-family: var(--pen); color: var(--red); font-size: 22px; line-height: 1; white-space: nowrap; }

.q { padding-top: 22px; }
.qtext { margin: 0; font-size: 19px; font-weight: 600; line-height: 1.6; letter-spacing: -0.015em; }
.qnum { position: relative; display: inline-block; font-weight: 800; margin-right: 2px; }
.qtag { color: var(--sub); font-weight: 600; }
.box {
  margin-top: 16px; padding: 14px 16px; border: 1px solid var(--ink);
  font-size: 15px; line-height: 1.75; color: var(--ink-2);
}

.opts { list-style: none; margin: 22px 0 0; padding: 0; }
.opt {
  width: 100%; display: flex; align-items: flex-start; gap: 14px;
  padding: 13px 10px; margin: 0 -10px; width: calc(100% + 20px);
  border-radius: 12px; font-size: 16px; line-height: 1.55;
}
.opt:active:not(:disabled) { background: var(--fill); }
.opt:disabled { cursor: default; }
.bub {
  position: relative; flex-shrink: 0; width: 26px; height: 26px; margin-top: -1px;
  border: 1.5px solid var(--omr); border-radius: 50%;
  display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--omr);
  transition: background .12s, color .12s, border-color .12s;
}
.opt.picked .bub { background: var(--ink); border-color: var(--ink); color: #fff; }
.opt.dim .otext { color: var(--sub); }
.otext { flex: 1; min-width: 0; padding-top: 1px; }

textarea, .sa input {
  width: 100%; font: inherit; font-size: 16px; color: var(--ink);
  border: 1.5px solid var(--line); border-radius: 12px; background: var(--paper);
  padding: 14px 16px; line-height: 1.6; resize: none; -webkit-appearance: none; appearance: none;
}
textarea:focus, .sa input:focus { border-color: var(--ink); outline: none; }
textarea:disabled, .sa input:disabled { background: var(--fill); color: var(--ink-2); }
.answer-area { margin-top: 22px; }
.sa { display: flex; align-items: center; gap: 10px; }
.sa .unit { color: var(--sub); font-size: 16px; white-space: nowrap; }
.keypad { display: flex; gap: 8px; margin-top: 10px; }
.keypad button {
  min-width: 52px; height: 44px; border-radius: 10px; background: var(--fill);
  font-size: 18px; font-weight: 600; text-align: center;
}
.keypad button:active { background: var(--line); }
.hint { margin: 10px 0 0; font-size: 13px; color: var(--sub); }

.after { margin-top: 26px; }
.verdict { font-family: var(--pen); font-size: 30px; line-height: 1.1; color: var(--red); margin: 0 0 12px; }
.verdict.good { color: var(--red); }
.exp { background: var(--fill); border-radius: 14px; padding: 16px 18px; font-size: 15px; line-height: 1.7; color: var(--ink-2); }
.exp + .exp { margin-top: 10px; }
.exp b { display: block; color: var(--ink); font-size: 14px; margin-bottom: 4px; }
.keys { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.key { font-size: 14px; font-weight: 600; padding: 5px 11px; border-radius: 999px; border: 1.5px solid var(--ink); }
.key.hit { background: var(--ink); color: #fff; }
.key.miss { border-color: var(--red); color: var(--red); background: var(--paper); }
.keycap { font-size: 13px; color: var(--sub); margin: 0 0 10px; }

/* fractions */
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .82em; line-height: 1.15; margin: 0 2px; }
.fr > span:first-child { border-bottom: 1.2px solid currentColor; padding: 0 3px 1px; }
.fr > span:last-child { padding: 1px 3px 0; }

/* red pen */
.pen { position: absolute; pointer-events: none; overflow: visible; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.pen path { fill: none; stroke: var(--red); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .45s cubic-bezier(.3,.6,.4,1) forwards; }
.pen.static path { animation: none; stroke-dashoffset: 0; }
.bub .pen { width: 40px; height: 40px; }
.bub .pen.slash { width: 40px; height: 34px; }
.qnum .pen { width: 44px; height: 44px; left: 45%; }
.qnum .pen.tri { width: 40px; height: 38px; top: 46%; }
.step .pen { width: 32px; height: 32px; }
.step .pen path { stroke-width: 2.6; }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* result */
.result { padding-top: calc(env(safe-area-inset-top, 0px) + 48px); }
.r-label { margin: 0; font-size: 15px; color: var(--sub); font-weight: 600; }
.score { position: relative; display: inline-flex; align-items: baseline; margin: 44px 0 14px 24px; color: var(--red); font-family: var(--pen); line-height: .9; }
.score-n { position: relative; font-size: 128px; letter-spacing: -0.02em; }
.score-u { font-size: 48px; margin-left: 4px; }
.score .pen { width: calc(100% + 48px); height: auto; aspect-ratio: 1; left: 50%; top: 46%; }
.score .pen path { stroke-width: 2.4; animation-duration: .7s; animation-delay: .15s; }
.stars { margin: 18px 0 0; font-size: 26px; letter-spacing: 4px; color: var(--line); }
.stars .on { color: var(--ink); }
.r-note { margin: 10px 0 0; font-size: 16px; line-height: 1.6; }
.r-h { margin: 40px 0 0; font-size: 15px; color: var(--sub); font-weight: 600; }
.wlist { list-style: none; margin: 8px 0 0; padding: 0; border-top: 1px solid var(--line); }
.wlist li { padding: 16px 0; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 1.6; }
.wl-st { display: block; font-size: 12px; color: var(--sub); font-weight: 600; margin-bottom: 2px; }
.wl-a { display: block; margin-top: 6px; color: var(--red); font-weight: 600; }
.empty { margin-top: 36px; color: var(--sub); font-size: 15px; line-height: 1.7; }

/* bottom action bar */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--paper);
  padding: 10px max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(20px, env(safe-area-inset-left, 0px));
}
.bar[hidden] { display: none; }
.bar-in { max-width: 520px; margin: 0 auto; display: flex; gap: 8px; }
.btn {
  flex: 1; height: 56px; border-radius: 14px; background: var(--ink); color: #fff;
  font-size: 17px; font-weight: 700; text-align: center; letter-spacing: -0.01em;
}
.btn:active:not(:disabled) { transform: scale(.985); }
.btn:disabled { background: #dadada; cursor: default; }
.btn.ghost { background: var(--fill); color: var(--ink); flex: 0 0 34%; }

@media (prefers-reduced-motion: reduce) {
  .pen path { animation: none; stroke-dashoffset: 0; }
  .prog i { transition: none; }
}
@media (max-width: 360px) {
  .title .t1 { font-size: 54px; }
  .qtext { font-size: 18px; }
}
</style>
</head>
<body>
<main id="app"></main>
<div id="bar" class="bar" hidden></div>

<script>
/* ───────── 문제 ───────── */
const DATA = {
  hist: {
    name: '역사',
    book: '미래엔',
    range: '4. 조선의 성립과 발전, 5. 조선 사회의 변동',
    titles: ['기본 개념', '실전 문제', '서술형 완성', '실전 모의고사'],
    stages: [
      [
        { id: 'h1-01', t: 'mc', q: '요동 정벌에 나섰던 이성계가 군대를 돌려 정권을 잡은 사건은?',
          o: ['위화도 회군', '무신 정변', '인조반정', '계유정난', '홍경래의 난'], a: 0,
          e: '1388년 이성계는 위화도에서 군대를 돌려 개경으로 돌아와 권력을 잡았어. 그 뒤 1392년에 조선을 세웠지.' },
        { id: 'h1-02', t: 'mc', q: '조선 건국에 앞장서고, 재상 중심의 정치를 강조하며 『조선경국전』을 지은 인물은?',
          o: ['정도전', '정몽주', '조광조', '이황', '송시열'], a: 0,
          e: '정도전은 민본 사상을 바탕으로 재상이 중심이 되는 정치를 주장했고, 한양 도성 건설에도 참여했어.' },
        { id: 'h1-03', t: 'mc', q: '조선의 중앙 통치 기구 가운데 왕명 출납을 맡은 곳은?',
          o: ['승정원', '의정부', '의금부', '사헌부', '한성부'], a: 0,
          e: '승정원은 왕의 명령을 전달하고 보고를 받는 비서 기관이야. 의금부는 나라의 큰 죄인을 다스리고, 사헌부는 관리의 잘못을 감찰했어.' },
        { id: 'h1-04', t: 'mc', q: '세종 때의 업적이 아닌 것은?',
          o: ['『경국대전』 완성', '훈민정음 창제', '측우기 제작', '4군 6진 개척', '『농사직설』 편찬'], a: 0,
          e: '『경국대전』은 세조 때 편찬을 시작해서 성종 때 완성되었어.' },
        { id: 'h1-05', t: 'mc', q: '임진왜란 때 한산도 앞바다에서 학익진 전법으로 일본 수군을 크게 무찌른 인물은?',
          o: ['이순신', '권율', '김시민', '곽재우', '김종서'], a: 0,
          e: '한산도 대첩(1592)은 이순신의 대표적인 승리야. 권율은 행주 대첩, 김시민은 진주 대첩, 곽재우는 의병장이야.' },
        { id: 'h1-06', t: 'mc', q: '광해군이 명과 후금 사이에서 펼친 외교 정책은?',
          o: ['중립 외교', '친명배금 정책', '북벌 운동', '사대교린 폐지', '쇄국 정책'], a: 0,
          e: '광해군은 약해지는 명과 커지는 후금 사이에서 실리를 따지는 중립 외교를 펼쳤어. 친명배금은 인조반정 뒤 서인 정권의 정책이야.' },
        { id: 'h1-07', t: 'mc', q: '정조가 설치한 기구로, 정책 자문과 인재 양성을 맡은 곳은?',
          o: ['규장각', '집현전', '홍문관', '비변사', '장용영'], a: 0,
          e: '규장각에서는 서얼 출신인 박제가, 이덕무, 서이수 등도 등용되었어. 집현전은 세종 때 기구야.' },
        { id: 'h1-08', t: 'mc', q: '동학의 핵심 사상으로, 사람이 곧 하늘이라는 뜻을 가진 것은?',
          o: ['인내천', '사대교린', '친명배금', '북벌론', '위정척사'], a: 0,
          e: '인내천 사상은 모든 인간이 평등하다는 생각으로 이어져서 많은 백성의 공감을 얻었어.' },
        { id: 'h1-09', t: 'mc', q: '상공업 진흥과 청의 선진 문물 수용을 주장한 북학파 실학자가 아닌 사람은?',
          o: ['유형원', '박지원', '박제가', '홍대용', '이덕무'], a: 0,
          e: '유형원은 토지 제도 개혁(균전론)을 주장한 농업 중심 실학자야. 북학파는 박지원, 박제가, 홍대용 등이야.' },
        { id: 'h1-10', t: 'es', q: '정조가 실시한 신해통공의 내용을 쓰시오.',
          k: [['시전'], ['금난전권'], ['폐지', '없애', '없앴', '없앰', '철폐'], ['육의전']], need: 3,
          m: '시전 상인의 금난전권을 폐지하여 자유로운 상업 활동을 보장하였다. 단, 육의전은 제외하였다.' },
        { id: 'h1-11', t: 'es', q: '정조가 수원에 화성을 건설한 까닭을 쓰시오.',
          k: [['사도세자'], ['묘', '무덤'], ['이장', '옮'], ['중심지', '새정치', '신도시']], need: 3,
          m: '아버지 사도 세자의 묘를 수원으로 옮기고, 신도시 화성을 새로운 정치의 중심지로 삼으려 하였다.' },
        { id: 'h1-12', t: 'es', q: '동학이 짧은 기간에 교세를 크게 넓힐 수 있었던 까닭을 핵심 사상과 관련지어 쓰시오.',
          k: [['인내천', '사람이곧하늘'], ['평등'], ['공감', '지지', '호응']], need: 2,
          m: '사람이 곧 하늘이라는 인내천 사상을 내세워 모든 인간이 평등하다고 주장하였고, 이것이 많은 백성의 공감을 얻었기 때문이다.' }
      ],
      [
        { id: 'h2-01', t: 'mc', q: '다음 설명에 해당하는 제도는?',
          box: '공납을 집집마다 특산물로 걷는 대신, 가지고 있는 토지의 결수에 따라 쌀, 베, 동전 등으로 내게 하였다. 광해군 때 경기도에서 처음 실시되었다.',
          o: ['대동법', '영정법', '균역법', '과전법', '호패법'], a: 0,

          e: '첫 번째는 접속사 that(생각하는 내용), 나머지는 모두 관계대명사 what(~하는 것)이 들어가.' },
        { id: 'e4-10', t: 'mc', q: '밑줄 친 it이 가리키는 것으로 알맞은 것은?\nThis means you don’t have to worry about getting out of 「it」 when you enter it.',
          o: ['the labyrinth', 'the maze', 'the dead end', 'the prison door', 'the entrance'], a: 0,
          e: '미궁(labyrinth)은 통로가 하나라서, 들어가도 빠져나올 걱정을 안 해도 된다는 내용이야.' },
        { id: 'e4-11', t: 'sa', en: true, q: '<조건>에 맞게 우리말을 영작하시오.\n“우리는 함께 경기를 보며 많은 시간을 보냈다.”\n<조건> spend, watch를 알맞은 형태로 쓸 것, 9단어',
          ans: ['We spent a lot of time watching games together'],
          m: 'We spent a lot of time watching games together. spend + 시간 + -ing' },
        { id: 'e4-12', t: 'sa', en: true, q: '밑줄 친 부분을 분사구문으로 바꿔 문장 전체를 다시 쓰시오.\n「If you look at them closely」, you may find the beauty of order and regularity.',
          ans: ['Looking at them closely, you may find the beauty of order and regularity'],
          m: 'Looking at them closely, you may find the beauty of order and regularity.' },
        { id: 'e4-13', t: 'sa', en: true, q: '<조건>에 맞게 우리말을 영작하시오.\n“그 결과, 그것을 바로잡는 데 우리는 더 많은 시간이 걸릴 것이다.”\n<조건> As a result로 시작, take, fix를 이용할 것',
          ans: ['As a result it will take us more time to fix', 'As a result it will take us more time to fix it'],
          m: 'As a result, it will take us more time to fix. take + 사람 + 시간 + to부정사' },
        { id: 'e4-14', t: 'es', q: 'Suzi Kang과 Brian Pearson이 “Look before you leap.”에 대해 각각 어떤 입장인지 근거와 함께 우리말로 서술하시오.',
          k: [['동의', '찬성'], ['반대', '동의하지'], ['신중', '후회', '실수'], ['기회'], ['주장', '하키']], need: 4,
          m: 'Suzi Kang은 동의한다. 결정하기 전에 신중해야 하며, 그렇지 않으면 후회하거나 실수를 해서 바로잡는 데 시간이 더 걸리기 때문이다. Brian Pearson은 반대한다. 기회는 자주 오지 않아 바로 잡아야 하는데, 자신은 결정이 늦어 하키 팀 주장이 될 기회를 놓쳤기 때문이다.' }
      ]
    ]
  }
};
const ORDER = ['hist', 'math', 'eng'];
const PASS = 60;

/* ───────── 저장 ───────── */
const LS = 'exam32.v1';
let S = load();
function load() {
  try { const v = JSON.parse(localStorage.getItem(LS)); if (v && v.best && v.wrong) return v; } catch (e) {}
  return { best: {}, wrong: {} };
}
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }

/* ───────── 도구 ───────── */
const app = document.getElementById('app');
const bar = document.getElementById('bar');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = s => esc(s).replace(/ ([=:]) /g, ' $1 ').replace(/\[\[(.+?)\|(.+?)\]\]/g, '<span class="fr"><span>$1</span><span>$2</span></span>').replace(/\n/g, '<br>');
const plain = s => String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g, '$1/$2');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).toLowerCase().replace(/[\s.,·!?~'"()\[\]\-_:;]/g, '');
const normM = s => {
  let v = String(s).toLowerCase().replace(/\s+/g, '').replace(/−/g, '-').replace(/루트|root|sqrt/g, '√').replace(/[()]/g, '');
  v = v.replace(/^(답|정답)[:=]?/, '').replace(/^[a-z]+=/, '');
  for (let i = 0; i < 2; i++) v = v.replace(/(cm|m|°|도)$/, '');
  return v;
};
const normE = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
const toFrac = s => String(s).replace(/^(.+)\/(.+)$/, '[[$1|$2]]');
const allQs = k => DATA[k].stages ? DATA[k].stages.flat() : [];
const stageOf = id => +id.split('-')[0].slice(1);
const isOpen = (k, i) => i === 0 || (S.best[k + '-' + (i - 1)] || 0) >= PASS;

const PEN_O = '<path pathLength="1" d="M64 10C84 16 94 36 91 56C88 77 68 92 46 91C24 90 8 72 9 50C10 28 27 10 49 8C61 7 71 10 80 17"/>';
const PEN_SLASH = '<path pathLength="1" d="M14 62C40 42 64 24 88 8"/>';
const PEN_TRI = '<path pathLength="1" d="M49 7C62 30 76 52 92 76C64 73 36 74 8 77C21 54 35 30 51 5"/>';
const pen = (kind, cls = '') => {
  const d = kind === 'x' ? PEN_SLASH : kind === 't' ? PEN_TRI : PEN_O;
  const vb = kind === 't' ? '0 0 100 84' : kind === 'x' ? '0 0 100 70' : '0 0 100 100';
  return `<svg class="pen ${kind === 'x' ? 'slash' : kind === 't' ? 'tri' : ''} ${cls}" viewBox="${vb}" preserveAspectRatio="none" aria-hidden="true">${d}</svg>`;
};
const ICON = {
  back: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  close: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  chev: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  lock: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'
};

function setBar(btns) {
  if (!btns) { bar.hidden = true; bar.innerHTML = ''; return; }
  bar.hidden = false;
  bar.innerHTML = `<div class="bar-in">${btns.map((b, i) => `<button class="btn ${b.ghost ? 'ghost' : ''}" id="bb${i}" ${b.disabled ? 'disabled' : ''}>${b.label}</button>`).join('')}</div>`;
  btns.forEach((b, i) => { document.getElementById('bb' + i).onclick = b.fn; });
}
const barBtn = i => document.getElementById('bb' + i);

/* ───────── 화면 ───────── */
function go(h) { if (location.hash === h) route(); else location.hash = h; }
window.addEventListener('hashchange', route);

function route() {
  const [k, sub] = location.hash.replace(/^#\/?/, '').split('/');
  window.scrollTo(0, 0);
  if (!k || !DATA[k] || !DATA[k].stages) return home();
  if (sub === 'wrong') return wrongNote(k);
  if (sub === 'play') {
    if (!Q || Q.sk !== k) return go('#/' + k);
    return Q.i >= Q.list.length ? result() : renderQ();
  }
  return subject(k);
}

function home() {
  setBar(null);
  document.title = '시험대비';
  const rows = ORDER.map(k => {
    const d = DATA[k];
    const meta = `<span class="subj-meta">${esc(d.book)}<br>${esc(d.range)}</span>`;
    if (!d.stages) {
      return `<div class="subj off"><div class="subj-main"><span class="subj-name">${d.name}</span>${meta}</div><span class="soon">준비 중</span></div>`;
    }
    const steps = d.stages.map((_, i) => {
      const ok = (S.best[k + '-' + i] || 0) >= PASS;
      return `<span class="step ${ok ? 'ok' : isOpen(k, i) ? 'open' : ''}">${i + 1}${ok ? pen('o', 'static') : ''}</span>`;
    }).join('');
    return `<button class="subj" onclick="go('#/${k}')"><div class="subj-main"><span class="subj-name">${d.name}</span>${meta}</div><span class="steps" aria-label="통과한 단계">${steps}</span></button>`;
  }).join('');
  app.innerHTML = `<div class="wrap home">
    <h1 class="title"><span class="t1">시험대비</span></h1>
    <p class="lead">풀고 싶은 과목을 골라 주세요.<br>${PASS}점 이상 받으면 다음 단계가 열려요.</p>
    <nav class="subjs">${rows}</nav>
  </div>`;
}

function subject(k) {
  const d = DATA[k];
  setBar(null);
  document.title = d.name + ' | 시험대비';
  const wtype = k === 'math' ? '주관식' : '서술형';
  const stages = d.stages.map((qs, i) => {
    const best = S.best[k + '-' + i];
    const open = isOpen(k, i);
    const mc = qs.filter(q => q.t === 'mc').length;
    const meta = open ? `객관식 ${mc}문제, ${wtype} ${qs.length - mc}문제` : `${i}단계에서 ${PASS}점 이상 받으면 열려요`;
    const side = !open ? ICON.lock : best != null ? `<span class="best">${best}</span>` : ICON.chev;
    return `<button class="stage" ${open ? '' : 'disabled'} onclick="start('${k}',${i})">
      <span class="stage-no">${i + 1}</span>
      <span class="stage-main"><span class="stage-title">${d.titles[i]}</span><span class="stage-meta">${meta}</span></span>
      <span class="stage-side">${side}</span>
    </button>`;
  }).join('');
  const wc = (S.wrong[k] || []).length;
  app.innerHTML = `<div class="wrap">
    <header class="top"><button class="icon" onclick="go('#/')" aria-label="처음으로">${ICON.back}</button></header>
    <h1 class="h-subj">${d.name}</h1>
    <p class="lead">${esc(d.book)}<br>${esc(d.range)}</p>
    <div class="stages">${stages}</div>
    <button class="row-link" onclick="go('#/${k}/wrong')"><span>오답노트</span><span class="cnt">${wc}문제 ${ICON.chev}</span></button>
  </div>`;
}

function wrongNote(k) {
  const d = DATA[k];
  const ids = S.wrong[k] || [];
  const qs = allQs(k).filter(q => ids.includes(q.id));
  document.title = d.name + ' 오답노트 | 시험대비';
  const list = qs.length
    ? `<ol class="wlist">${qs.map(q => `<li><span class="wl-st">${stageOf(q.id)}단계</span>${fmt(q.q)}<span class="wl-a">${fmt(answerText(q))}</span></li>`).join('')}</ol>`
    : `<p class="empty">아직 틀린 문제가 없어요.<br>틀린 문제는 여기에 모여요.</p>`;
  app.innerHTML = `<div class="wrap">
    <header class="top"><button class="icon" onclick="go('#/${k}')" aria-label="뒤로">${ICON.back}</button></header>
    <h1 class="h-subj">${d.name} 오답노트</h1>
    <p class="lead">다시 풀어서 맞히면 목록에서 빠져요.</p>
    ${list}
  </div>`;
  setBar(qs.length ? [{ label: `${qs.length}문제 다시 풀기`, fn: () => start(k, 'wrong') }] : null);
}

function answerText(q) {
  if (q.t === 'mc') return '정답: ' + q.o[q.a];
  if (q.t === 'sa') return '정답: ' + (q.en ? q.ans[0] : toFrac(q.ans[0])) + (q.unit ? ' ' + q.unit : '');
  return '핵심어: ' + q.k.map(g => g[0]).join(', ');
}

/* ───────── 문제 풀기 ───────── */
let Q = null;

function prep(q) {
  if (q.t !== 'mc' || q.keep) return { ...q };
  const order = shuffle(q.o.map((_, i) => i));
  return { ...q, o: order.map(i => q.o[i]), a: order.indexOf(q.a) };
}

function start(k, stage) {
  let qs;
  if (stage === 'wrong') {
    const ids = S.wrong[k] || [];
    qs = allQs(k).filter(q => ids.includes(q.id));
    if (!qs.length) return go('#/' + k);
  } else {
    if (!isOpen(k, stage)) return;
    qs = DATA[k].stages[stage];
  }
  const mc = shuffle(qs.filter(q => q.t === 'mc'));
  const rest = qs.filter(q => q.t !== 'mc');
  Q = { sk: k, stage, list: [...mc, ...rest].map(prep), i: 0, pts: 0, combo: 0, res: [], done: false };
  go('#/' + k + '/play');
}

function quit() {
  if (Q && Q.i > 0 && !confirm('그만할까요? 지금까지 푼 문제는 점수에 들어가지 않아요.')) return;
  const k = Q ? Q.sk : '';
  Q = null;
  go('#/' + k);
}

function renderQ() {
  const q = Q.list[Q.i], n = Q.i + 1, N = Q.list.length;
  Q.done = false;
  const d = DATA[Q.sk];
  document.title = `${d.name} ${n}번 | 시험대비`;
  let body = '';
  if (q.t === 'mc') {
    body = `<ol class="opts">${q.o.map((t, i) => `<li><button class="opt" data-i="${i}"><span class="bub">${i + 1}</span><span class="otext">${fmt(t)}</span></button></li>`).join('')}</ol>`;
  } else if (q.t === 'es') {
    body = `<div class="answer-area"><textarea id="ans" rows="6" placeholder="핵심 단어가 들어가야 점수가 나와요" aria-label="답안"></textarea></div>`;
  } else if (q.en) {
    body = `<div class="answer-area"><div class="sa"><input id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 입력해 주세요" aria-label="답"></div></div>`;
  } else {
    body = `<div class="answer-area">
      <div class="sa"><input id="ans" type="text" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="답을 입력해 주세요" aria-label="답">${q.unit ? `<span class="unit">${q.unit}</span>` : ''}</div>
      <div class="keypad">${['√', '/', '°', '−'].map(c => `<button type="button" data-k="${c}" aria-label="${c} 넣기">${c}</button>`).join('')}</div>
      <p class="hint">분수는 3/5처럼, 루트는 √ 버튼으로 넣을 수 있어요.</p>
    </div>`;
  }
  const tag = (q.t === 'es' || q.en) ? '<span class="qtag">[서술형]</span> ' : q.t === 'sa' ? '<span class="qtag">[주관식]</span> ' : '';
  app.innerHTML = `<div class="wrap">
    <header class="qtop">
      <button class="icon" onclick="quit()" aria-label="그만하기">${ICON.close}</button>
      <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${N}" aria-valuenow="${Q.i}"><i style="width:${Q.i / N * 100}%"></i></div>
      <span class="combo" id="combo">${Q.combo >= 3 ? Q.combo + '연속' : ''}</span>
      <span class="count">${n}<span>/${N}</span></span>
    </header>
    <section class="q">
      <h2 class="qtext"><span class="qnum" id="qnum">${n}.</span> ${tag}${fmt(q.q)}</h2>
      ${q.box ? `<div class="box">${fmt(q.box)}</div>` : ''}
      ${body}
      <div class="after" id="after"></div>
    </section>
  </div>`;

  if (q.t === 'mc') {
    setBar(null);
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => answerMC(+b.dataset.i));
  } else {
    const inp = document.getElementById('ans');
    setBar([{ label: '채점하기', fn: q.t === 'es' ? gradeES : gradeSA, disabled: true }]);
    inp.addEventListener('input', () => { barBtn(0).disabled = !inp.value.trim(); });
    if (q.t === 'sa') {
      inp.addEventListener('keydown', e => { if (e.key === 'Enter' && inp.value.trim()) { e.preventDefault(); gradeSA(); } });
      app.querySelectorAll('.keypad button').forEach(b => b.onclick = () => {
        const c = b.dataset.k, s = inp.selectionStart ?? inp.value.length, t = inp.selectionEnd ?? s;
        inp.value = inp.value.slice(0, s) + c + inp.value.slice(t);
        inp.focus(); inp.setSelectionRange(s + c.length, s + c.length);
        barBtn(0).disabled = !inp.value.trim();
      });
    }
  }
}

function record(v) {
  const q = Q.list[Q.i], k = Q.sk;
  Q.done = true;
  Q.pts += v;
  Q.res.push({ q, v });
  Q.combo = v === 1 ? Q.combo + 1 : 0;
  const w = new Set(S.wrong[k] || []);
  if (v === 1) w.delete(q.id); else w.add(q.id);
  S.wrong[k] = [...w];
  save();
  const qn = document.getElementById('qnum');
  qn.insertAdjacentHTML('beforeend', pen(v === 1 ? 'o' : v > 0 ? 't' : 'x'));
  document.getElementById('combo').textContent = Q.combo >= 3 ? Q.combo + '연속' : '';
  if (v === 0 && navigator.vibrate) { try { navigator.vibrate(25); } catch (e) {} }
  const last = Q.i === Q.list.length - 1;
  setBar([{ label: last ? '결과 보기' : '다음', fn: next }]);
}

function next() {
  Q.i++;
  window.scrollTo(0, 0);
  if (Q.i >= Q.list.length) result(); else renderQ();
}

function answerMC(i) {
  if (Q.done) return;
  const q = Q.list[Q.i], ok = i === q.a;
  const btns = app.querySelectorAll('.opt');
  btns.forEach((b, j) => { b.disabled = true; if (j !== i && j !== q.a) b.classList.add('dim'); });
  btns[i].classList.add('picked');
  btns[q.a].querySelector('.bub').insertAdjacentHTML('beforeend', pen('o'));
  if (!ok) btns[i].querySelector('.bub').insertAdjacentHTML('beforeend', pen('x'));
  document.getElementById('after').innerHTML =
    `<p class="verdict">${ok ? '맞았어요' : '아쉬워요. 정답은 ' + (q.a + 1) + '번'}</p><div class="exp"><b>해설</b>${fmt(q.e)}</div>`;
  record(ok ? 1 : 0);
}

function gradeES() {
  if (Q.done) return;
  const q = Q.list[Q.i], inp = document.getElementById('ans');
  const text = norm(inp.value);
  const hits = q.k.map(g => g.some(a => text.includes(norm(a))));
  const h = hits.filter(Boolean).length, need = q.need || q.k.length;
  const v = h >= need ? 1 : h >= Math.ceil(need / 2) ? 0.5 : 0;
  inp.disabled = true;
  document.getElementById('after').innerHTML = `
    <p class="verdict">${v === 1 ? '통과' : v > 0 ? '부분 점수' : '아쉬워요'}</p>
    <p class="keycap">핵심어 ${q.k.length}개 중 ${h}개가 들어갔어요. ${need}개 이상이면 통과예요.</p>
    <div class="keys">${q.k.map((g, j) => `<span class="key ${hits[j] ? 'hit' : 'miss'}">${esc(g[0])}</span>`).join('')}</div>
    <div class="exp"><b>모범 답안</b>${fmt(q.m)}</div>`;
  record(v);
}

function gradeSA() {
  if (Q.done) return;
  const q = Q.list[Q.i], inp = document.getElementById('ans');
  if (!inp.value.trim()) return;
  const nf = q.en ? normE : normM;
  const ok = q.ans.map(nf).includes(nf(inp.value));
  inp.disabled = true;
  app.querySelectorAll('.keypad button').forEach(b => b.disabled = true);
  document.getElementById('after').innerHTML = `
    <p class="verdict">${ok ? '맞았어요' : '아쉬워요'}</p>
    <div class="exp"><b>정답 ${fmt(q.en ? q.ans[0] : toFrac(q.ans[0]))}${q.unit ? ' ' + q.unit : ''}</b>${fmt(q.m)}</div>`;
  record(ok ? 1 : 0);
}

/* ───────── 결과 ───────── */
function result() {
  const k = Q.sk, d = DATA[k], N = Q.list.length;
  const score = Math.round(Q.pts / N * 100);
  const right = Q.res.filter(r => r.v === 1).length;
  const part = Q.res.filter(r => r.v > 0 && r.v < 1).length;
  let note = '', nextStage = null;
  if (typeof Q.stage === 'number') {
    const key = k + '-' + Q.stage, prev = S.best[key];
    if (prev == null || score > prev) S.best[key] = score;
    save();
    if (score >= PASS) {
      if (Q.stage < d.stages.length - 1) {
        nextStage = Q.stage + 1;
        note = (prev || 0) >= PASS ? '' : `${Q.stage + 2}단계가 열렸어요.`;
      } else note = '마지막 단계까지 통과했어요.';
    } else note = `${PASS}점 이상 받으면 다음 단계가 열려요.`;
  }
  const stars = score >= 90 ? 3 : score >= 80 ? 2 : score >= PASS ? 1 : 0;
  const wrongs = Q.res.filter(r => r.v < 1);
  document.title = `${d.name} ${score}점 | 시험대비`;
  app.innerHTML = `<div class="wrap result">
    <p class="r-label">${d.name} ${Q.stage === 'wrong' ? '오답노트' : d.titles[Q.stage]}</p>
    <div class="score" aria-label="${score}점"><span class="score-n">${score}${pen('o')}</span><span class="score-u">점</span></div>
    <p class="stars" aria-label="별 ${stars}개">${[0, 1, 2].map(i => `<span class="${i < stars ? 'on' : ''}">★</span>`).join('')}</p>
    <p class="r-note">${N}문제 중 ${right}문제를 맞혔어요${part ? ` (부분 점수 ${part}문제)` : ''}. ${note}</p>
    ${wrongs.length ? `<h3 class="r-h">다시 볼 문제</h3><ol class="wlist">${wrongs.map(r => `<li>${fmt(r.q.q)}<span class="wl-a">${fmt(answerText(r.q))}</span></li>`).join('')}</ol>` : ''}
  </div>`;
  const stage = Q.stage;
  const btns = [{ label: '다시 풀기', ghost: true, fn: () => start(k, stage) }];
  if (nextStage != null) btns.push({ label: `${nextStage + 1}단계 풀기`, fn: () => start(k, nextStage) });
  else btns.push({ label: '목록으로', fn: () => { Q = null; go('#/' + k); } });
  if (stage === 'wrong' && !(S.wrong[k] || []).length) btns[0] = { label: '처음으로', ghost: true, fn: () => { Q = null; go('#/'); } };
  setBar(btns);
}

route();
</script>
</body>
</html>
