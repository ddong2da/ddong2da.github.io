<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>개위터</title>
<meta name="apple-mobile-web-app-title" content="개위터">
<meta name="application-name" content="개위터">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: three-column timeline (nav · 600px feed · sidebar) collapsing to a single feed with a bottom tab bar on phones */
:root{
  --bg:#ffffff; --fg:#0f1419; --fg2:#536471; --fg3:#8b98a5;
  --line:#eff3f4; --line2:#cfd9de; --soft:#f7f9f9; --soft2:#eff3f4;
  --hover:rgba(15,20,25,.03); --hover2:rgba(15,20,25,.1);
  --blue:#1d9bf0; --blue-h:#1a8cd8; --blue-s:rgba(29,155,240,.1); --blue-s2:rgba(29,155,240,.2);
  --pink:#f91880; --pink-s:rgba(249,24,128,.1);
  --green:#00ba7c; --green-s:rgba(0,186,124,.1);
  --red:#f4212e; --red-s:rgba(244,33,46,.1);
  --inv:#0f1419; --inv-fg:#ffffff; --inv-h:#272c30;
  --hdr:rgba(255,255,255,.85);
  --scrim:rgba(0,0,0,.4);
  --shadow:0 0 15px rgba(101,119,134,.2),0 0 3px 1px rgba(101,119,134,.15);
  --banner:#cfd9de;
  --bubble:#eff3f4;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --fg:#e7e9ea; --fg2:#71767b; --fg3:#536471;
    --line:#2f3336; --line2:#333639; --soft:#16181c; --soft2:#202327;
    --hover:rgba(231,233,234,.03); --hover2:rgba(231,233,234,.1);
    --inv:#eff3f4; --inv-fg:#0f1419; --inv-h:#d7dbdc;
    --hdr:rgba(0,0,0,.65); --scrim:rgba(91,112,131,.4);
    --shadow:0 0 15px rgba(255,255,255,.2),0 0 3px 1px rgba(255,255,255,.15);
    --banner:#333639; --bubble:#2f3336;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --fg:#e7e9ea; --fg2:#71767b; --fg3:#536471;
  --line:#2f3336; --line2:#333639; --soft:#16181c; --soft2:#202327;
  --hover:rgba(231,233,234,.03); --hover2:rgba(231,233,234,.1);
  --inv:#eff3f4; --inv-fg:#0f1419; --inv-h:#d7dbdc;
  --hdr:rgba(0,0,0,.65); --scrim:rgba(91,112,131,.4);
  --shadow:0 0 15px rgba(255,255,255,.2),0 0 3px 1px rgba(255,255,255,.15);
  --banner:#333639; --bubble:#2f3336;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:20px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-wrap:break-word;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
button:disabled{cursor:default}
input,textarea{font:inherit;color:inherit;margin:0}
a{color:inherit;text-decoration:none}
img{display:block}
:focus{outline:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.i{width:1.25em;height:1.25em;display:block;flex:none}
.logo{display:block;width:100%;height:100%}
.vb{width:18px;height:18px;flex:none;margin-left:2px}

/* ---------- splash ---------- */
.splash{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100;color:var(--blue)}
.splash .logo{width:72px;height:72px}

/* ---------- avatars ---------- */
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--line2);flex:none}
.av.xs{width:20px;height:20px}
.av.sm{width:32px;height:32px}
.av.md{width:48px;height:48px}

/* ---------- buttons ---------- */
.ib{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;color:var(--fg);transition:background .2s;flex:none}
.ib .i{width:20px;height:20px}
.ib:hover{background:var(--hover2)}
.ib.blue{color:var(--blue)}
.ib.blue:hover{background:var(--blue-s)}
.ib:disabled{opacity:.5}
.btn-blue,.btn-inv,.btn-out,.btn-red{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 16px;border-radius:9999px;font-weight:700;font-size:15px;white-space:nowrap;transition:background .2s,opacity .2s}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{background:var(--blue-h)}
.btn-blue:disabled{opacity:.5;background:var(--blue)}
.btn-inv{background:var(--inv);color:var(--inv-fg)}
.btn-inv:hover{background:var(--inv-h)}
.btn-inv:disabled{opacity:.5}
.btn-out{border:1px solid var(--line2);color:var(--fg)}
.btn-out:hover{background:var(--hover2)}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{filter:brightness(.92)}
.lg{height:52px;font-size:17px;width:100%}
.md-b{height:44px;font-size:15px;width:100%}
.btn-out.blue-t{color:var(--blue)}
.btn-out.blue-t:hover{background:var(--blue-s)}

.fbtn{height:32px;padding:0 16px;border-radius:9999px;font-weight:700;font-size:14px;background:var(--inv);color:var(--inv-fg);white-space:nowrap;flex:none;position:relative;transition:background .2s}
.fbtn:hover{background:var(--inv-h)}
.fbtn .f2{display:none}
.fbtn.following{background:transparent;color:var(--fg);border:1px solid var(--line2)}
@media (hover:hover){
  .fbtn.following:hover{border-color:rgba(244,33,46,.4);background:var(--red-s);color:var(--red)}
  .fbtn.following:hover .f1{display:none}
  .fbtn.following:hover .f2{display:inline}
}
.fbtn.lgf{height:36px;font-size:15px}

/* ---------- shell ---------- */
.shell{display:flex;justify-content:center;min-height:100vh}
.side{position:sticky;top:0;height:100vh;height:100dvh;width:275px;flex:none;padding:0 12px;overflow-y:auto;scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
.side-in{display:flex;flex-direction:column;min-height:100%;padding-top:env(safe-area-inset-top,0px)}
.logo-btn{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--blue);margin-top:2px;transition:background .2s}
.logo-btn:hover{background:var(--blue-s)}
.logo-btn .logo{width:32px;height:32px}
.nav{display:flex;flex-direction:column;align-items:flex-start;margin:2px 0 4px}
.nav-i{display:flex;align-items:center;gap:20px;padding:12px;border-radius:9999px;font-size:20px;line-height:24px;transition:background .2s;margin:2px 0}
.nav-i:hover{background:var(--hover2)}
.nav-ic{position:relative;display:block}
.nav-ic .i{width:26.25px;height:26.25px}
.nav-i .lbl{padding-right:16px}
.nav-i.on .lbl{font-weight:700}
.badge{position:absolute;top:-6px;left:14px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--blue);color:#fff;font-size:11px;line-height:18px;font-weight:700;text-align:center;border:1px solid var(--bg);box-sizing:content-box}
.badge.dot{min-width:0;width:8px;height:8px;padding:0;top:-1px;left:18px}
.post-btn{margin:16px 0;width:90%;height:52px;border-radius:9999px;background:var(--blue);color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;box-shadow:rgba(0,0,0,.08) 0 8px 28px;transition:background .2s}
.post-btn:hover{background:var(--blue-h)}
.post-btn .post-ic{display:none}
.post-btn .i{width:24px;height:24px}
.acct-btn{margin:auto 0 12px;display:flex;align-items:center;gap:12px;padding:12px;border-radius:9999px;width:100%;transition:background .2s;min-width:0}
.acct-btn:hover{background:var(--hover2)}
.acct-meta{display:flex;flex-direction:column;min-width:0;flex:1;line-height:20px}
.acct-meta b,.acct-meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-meta span{color:var(--fg2)}
.acct-dots .i{width:18px;height:18px}

.main{width:600px;max-width:100%;flex:none;border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh;position:relative;min-width:0}
.right{width:350px;flex:none;margin-left:30px;padding-bottom:64px}
.right-in{position:sticky;top:0;padding-top:calc(env(safe-area-inset-top,0px) + 6px);display:flex;flex-direction:column;gap:16px}

@media (max-width:1264px){
  .side{width:88px}
  .side-in{align-items:center}
  .nav{align-items:center}
  .nav-i .lbl,.acct-meta,.acct-dots,.post-btn .post-lbl{display:none}
  .nav-i{gap:0}
  .post-btn{width:52px;height:52px;padding:0}
  .post-btn .post-ic{display:block}
  .acct-btn{width:auto}
  .right{width:290px;margin-left:24px}
}
@media (max-width:1000px){ .right{display:none} }
@media (max-width:688px){
  .side{display:none}
  .main{width:100%;border:0;padding-bottom:64px}
  .d-only{display:none!important}
}
@media (min-width:689px){ .m-only{display:none!important} .tabbar,.fab{display:none!important} }

/* ---------- headers ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr-row{display:flex;align-items:center;gap:20px;min-height:53px;padding:0 16px}
.hdr-row.compact{gap:12px}
.hdr-t{flex:1;min-width:0}
.hdr-t h2{margin:0;font-size:20px;line-height:24px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-t .sub{font-size:13px;line-height:16px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .back{margin-left:-8px}
.mhome{justify-content:space-between;gap:0}
.mhome .mlogo{width:28px;height:28px;color:var(--blue)}
.av-btn{display:block;border-radius:50%}
.w32{width:32px}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:56px;display:flex;justify-content:center;height:53px;padding:0 16px;color:var(--fg2);font-weight:500;transition:background .2s}
.tab:hover{background:var(--hover2)}
.tab span{display:flex;align-items:center;position:relative;height:100%}
.tab.on{color:var(--fg);font-weight:700}
.tab.on span::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:9999px;background:var(--blue);min-width:56px;margin:0 auto}
.hdr-search{flex:1;min-width:0}

/* ---------- search box ---------- */
.sbox{display:flex;align-items:center;gap:4px;height:42px;border-radius:9999px;background:var(--soft2);border:1px solid transparent;padding:0 12px 0 16px;color:var(--fg2)}
.sbox:focus-within{background:var(--bg);border-color:var(--blue);color:var(--blue)}
.sbox .i{width:18px;height:18px}
.sbox input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:0;padding:0 8px;color:var(--fg);font-size:15px}
.sbox input::placeholder{color:var(--fg2)}
.sbox .clr{width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;display:none;place-items:center}
.sbox .clr .i{width:13px;height:13px}
.sbox:focus-within .clr.show{display:grid}

/* ---------- composer ---------- */
.cmp{display:flex;gap:12px;padding:12px 16px 8px}
.cmp-wrap{border-bottom:1px solid var(--line)}
.cmp-av{flex:none}
.cmp-main{flex:1;min-width:0}
.cmp-rt{color:var(--fg2);font-size:15px;margin:2px 0 4px}
.cmp-rt b{color:var(--blue);font-weight:400}
.cmp-ta{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;font-size:20px;line-height:24px;padding:8px 0;min-height:40px;max-height:60vh;overflow-y:auto}
.cmp-ta::placeholder{color:var(--fg2)}
.cmp-media{display:grid;gap:8px;margin:8px 0 4px;grid-template-columns:repeat(2,1fr)}
.cmp-media.n1{grid-template-columns:1fr}
.cmp-media .cm{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:1/1;background:var(--soft2)}
.cmp-media.n1 .cm{aspect-ratio:auto;max-height:420px}
.cmp-media .cm img{width:100%;height:100%;object-fit:cover}
.cmp-media.n1 .cm img{height:auto;max-height:420px}
.cm-x{position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:50%;background:rgba(15,20,25,.75);color:#fff;display:grid;place-items:center;backdrop-filter:blur(4px)}
.cm-x .i{width:18px;height:18px}
.cmp-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.cmp-bar.hide-line{border-top-color:transparent}
.cmp-tools{display:flex;margin-left:-8px}
.cmp-tools label{cursor:pointer}
.cmp-r{display:flex;align-items:center;gap:12px}
.ring{width:30px;height:30px;display:grid;place-items:center;position:relative}
.ring svg{width:30px;height:30px;transform:rotate(-90deg);transition:transform .2s}
.ring.small svg{transform:rotate(-90deg) scale(.67)}
.ring span{position:absolute;font-size:13px;color:var(--fg2)}
.ring.over span{color:var(--red)}
.cmp.cmp-reply .cmp-ta{font-size:20px}
.cmp.collapsed .cmp-bar{display:none}
.cmp.collapsed .cmp-inline{display:flex}
.cmp-inline{display:none;align-items:center}
.cmp.collapsed{align-items:center}
.cmp.collapsed .cmp-main{display:flex;align-items:center;gap:12px}
.cmp.collapsed .cmp-ta{flex:1}

/* ---------- feed ---------- */
.tw{display:block;padding:12px 16px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:background .2s;position:relative}
.tw.no-b{border-bottom:0}
@media (hover:hover){ .tw:hover{background:var(--hover)} }
.tw-ctx{display:flex;align-items:center;gap:12px;color:var(--fg2);font-size:13px;font-weight:700;line-height:16px;margin:-4px 0 4px}
.tw-ctx .ctx-ic{width:40px;display:flex;justify-content:flex-end}
.tw-ctx .i{width:16px;height:16px}
.tw-row{display:flex;gap:12px}
.tw-av{flex:none;width:40px;display:flex;flex-direction:column;align-items:center;position:relative}
.tw-av .tl{flex:1;width:2px;background:var(--line2);margin-top:4px;margin-bottom:-12px;min-height:12px}
.tw-av .tl-top{position:absolute;top:-12px;height:8px;width:2px;background:var(--line2)}
.tw-b{flex:1;min-width:0;padding-bottom:12px}
.tw-h{display:flex;align-items:center;white-space:nowrap;min-width:0;line-height:20px}
.tw-h .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;min-width:0;flex-shrink:1}
.tw-h .nm:hover{text-decoration:underline}
.tw-h .hd{color:var(--fg2);overflow:hidden;text-overflow:ellipsis;min-width:0;flex-shrink:10;margin-left:4px}
.tw-h .dot{color:var(--fg2);padding:0 4px;flex:none}
.tw-h .tm{color:var(--fg2);flex:none}
.tw-h .tm:hover{text-decoration:underline}
.tw-h .more{margin:-8px -8px -8px auto;color:var(--fg2);width:34px;height:34px}
.tw-h .more .i{width:18px;height:18px}
.tw-h .more:hover{color:var(--blue);background:var(--blue-s)}
.tw-rep{color:var(--fg2);margin-top:2px}
.tw-rep b{color:var(--blue);font-weight:400}
.tw-x{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.lk{color:var(--blue);cursor:pointer}
.lk:hover{text-decoration:underline}
.acts{display:flex;justify-content:space-between;margin-top:12px;max-width:100%;gap:4px}
.acts-r{display:flex;gap:4px}
.act{display:flex;align-items:center;color:var(--fg2);font-size:13px;line-height:16px;min-width:0;flex:1 1 0;max-width:110px}
.acts-r .act{flex:none}
.act .ic{width:34px;height:34px;margin:-8px -4px -8px -8px;border-radius:50%;display:grid;place-items:center;transition:background .2s,color .2s;flex:none}
.act .ic .i{width:18.75px;height:18.75px}
.act .cnt{padding:0 4px;overflow:hidden;white-space:nowrap;font-variant-numeric:tabular-nums;display:inline-block;transition:color .2s}
.a-rp:hover,.a-vw:hover,.a-bm:hover,.a-sh:hover{color:var(--blue)}
.a-rp:hover .ic,.a-vw:hover .ic,.a-bm:hover .ic,.a-sh:hover .ic{background:var(--blue-s)}
.a-rt:hover,.a-rt.on{color:var(--green)}
.a-rt:hover .ic{background:var(--green-s)}
.a-lk:hover,.a-lk.on{color:var(--pink)}
.a-lk:hover .ic{background:var(--pink-s)}
.a-bm.on{color:var(--blue)}
.a-lk.pop .ic .i{animation:pop .45s cubic-bezier(.2,.9,.3,1.3)}
.a-lk.pop .ic{position:relative}
.a-lk.pop .ic::after{content:"";position:absolute;inset:6px;border-radius:50%;border:2px solid var(--pink);animation:burst .45s ease-out forwards}
@keyframes pop{0%{transform:scale(.3)}55%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes burst{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.4);opacity:0}}
.cnt.roll{animation:roll .35s ease-out}
@keyframes roll{0%{transform:translateY(45%);opacity:.25}100%{transform:none;opacity:1}}
.a-rt.spin .ic .i{animation:pop .4s ease-out}

.media{display:grid;gap:2px;margin-top:12px;border-radius:16px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/9;max-width:100%}
.media.m1{display:block;aspect-ratio:auto}
.media.m2{grid-template-columns:1fr 1fr}
.media.m3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.media.m3 .mi:first-child{grid-row:1/3}
.media.m4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.mi{display:block;width:100%;height:100%;min-height:0;overflow:hidden;background:var(--soft2)}
.mi img{width:100%;height:100%;object-fit:cover}
.media.m1 .mi img{height:auto;max-height:510px;min-height:120px}

.qc{border:1px solid var(--line2);border-radius:16px;margin-top:12px;overflow:hidden;cursor:pointer;transition:background .2s}
@media (hover:hover){ .qc:hover{background:var(--hover)} }
.qc-h{display:flex;align-items:center;gap:4px;padding:12px 12px 0;white-space:nowrap;min-width:0}
.qc-h .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;min-width:0;margin-left:4px}
.qc-h .hd,.qc-h .dot,.qc-h .tm{color:var(--fg2)}
.qc-h .hd{overflow:hidden;text-overflow:ellipsis;min-width:0;flex-shrink:10}
.qc-x{padding:2px 12px 12px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.qc .media{margin:0;border:0;border-radius:0;border-top:1px solid var(--line)}
.qc.qc-x-only{padding:16px;color:var(--fg2);cursor:default;background:var(--soft)}
.qc .qc-x:empty{display:none}

.newpill{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);z-index:15;display:flex;justify-content:center;height:0;overflow:visible}
.newpill button{margin-top:10px;display:flex;align-items:center;gap:6px;height:40px;padding:0 16px 0 12px;border-radius:9999px;background:var(--blue);color:#fff;font-weight:700;box-shadow:rgba(0,0,0,.15) 0 4px 16px;animation:dropin .3s ease-out}
.newpill .i{width:16px;height:16px}
.newpill .avs{display:flex}
.newpill .avs img{width:24px;height:24px;border-radius:50%;border:2px solid var(--blue);margin-left:-6px}
.newpill .avs img:first-child{margin-left:0}
@keyframes dropin{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:688px){ .newpill{top:calc(env(safe-area-inset-top,0px) + 110px)} }
@media (min-width:689px){ .newpill{top:calc(env(safe-area-inset-top,0px) + 58px)} }

.spin{display:flex;justify-content:center;padding:28px 0}
.spin i{width:26px;height:26px;border-radius:50%;border:3px solid var(--blue-s2);border-top-color:var(--blue);animation:sp .8s linear infinite}
.spin.sm{padding:16px 0}
.spin.sm i{width:20px;height:20px;border-width:2.5px}
@keyframes sp{to{transform:rotate(360deg)}}
.more-load{min-height:1px}
.fade-in{animation:fin .35s ease-out}
@keyframes fin{from{opacity:0;background:var(--blue-s)}to{opacity:1}}

.empty{padding:32px 32px 40px;max-width:400px;margin:0 auto}
.empty h3{font-size:31px;line-height:36px;font-weight:800;margin:0 0 8px;letter-spacing:-.3px}
.empty p{margin:0 0 24px;color:var(--fg2)}

/* ---------- detail ---------- */
.dt{padding:12px 16px 0}
.dt.line-top{position:relative}
.dt-h{display:flex;align-items:center;gap:12px;position:relative}
.dt-h .tl-top{position:absolute;left:19px;top:-12px;height:8px;width:2px;background:var(--line2)}
.dt-who{flex:1;min-width:0;line-height:20px}
.dt-who .nm-row{display:flex;align-items:center;min-width:0}
.dt-who .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.dt-who .nm:hover{text-decoration:underline}
.dt-who .hd{color:var(--fg2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt-h .more{color:var(--fg2)}
.dt-h .more:hover{color:var(--blue);background:var(--blue-s)}
.dt .tw-rep{margin-top:8px}
.dt-x{font-size:17px;line-height:24px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px}
.dt-time{color:var(--fg2);padding:16px 0;border-bottom:1px solid var(--line)}
.dt-time b{color:var(--fg);font-weight:700}
.dt-stats{display:flex;flex-wrap:wrap;gap:4px 20px;padding:16px 0;border-bottom:1px solid var(--line);color:var(--fg2)}
.dt-stats:empty{display:none}
.dt-stats button{color:var(--fg2)}
.dt-stats button:hover{text-decoration:underline}
.dt-stats b{color:var(--fg);font-weight:700;margin-right:4px;font-variant-numeric:tabular-nums}
.dt-acts{display:flex;justify-content:space-around;height:48px;align-items:center;border-bottom:1px solid var(--line)}
.dt-acts .act{flex:none;max-width:none}
.dt-acts .act .ic{width:40px;height:40px;margin:0}
.dt-acts .act .ic .i{width:22.5px;height:22.5px}
.dt-acts .cnt{display:none}
.dt-cmp{border-bottom:1px solid var(--line)}
.dt .media{margin-top:12px}

/* ---------- notifications ---------- */
.nt{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .2s}
@media (hover:hover){ .nt:hover{background:var(--hover)} }
.nt-l{width:40px;display:flex;justify-content:flex-end;flex:none}
.n-ic .i{width:30px;height:30px}
.n-ic.pink{color:var(--pink)}
.n-ic.green{color:var(--green)}
.n-ic.blue{color:var(--blue)}
.nt-b{flex:1;min-width:0}
.nt-avs{display:flex;gap:6px;flex-wrap:wrap}
.nt-t{margin-top:12px}
.nt-t b{font-weight:700}
.nt-q{margin-top:12px;color:var(--fg2);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- profile ---------- */
.pf-banner{aspect-ratio:3/1;background:var(--banner);background-size:cover;background-position:center;width:100%;position:relative;display:block;overflow:hidden}
.pf-banner img{width:100%;height:100%;object-fit:cover}
.pf-top{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 16px 0;min-height:68px}
.pf-av{position:relative;z-index:1;margin-top:-15%;width:25%;min-width:80px;max-width:139px;aspect-ratio:1/1;border-radius:50%;border:4px solid var(--bg);background:var(--bg);overflow:hidden;cursor:pointer;flex:none}
.pf-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.pf-btns{display:flex;gap:8px;align-items:center}
.pf-btns .ib{border:1px solid var(--line2);width:36px;height:36px}
.pf-btns .ib .i{width:18px;height:18px}
.pf-info{padding:4px 16px 0}
.pf-nm{display:flex;align-items:center;font-size:20px;line-height:24px;font-weight:800;margin-top:4px;min-width:0}
.pf-nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-nm .vb{width:20px;height:20px}
.pf-hd{color:var(--fg2);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.chip{font-size:12px;line-height:16px;padding:0 4px;border-radius:4px;background:var(--soft2);color:var(--fg2)}
.pf-bio{margin-top:12px;white-space:pre-wrap}
.pf-meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:12px;color:var(--fg2)}
.pf-meta span{display:flex;align-items:center;gap:4px}
.pf-meta .i{width:18px;height:18px}
.pf-meta a{color:var(--blue)}
.pf-cnt{display:flex;gap:20px;margin:12px 0 0;color:var(--fg2)}
.pf-cnt button{color:var(--fg2)}
.pf-cnt button:hover{text-decoration:underline}
.pf-cnt b{color:var(--fg);font-weight:700;margin-right:4px}
.pf-tabs{border-bottom:1px solid var(--line);margin-top:4px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}
.mgrid button{aspect-ratio:1/1;overflow:hidden;background:var(--soft2)}
.mgrid img{width:100%;height:100%;object-fit:cover}
.sk{background:var(--soft2);border-radius:4px;height:14px;margin-top:10px}

/* ---------- user rows / trends ---------- */
.ur{display:flex;gap:12px;padding:12px 16px;cursor:pointer;transition:background .2s;align-items:flex-start}
@media (hover:hover){ .ur:hover{background:var(--hover)} }
.ur-b{flex:1;min-width:0;line-height:20px}
.ur-b .nm-row{display:flex;align-items:center;min-width:0}
.ur-b .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ur-b .hd{color:var(--fg2);white-space:nowrap;display:flex;gap:4px;align-items:center;min-width:0}
.ur-b .hd .hdt{overflow:hidden;text-overflow:ellipsis;min-width:0}
.ur-b .hd .chip{flex:none}
.ur-b .bio{margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trend{display:flex;align-items:flex-start;gap:8px;padding:12px 16px;cursor:pointer;transition:background .2s}
@media (hover:hover){ .trend:hover{background:var(--hover)} }
.trend-b{flex:1;min-width:0}
.tr-c,.tr-p{font-size:13px;line-height:16px;color:var(--fg2)}
.tr-n{font-weight:700;margin:2px 0}
.trend .ib{color:var(--fg2);margin:-6px -8px 0 0}
.trend .ib .i{width:18px;height:18px}
.sec-t{font-size:20px;line-height:24px;font-weight:800;padding:12px 16px;margin:0}
.sec-more{display:block;width:100%;padding:16px;color:var(--blue);transition:background .2s}
.sec-more:hover{background:var(--hover)}
.box{background:var(--soft);border-radius:16px;overflow:hidden;border:1px solid transparent}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .box{background:transparent;border-color:var(--line)} }
:root[data-theme="dark"] .box{background:transparent;border-color:var(--line)}
.box .trend:hover,.box .ur:hover,.box .sec-more:hover{background:var(--hover2)}
.right .sbox-wrap{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 4px;margin-top:-6px}
.foot{font-size:13px;color:var(--fg2);padding:0 16px;line-height:20px}
.divider{height:1px;background:var(--line);margin:0}
.thick{height:12px;background:var(--soft);border-bottom:1px solid var(--line);border-top:1px solid var(--line)}

/* ---------- DMs ---------- */
.th{display:flex;gap:12px;padding:16px;cursor:pointer;transition:background .2s;align-items:flex-start}
@media (hover:hover){ .th:hover{background:var(--hover)} }
.th-b{flex:1;min-width:0}
.th-top{display:flex;align-items:center;white-space:nowrap;min-width:0}
.th-top .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.th-top .hd{color:var(--fg2);overflow:hidden;text-overflow:ellipsis;margin-left:4px;min-width:0;flex-shrink:10}
.th-top .dot,.th-top .tm{color:var(--fg2);flex:none}
.th-top .dot{padding:0 4px}
.th-last{color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th.unread .th-last{color:var(--fg);font-weight:700}
.th .udot{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:16px;flex:none}
.chat{display:flex;flex-direction:column;min-height:calc(100vh - 54px);min-height:calc(100dvh - 54px)}
.chat-prof{display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 16px 24px;border-bottom:1px solid var(--line);cursor:pointer;gap:2px;transition:background .2s}
.chat-prof:hover{background:var(--hover)}
.chat-prof .av{width:64px;height:64px;margin-bottom:4px}
.chat-prof .nm{font-weight:700;font-size:15px;display:flex;align-items:center}
.chat-prof .hd,.chat-prof .meta{color:var(--fg2)}
.chat-prof .bio{margin:8px 0 2px;max-width:420px}
.msgs{flex:1;padding:16px 16px 8px;display:flex;flex-direction:column;gap:2px}
.msg{display:flex;flex-direction:column;max-width:80%}
.msg.m{align-self:flex-end;align-items:flex-end}
.msg.n{align-self:flex-start;align-items:flex-start}
.bub{padding:12px 16px;border-radius:24px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:20px}
.msg.m .bub{background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg.n .bub{background:var(--bubble);color:var(--fg);border-bottom-left-radius:4px}
.msg.mid.m .bub{border-bottom-right-radius:4px;border-top-right-radius:4px}
.msg.mid.n .bub{border-bottom-left-radius:4px;border-top-left-radius:4px}
.msg .mt{font-size:13px;color:var(--fg2);margin:4px 2px 12px}
.typing .bub{display:flex;gap:4px;padding:16px 18px}
.typing .bub i{width:7px;height:7px;border-radius:50%;background:var(--fg2);animation:bl 1.2s infinite}
.typing .bub i:nth-child(2){animation-delay:.2s}
.typing .bub i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.dm-bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px))}
@media (max-width:688px){ .dm-bar{bottom:calc(53px + env(safe-area-inset-bottom,0px));padding-bottom:6px} }
.dm-in{display:flex;align-items:flex-end;gap:4px;background:var(--soft2);border-radius:16px;padding:4px 4px 4px 16px}
.dm-in textarea{flex:1;border:0;outline:0;background:transparent;resize:none;padding:9px 0;max-height:140px;line-height:20px;min-width:0}
.dm-in textarea::placeholder{color:var(--fg2)}

/* ---------- tab bar / fab ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar button{flex:1;height:53px;display:grid;place-items:center;color:var(--fg)}
.tabbar .nav-ic .i{width:26.25px;height:26.25px}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(53px + 16px + env(safe-area-inset-bottom,0px));z-index:31;width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:rgba(101,119,134,.3) 0 2px 10px,rgba(0,0,0,.1) 0 6px 16px}
.fab .i{width:24px;height:24px}
.fab:active{transform:scale(.96)}

/* ---------- layers ---------- */
.lay{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto}
.lay .scrim{position:fixed;inset:0;background:var(--scrim)}
.lay.anim .dlg{animation:dlgin .18s ease-out}
@keyframes dlgin{from{transform:scale(.98);opacity:.4}to{transform:none;opacity:1}}
.dlg{position:relative;z-index:1;background:var(--bg);border-radius:16px;width:600px;max-width:calc(100vw - 32px);margin:5vh auto 24px;min-height:0;display:flex;flex-direction:column}
.dlg-top{display:flex;align-items:center;gap:8px;height:53px;padding:0 16px;position:sticky;top:0;background:var(--hdr);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px 16px 0 0;z-index:2}
.dlg-top .ttl{flex:1;font-size:20px;font-weight:700;min-width:0}
.dlg-top .back,.dlg-top .x{margin-left:-8px}
.dlg-top .step{font-size:20px;font-weight:700}
.dlg-top .mid{position:absolute;left:50%;transform:translateX(-50%);width:30px;height:30px;color:var(--fg)}
.dlg-body{padding:0 16px 16px}
.dlg .cmp{padding-left:0;padding-right:0}
.dlg-txt{color:var(--fg2);margin:0}
.cmpdlg{min-height:280px}
.cmpdlg .cmp{padding:4px 16px 12px}
.cmpdlg .ctx-tw{padding:8px 16px 0}
.cmpdlg .ctx-tw .tw{padding:4px 0 0;border:0;cursor:default}
.cmpdlg .ctx-tw .tw:hover{background:none}
.cmpdlg .ctx-tw .acts{display:none}
.cmpdlg .ctx-tw .tw-b{padding-bottom:16px}
.cmpdlg .ctx-tw .tw-av .tl{margin-bottom:-4px}
.cmpdlg .ctx-tw .more{display:none}
.top-post{display:none}
.draft-top{color:var(--blue);font-weight:700;margin-left:auto}
@media (max-width:688px){
  .lay{align-items:stretch}
  .dlg{width:100%;max-width:none;margin:0;border-radius:0;min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .dlg-top{border-radius:0}
  .cmpdlg .top-post{display:inline-flex;margin-left:auto;height:32px;padding:0 16px;font-size:14px}
  .cmpdlg .cmp-post{display:none}
  .cmpdlg .x{display:none}
  .cmpdlg .cancel{display:inline-block}
  .cmpdlg .cmp-bar{position:sticky;bottom:0;background:var(--bg)}
}
.cancel{display:none;font-size:16px}
.confirm{width:320px;padding:32px;border-radius:16px;margin:auto}
@media (max-width:688px){ .confirm{width:calc(100% - 64px);min-height:0;margin:auto;border-radius:16px;padding:32px} .lay.c{align-items:center} }
.confirm h3{margin:0 0 8px;font-size:20px;line-height:24px;font-weight:700}
.confirm p{margin:0 0 24px;color:var(--fg2)}
.confirm .btns{display:flex;flex-direction:column;gap:12px}
.confirm .btns button{height:44px;width:100%}

/* auth dialog */
.authdlg{min-height:min(650px,90vh)}
.authdlg .dlg-body{padding:0 80px 24px;display:flex;flex-direction:column;flex:1}
@media (max-width:688px){ .authdlg .dlg-body{padding:0 24px 24px} }
.authdlg h2{font-size:31px;line-height:36px;font-weight:800;margin:20px 0 28px;letter-spacing:-.4px}
.authdlg .lead{color:var(--fg2);margin:-20px 0 24px}
.authdlg .grow{flex:1}
.authdlg .bottom{display:flex;flex-direction:column;gap:12px;padding-top:24px}
.authdlg .alt{color:var(--fg2);margin-top:28px}
.authdlg .alt button{color:var(--blue)}
.authdlg .alt button:hover{text-decoration:underline}
.fld{display:block;position:relative;border:1px solid var(--line2);border-radius:4px;margin-bottom:24px;transition:border-color .15s,box-shadow .15s;cursor:text}
.fld:focus-within{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.fld.err{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.fld-l{position:absolute;left:8px;top:16px;color:var(--fg2);font-size:17px;line-height:24px;transition:all .15s;pointer-events:none}
.fld.up .fld-l,.fld:focus-within .fld-l{top:8px;font-size:13px;line-height:16px}
.fld:focus-within .fld-l{color:var(--blue)}
.fld.err .fld-l{color:var(--red)}
.fld-c{position:absolute;right:8px;top:8px;font-size:13px;line-height:16px;color:var(--fg2);display:none}
.fld:focus-within .fld-c{display:block}
.fld input,.fld textarea{display:block;width:100%;border:0;outline:0;background:transparent;font-size:17px;line-height:24px;padding:28px 8px 8px;resize:none}
.fld textarea{min-height:96px}
.fld .fld-pre{position:absolute;left:8px;bottom:8px;font-size:17px;line-height:24px;color:var(--fg2);display:none}
.fld.up .fld-pre,.fld:focus-within .fld-pre{display:block}
.fld.pre input{padding-left:24px}
.fld-eye{position:absolute;right:6px;bottom:4px}
.fld-eye .i{width:20px;height:20px}
.fld-ok{position:absolute;right:10px;bottom:12px;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:none;place-items:center}
.fld-ok .i{width:14px;height:14px}
.fld.ok .fld-ok{display:grid}
.fld-err{color:var(--red);font-size:13px;margin:-20px 8px 20px;line-height:16px}
.fld.ro{background:var(--soft2);cursor:default}
.pick-av{display:grid;place-items:center;margin:16px 0 0}
.pick-av label{position:relative;width:180px;height:180px;border-radius:50%;overflow:hidden;cursor:pointer;display:block;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line2)}
.pick-av img{width:100%;height:100%;object-fit:cover}
.pick-av .cam{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.25)}
.pick-av .cam span{width:44px;height:44px;border-radius:50%;background:rgba(15,20,25,.75);color:#fff;display:grid;place-items:center}
.pick-av .cam .i{width:22px;height:22px}

/* edit profile */
.ep-banner{position:relative;aspect-ratio:3/1;background:var(--banner);overflow:hidden}
.ep-banner img{width:100%;height:100%;object-fit:cover}
.ep-banner .cams,.ep-av .cams{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,.3)}
.cam-b{width:44px;height:44px;border-radius:50%;background:rgba(15,20,25,.75);color:#fff;display:grid;place-items:center;cursor:pointer;transition:background .2s}
.cam-b:hover{background:rgba(39,44,48,.75)}
.cam-b .i{width:22px;height:22px}
.ep-av{position:relative;width:112px;height:112px;border-radius:50%;border:4px solid var(--bg);overflow:hidden;margin:-48px 0 0 16px;background:var(--bg)}
.ep-av img{width:100%;height:100%;object-fit:cover}
.ep-fields{padding:24px 16px 8px}

/* menus / sheets */
.menu{position:fixed;z-index:70;background:var(--bg);border-radius:12px;box-shadow:var(--shadow);min-width:240px;max-width:360px;overflow:hidden;padding:4px 0;animation:fin2 .12s ease-out}
@keyframes fin2{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.menu .mi-b{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;font-weight:700;font-size:15px;transition:background .15s}
.menu .mi-b:hover{background:var(--hover2)}
.menu .mi-b .i{width:18.75px;height:18.75px}
.menu .mi-b.red{color:var(--red)}
.menu .mi-acct{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;transition:background .15s}
.menu .mi-acct:hover{background:var(--hover2)}
.menu .mi-acct .acct-meta{display:flex}
.menu .mi-acct .ck{color:var(--green)}
.menu .mi-acct .ck .i{width:18px;height:18px}
.menu .sep{height:1px;background:var(--line);margin:4px 0}
.menu-scrim{position:fixed;inset:0;z-index:69}
.sheet-wrap{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-wrap .scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;background:var(--bg);border-radius:16px 16px 0 0;padding:8px 0 calc(16px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 8px}
.sheet .mi-b{display:flex;align-items:center;gap:12px;width:100%;padding:14px 20px;font-weight:700;font-size:16px}
.sheet .mi-b .i{width:20px;height:20px}
.sheet .mi-b.red{color:var(--red)}
.sheet .mi-acct{display:flex;align-items:center;gap:12px;padding:12px 20px;width:100%}
.sheet .mi-acct .ck{color:var(--green)}
.sheet .sep{height:1px;background:var(--line);margin:4px 0}
.sheet .cancel-b{display:flex;align-items:center;justify-content:center;margin:12px 20px 0;height:44px;border:1px solid var(--line2);border-radius:9999px;font-weight:700;width:calc(100% - 40px)}

/* drawer */
.drawer-wrap{position:fixed;inset:0;z-index:70}
.drawer-wrap .scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s}
.drawer{position:absolute;top:0;bottom:0;left:0;width:min(300px,80vw);background:var(--bg);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 0 calc(16px + env(safe-area-inset-bottom,0px));animation:slin .22s cubic-bezier(.2,.8,.2,1);box-shadow:rgba(0,0,0,.2) 0 0 24px}
@keyframes slin{from{transform:translateX(-100%)}to{transform:none}}
.dr-top{display:flex;justify-content:space-between;align-items:flex-start;padding:0 16px}
.dr-accts{display:flex;gap:8px;align-items:center}
.dr-accts img{width:30px;height:30px}
.dr-nm{font-weight:700;font-size:17px;padding:8px 16px 0;display:flex;align-items:center;min-width:0}
.dr-nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-h{color:var(--fg2);padding:0 16px}
.dr-f{display:flex;gap:16px;padding:12px 16px;color:var(--fg2)}
.dr-f b{color:var(--fg);margin-right:4px}
.dr-nav button{display:flex;align-items:center;gap:20px;width:100%;padding:14px 16px;font-size:20px;font-weight:700;line-height:24px}
.dr-nav button .i{width:24px;height:24px}
.dr-sec{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.dr-sec button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;font-weight:700}
.dr-sec .i{width:20px;height:20px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;animation:fade .2s}
.lb img{max-width:100%;max-height:100%;object-fit:contain;user-select:none}
.lb .ib{position:absolute;color:#fff;background:rgba(15,20,25,.75);width:36px;height:36px}
.lb .ib:hover{background:rgba(39,44,48,.75)}
.lb .lb-x{top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px))}
.lb .lb-p{left:calc(12px + env(safe-area-inset-left,0px));top:50%;margin-top:-18px}
.lb .lb-n{right:calc(12px + env(safe-area-inset-right,0px));top:50%;margin-top:-18px}

/* toast */
.toasts{position:fixed;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
@media (max-width:688px){ .toasts{bottom:calc(53px + 16px + env(safe-area-inset-bottom,0px))} }
.toast{pointer-events:auto;background:var(--blue);color:#fff;border-radius:4px;padding:12px 16px;display:flex;align-items:center;gap:24px;box-shadow:rgba(101,119,134,.2) 0 0 15px;animation:tin .2s ease-out;max-width:100%}
.toast button{font-weight:700;color:#fff}
.toast button:hover{text-decoration:underline}
.toast.out{opacity:0;transform:translateY(8px);transition:all .2s}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* auth landing */
.auth{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.auth-in{flex:1;display:flex;align-items:center}
.auth-logo{flex:1;display:grid;place-items:center;color:var(--blue);padding:32px}
.auth-logo .logo{width:min(380px,100%);height:auto;aspect-ratio:1/1}
.auth-main{flex:1;padding:16px 32px;min-width:0}
.auth-mlogo{display:none;width:44px;height:44px;color:var(--blue);margin-bottom:40px}
.auth h1{font-size:64px;line-height:84px;font-weight:800;letter-spacing:-1.2px;margin:48px 0;word-break:keep-all;text-wrap:balance}
.auth h2{font-size:31px;line-height:36px;font-weight:800;margin:0 0 32px;letter-spacing:-.4px}
.auth-btns{width:300px;max-width:100%;display:flex;flex-direction:column;gap:8px}
.auth-btns .lg{height:40px;font-size:15px}
.auth-q{font-weight:700;font-size:17px;margin:40px 0 12px}
.auth-ft{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--fg2);font-size:13px}
@media (max-width:1000px){
  .auth-in{flex-direction:column;align-items:stretch;justify-content:flex-start}
  .auth-logo{display:none}
  .auth-mlogo{display:block}
  .auth-main{padding:32px max(32px,env(safe-area-inset-left,0px)) 32px}
  .auth h1{font-size:42px;line-height:52px;margin:0 0 32px;letter-spacing:-.8px}
  .auth h2{font-size:23px;line-height:28px;margin-bottom:24px}
}
@media (max-width:420px){ .auth h1{font-size:38px;line-height:46px} .auth-btns{width:100%} }
@media (max-width:520px){ .acts{gap:2px} .act{flex:0 1 auto;max-width:none} .act .ic{margin-right:-6px} .acts-r{gap:0} }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

    l=Math.max(Math.round(p.l*g),arrived(p.lk,p.t0,now));r=Math.max(Math.round(p.r*g),arrived(p.rt,p.t0,now));q=Math.round(p.q*g);rp=Math.round(p.rp*g);v=Math.round(p.v*gv);b=Math.round(p.b*g)}
  else if(t.c){const age=now-t.at,g=age<=0?0:1-Math.exp(-age/(9*60000)),c=t.c;l=Math.round((c.l||0)*g);r=Math.round((c.r||0)*g);q=Math.round((c.q||0)*g);rp=Math.round((c.rp||0)*g);v=Math.round((c.v||0)*Math.min(1,g*1.2));b=Math.round((c.b||0)*g)}
  let vk=0,mk=0;for(const id of KIDS.get(t.id)||[]){const k=S.tw.get(id);if(!k||k.at>now)continue;if(isMine(k.a))mk++;else vk++}

function loadImg(blob){return new Promise((res,rej)=>{const u=URL.createObjectURL(blob);const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=u})}
async function compress(blob,max,q){if(blob.type==='image/gif'&&blob.size<3.5e6&&max>1000)return blob;const im=await loadImg(blob);const w=im.naturalWidth,h=im.naturalHeight;const s=Math.min(1,max/Math.max(w,h));const cw=Math.max(1,Math.round(w*s)),ch=Math.max(1,Math.round(h*s));const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);x.drawImage(im,0,0,cw,ch);return await new Promise(r=>c.toBlob(b=>r(b||blob),'image/jpeg',q))}
const toDataURL=b=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b)});
const IMG_STEPS={av:[[400,.86],[320,.8],[240,.72]],bn:[[1200,.8],[900,.72],[700,.64]],tw:[[1280,.82],[1000,.74],[760,.66],[560,.6]]};
async function storeImage(blob,kind='tw'){
  let du='';for(const [mx,q] of IMG_STEPS[kind]||IMG_STEPS.tw){try{du=await toDataURL(await compress(blob,mx,q))}catch(e){du=''}if(du&&du.length<230000)break}
  if(!du||du.length>=250000)return null;
  if(Store.mode!=='local'){const id=rid();S.md.set(id,du);enqueue('md',id,{d:du});return'm:'+id}
  return'd:'+du;
}

  for(const a of S.acc.values()){add(a.av);add(a.bn)}for(const t of S.tw.values())(t.md||[]).forEach(add);

- 캐릭터 섞기: 드립러, 격공러, 정보 보태는 사람, 자기 얘기로 새는 사람, 살짝 딴지 거는 사람(선 넘지 않게), 'ㅋㅋㅋㅋㅋㅋㅋ'만 다는 사람, 이모지 쓰는 사람.
- 외국인 유저도 가끔 섞기(전체의 10~15% 정도, 반응이 적은 글이면 0~1명): 영어 위주("LMAOOO", "this is so real 😭", "not me doing the exact same thing", "omg same"), 가끔 일본어("わかる…", "草", "かわいすぎる"), 서툰 한국어 섞기("ㅋㅋㅋ 너무 웃겨요 i can't"). 외국인은 닉네임·handle도 외국 느낌으로.
- 존댓말 쓰는 사람도 조금. 하지만 "정말 멋져요!", "응원합니다~" 같은 기계적인 칭찬, 상담원·교훈 말투, 어디에나 붙일 수 있는 뻔한 답글은 절대 금지.
- 같은 시작 단어·같은 문장 구조 반복 금지. 해시태그는 거의 안 씀.
- 실존 연예인·정치인 등 실존 인물을 새로 끌어오지 말 것(본문에 나온 대상에는 자연스럽게 반응 가능). 정치·성적인 내용 금지.
- 닉네임은 트위터 감성으로 다양하게(예: 퇴근하고싶다, 밤샘감자, 초코칩쿠키🍪, 단무지 (마감중), 3년째휴학중, 고양이셋집사, 오늘도야근, 붕어빵원정대, 우리애기밥은먹었나). 실명 같은 이름은 드물게.
- handle은 영문 소문자·숫자·밑줄 4~15자, 서로 겹치지 않게.

function isCloneNpc(n){if(!n)return false;for(const a of S.acc.values()){if(n.h===a.h)return true;if(n.n&&a.n&&n.n.trim()===a.n.trim())return true;if(n.h.startsWith(a.h.slice(0,12)+'_')&&/_\d{2}$/.test(n.h))return true}return false}
function purgeBad(){
  const bad=new Set();for(const n of [...S.np.values()])if(isCloneNpc(n)){bad.add(n.h);S.np.delete(n.h);enqueue('np',n.h,null)}
  const kill=new Set();for(const t of S.tw.values())if(!isMine(t.a)&&bad.has(t.a))kill.add(t.id);
  let grew=true;while(grew){grew=false;for(const t of S.tw.values())if(!kill.has(t.id)&&!isMine(t.a)&&((t.par&&kill.has(t.par))||(t.qt&&kill.has(t.qt)))){kill.add(t.id);grew=true}}
  for(const id of kill){const t=S.tw.get(id);if(t)removeTweet(t)}
  if(bad.size){for(const t of S.tw.values())if(t.plan){let ch=false;for(const k of['lk','rt','fo']){const a=t.plan[k]||[];const b=a.filter(x=>!bad.has(x.h));if(b.length!==a.length){t.plan[k]=b;ch=true}}if(ch)saveTw(t)}
    for(const a of S.acc.values()){const f=(a.fw||[]).filter(h=>!bad.has(h));if(f.length!==(a.fw||[]).length){a.fw=f;saveAcc(a)}}
    for(const d of [...S.dm.values()])if(bad.has(d.h)){S.dm.delete(d.id);enqueue('dm',d.id,null)}}
  if(kill.size||bad.size)rebuildFuture();
  return bad.size+kill.size}

function npcFrom(o){
  {const hh=cleanHandle(o&&o.handle),nn=String((o&&o.name)||'').trim();for(const a of S.acc.values()){if(hh===a.h||hh.startsWith(a.h.slice(0,12))||(nn&&nn===String(a.n||'').trim())){o=Object.assign({},o,{name:pick(SAFE_NICKS),handle:pick(SAFE_HANDLES)+'_'+Math.floor(Math.random()*900+100),bio:''});break}}}
  let h=cleanHandle(o&&o.handle);if(S.acc.has(h))h=h.slice(0,12)+'_'+Math.floor(Math.random()*90+10);
  let n=S.np.get(h);

function recentOf(h,n=5){return[...S.tw.values()].filter(t=>t.a===h&&!t.par).sort((a,b)=>b.at-a.at).slice(0,n)}
function regularsFor(h){const cnt=new Map();for(const t of S.tw.values()){if(t.a===h&&t.plan){for(const x of[...(t.plan.lk||[]),...(t.plan.rt||[])])cnt.set(x.h,(cnt.get(x.h)||0)+1)}const p=t.par&&S.tw.get(t.par);if(p&&p.a===h&&!isMine(t.a))cnt.set(t.a,(cnt.get(t.a)||0)+2)}
  for(const f of followersOf(h))cnt.set(f.h,(cnt.get(f.h)||0)+2);
  return[...cnt.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10).map(([x])=>S.np.get(x)).filter(Boolean)}

function feedItems(tab){
  const now=Date.now(),cur=S.cur,fw=following(),hid=new Set(me().hid||[]),items=[];
  for(const t of S.tw.values()){
    if(t.at>now||t.par||hid.has(t.id))continue;
    if(tab==='following'&&!(fw.has(t.a)||isMine(t.a)))continue;
    if(tab==='for'&&t.gen==='profile'&&!fw.has(t.a))continue;
    if(t.rt&&t.rt[cur])items.push({t,at:Math.max(t.at,t.rt[cur]),rtBy:cur,key:'r'+t.id});
    else items.push({t,at:t.at,key:t.id});
  }
  return items.sort((a,b)=>b.at-a.at);
}

function notifs(now=Date.now()){
  const cur=S.cur,out=[];const a=me();
  for(const t of S.tw.values()){
    if(t.a===cur&&t.plan){const p=t.plan;
      const grp=(list,k)=>{const arr=(list||[]).filter(x=>p.t0+x.s*1000<=now);if(!arr.length)return;const last=Math.max(...arr.map(x=>p.t0+x.s*1000));const c=counts(t,now);const own=Object.keys(k==='like'?t.lk:t.rt).length;const total=Math.max(arr.length,(k==='like'?c.l:c.r)-own);out.push({k,t,at:last,who:arr.slice().reverse().map(x=>x.h),n:total})};
      grp(p.lk,'like');grp(p.rt,'rt');
      const fo=(p.fo||[]).filter(x=>p.t0+x.s*1000<=now);if(fo.length)out.push({k:'follow',at:Math.max(...fo.map(x=>p.t0+x.s*1000)),who:fo.map(x=>x.h).reverse(),n:fo.length,key:'f'+t.id});
    }
    if(t.at>now||isMine(t.a))continue;
    const par=t.par&&S.tw.get(t.par),qt=t.qt&&S.tw.get(t.qt);
    if(par&&par.a===cur)out.push({k:'reply',t,at:t.at});
    else if(qt&&qt.a===cur)out.push({k:'quote',t,at:t.at});
    else if(t.txt&&t.txt.toLowerCase().includes('@'+cur))out.push({k:'mention',t,at:t.at});
  }
  for(const f of a.fb||[])if(f.at<=now)out.push({k:'follow',at:f.at,who:[f.h],n:1,key:'fb'+f.h});
  return out.sort((x,y)=>y.at-x.at);
}
function unreadCount(){const a=me();if(!a)return 0;const ns=a.ns||a.at||0;return notifs().filter(n=>n.at>ns).length}
function dmUnread(){let n=0;for(const d of S.dm.values()){if(d.me!==S.cur)continue;const now=Date.now();if((d.msgs||[]).some(m=>m.f==='n'&&m.at<=now&&m.at>(d.rd||0)))n++}return n}
function updateBadges(){const n=unreadCount(),d=dmUnread();$$('[data-badge="notifs"]').forEach(b=>{b.hidden=!n;b.textContent=n>20?'20+':n});$$('[data-badge="messages"]').forEach(b=>{b.hidden=!d;b.textContent=d})}
function notifHTML(x){
  if(x.k==='reply'||x.k==='quote'||x.k==='mention')return twHTML(x.t);
  const ic=x.k==='like'?`<span class="n-ic pink">${IC.heartF}</span>`:x.k==='rt'?`<span class="n-ic green">${IC.rt}</span>`:`<span class="n-ic blue">${IC.userF}</span>`;
  const verb=x.k==='like'?'회원님의 트윗을 마음에 들어 했습니다':x.k==='rt'?'회원님의 트윗을 리트윗했습니다':'회원님을 팔로우했습니다';
  const others=x.n-1;const who=x.who.slice(0,8);
  return `<div class="nt" data-act="${x.k==='follow'?'followList':'open'}" data-id="${x.t?x.t.id:''}" data-h="${esc(S.cur)}"><div class="nt-l">${ic}</div><div class="nt-b"><div class="nt-avs">${who.map(h=>avImg(h,'sm')).join('')}</div><div class="nt-t"><b>${esc(nameOf(who[0]))}</b>님${others>0?` 외 ${fmtNum(others)}명`:''}이 ${verb}</div>${x.t?`<div class="nt-q">${esc(x.t.txt||'사진')}</div>`:''}</div></div>`;

function twMenu(t,anchor){const mine=isMine(t.a);let items;
  if(mine){const a=me();const pinned=a.pin===t.id;items=[{label:'삭제하기',ic:IC.trash,red:1,fn:()=>confirmBox({title:'트윗을 삭제할까요?',text:'이 작업은 취소할 수 없으며 내 프로필, 나를 팔로우하는 계정의 타임라인, 검색 결과에서 삭제됩니다.',ok:'삭제하기',fn:()=>deleteTweet(t)})}];
    if(t.a===S.cur&&!t.par)items.push({label:pinned?'프로필에서 고정 해제하기':'프로필에 고정하기',ic:IC.pin,fn:()=>{a.pin=pinned?null:t.id;saveAcc(a);toast(pinned?'프로필에서 고정을 해제했습니다.':'프로필에 고정했습니다.');if(curView().v==='profile')render({keep:true})}});}
  else{const f=(me().fw||[]).includes(t.a);items=[{label:f?`@${t.a}님 언팔로우하기`:`@${t.a}님 팔로우하기`,ic:f?IC.userMinus:IC.userPlus,fn:()=>toggleFollow(t.a)},{label:'이 트윗에 관심 없음',ic:IC.meh,fn:()=>{const a=me();a.hid=a.hid||[];a.hid.push(t.id);a.hid=a.hid.slice(-500);saveAcc(a);$$(`article.tw[data-id="${t.id}"]`).forEach(el=>el.remove());toast('이 트윗이 더 이상 표시되지 않습니다.')}}]}
  items.push({label:'텍스트 복사하기',ic:IC.copy,fn:()=>copyText(t.txt||'')});menu(anchor,items)}
function deleteTweet(t){const kill=[t];for(const x of S.tw.values())if(x.par===t.id&&!isMine(x.a)||x.qt===t.id&&!isMine(x.a))kill.push(x);kill.forEach(removeTweet);const a=me();if(a.pin===t.id){a.pin=null;saveAcc(a)}
  if(curView().v==='tweet'&&curView().p.id===t.id)back();else{$$(`article[data-id="${t.id}"]`).forEach(el=>el.remove());if(curView().v!=='home')render({keep:true})}toast('트윗이 삭제되었습니다.')}
function copyText(s){const done=()=>toast('클립보드에 복사했습니다.');try{navigator.clipboard.writeText(s).then(done,()=>fallbackCopy(s,done))}catch(e){fallbackCopy(s,done)}}
function fallbackCopy(s,done){const ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}ta.remove()}
function rtMenu(t,anchor){const on=!!t.rt[S.cur];menu(anchor,[{label:on?'리트윗 취소':'리트윗',ic:IC.rt,fn:()=>toggleRt(t)},{label:'트윗 인용하기',ic:IC.pen,fn:()=>openCompose({quote:t})},...((QUOTES.get(t.id)||[]).length?[{label:'인용한 트윗 보기',ic:IC.views,fn:()=>go('quotes',{id:t.id})}]:[])])}
function newDm(){const cands=new Set([...(me().fw||[]),...followersOf(S.cur).map(x=>x.h)]);for(const d of S.dm.values())if(d.me===S.cur)cands.add(d.h);for(const h of suggest(12))cands.add(h);
  const w=openLayer(`<div class="dlg"><div class="dlg-top"><button class="ib x" data-close aria-label="닫기">${IC.close}</button><div class="ttl">새 쪽지</div></div><div style="padding:0 16px 8px;border-bottom:1px solid var(--line)"><label class="sbox" style="background:transparent;padding-left:0">${IC.search}<input id="dmq" placeholder="사용자 검색" autocomplete="off"></label></div><div id="dmlist" style="max-height:60vh;overflow-y:auto"></div></div>`,{dialog:true});
  const list=$('#dmlist',w),q=$('#dmq',w);const draw=()=>{const s=q.value.trim().toLowerCase().replace(/^@/,'');let hs=[...cands];if(s)hs=[...S.np.values()].filter(n=>n.h.includes(s)||n.n.toLowerCase().includes(s)).map(n=>n.h);hs=hs.filter(h=>S.np.has(h)).slice(0,40);
    list.innerHTML=hs.length?hs.map(h=>`<div class="ur" data-pick="${esc(h)}">${`<img class="av" src="${esc(avatarOf(h))}" alt="">`}<div class="ur-b"><div class="nm-row"><span class="nm">${esc(nameOf(h))}</span>${badge(h)}</div><div class="hd">@${esc(h)}</div></div></div>`).join(''):`<div class="foot" style="padding:24px 16px">${s?'검색 결과가 없습니다.':'타임라인에서 다른 사람을 만나면 여기에 표시됩니다.'}</div>`;
    $$('[data-pick]',list).forEach(el=>el.onclick=()=>{closeLayer(w);go('chat',{h:el.dataset.pick})})};
  q.oninput=draw;draw();setTimeout(()=>q.focus(),50)}

/* ================= events ================= */
document.addEventListener('click',e=>{
  if(e.target.closest('a[href]'))return;
  const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act;const id=el.dataset.id,h=el.dataset.h;const t=id&&S.tw.get(id);
  if(el.closest('.lay,.drawer-wrap,.sheet-wrap')&&['open','user','nav','followList','switchTo','acctMenu','addAcct','logout'].includes(act))closeLayers();
  switch(act){
    case 'open':{if(window.getSelection&&String(window.getSelection()).length>2)return;if(t&&!(curView().v==='tweet'&&curView().p.id===id))go('tweet',{id,scrollMain:!!t.par});break}
    case 'user':{e.stopPropagation();if(h&&(S.np.has(h)||S.acc.has(h)))go('profile',{h});break}
    case 'mention':{e.stopPropagation();if(S.np.has(h)||S.acc.has(h))go('profile',{h});else go('search',{q:'@'+h,tab:'people'});break}
    case 'tag':{e.stopPropagation();go('search',{q:el.dataset.q,tab:'top'});break}
    case 'reply':{e.stopPropagation();if(t)openCompose({reply:t});break}
    case 'rt':{e.stopPropagation();if(t)rtMenu(t,el);break}
    case 'like':{e.stopPropagation();if(t)toggleLike(t,el);break}
    case 'bm':{e.stopPropagation();if(t)toggleBm(t);break}
    case 'share':{e.stopPropagation();if(t)menu(el,[{label:'텍스트 복사하기',ic:IC.copy,fn:()=>copyText(t.txt||'')},{label:t.bm[S.cur]?'북마크에서 삭제':'북마크에 추가',ic:IC.bookmark,fn:()=>toggleBm(t)}]);break}
    case 'views':{e.stopPropagation();if(t&&curView().v!=='tweet')go('tweet',{id});break}
    case 'twMenu':{e.stopPropagation();if(t)twMenu(t,el);break}
    case 'img':{e.stopPropagation();if(t)openLightbox(t,+el.dataset.i||0);break}
    case 'avZoom':{const a=S.acc.get(h);openLightbox({md:[a&&a.av?a.av:avatarOf(h)]},0);break}
    case 'follow':{e.stopPropagation();toggleFollow(h);break}
    case 'nav':{const v=el.dataset.v;closeLayers();if(v==='profile')go('profile',{h:S.cur},{root:true});else if(v===curView().v&&R.stack.length===1){if(v==='home'){window.scrollTo({top:0,behavior:'smooth'});if(Date.now()-(S.mt.feed?.at||0)>3*60000)genFeed(false);checkNewPosts()}else window.scrollTo({top:0,behavior:'smooth'})}else go(v,{},{root:true});break}
    case 'back':back();break;
    case 'compose':openCompose();break;
    case 'drawer':openDrawer();break;
    case 'acctMenu':acctMenu(el);break;
    case 'switchTo':switchAcct(h);break;
    case 'addAcct':openLogin();break;
    case 'logout':logout();break;
    case 'homeTab':{HS.tab=el.dataset.k;HS.limit=40;$$('.tab',el.parentNode).forEach(b=>b.classList.toggle('on',b===el));renderFeed();window.scrollTo(0,0);break}
    case 'showNew':{renderFeed();window.scrollTo({top:0,behavior:'smooth'});break}
    case 'notifTab':go('notifs',{tab:el.dataset.k},{replace:true});break;
    case 'searchTab':go('search',Object.assign({},curView().p,{tab:el.dataset.k}),{replace:true});break;
    case 'profTab':{const p=curView().p;p.tab=el.dataset.k;$$('.pf-tabs .tab').forEach(b=>b.classList.toggle('on',b===el));$('#plist').innerHTML=profileTab(p.h||S.cur,p.tab);break}
    case 'followTab':go('follows',Object.assign({},curView().p,{k:el.dataset.k}),{replace:true});break;
    case 'followList':go('follows',{h:h||S.cur,k:el.dataset.k||'followers'});break;
    case 'search':go('search',{q:el.dataset.q,tab:'top'});break;
    case 'trendMenu':{e.stopPropagation();menu(el,[{label:'이 트렌드에 관심 없음',ic:IC.meh,fn:()=>{const tr=S.mt.trends;if(tr){tr.list=tr.list.filter(x=>x.name!==el.dataset.q);saveMeta('trends');onTrends();toast('이 트렌드가 더 이상 표시되지 않습니다.')}}}]);break}
    case 'clearSearch':{e.preventDefault();const i=el.parentElement.querySelector('input');i.value='';i.focus();el.classList.remove('show');break}
    case 'editProfile':openEditProfile();break;
    case 'chat':go('chat',{h});break;
    case 'dmSend':sendDm(curView().p.h);break;
    case 'newDm':newDm();break;
    case 'quotes':go('quotes',{id});break;
    case 'likers':go('likers',{id});break;
    case 'rters':go('rters',{id});break;
    case 'signup':openSignup();break;
    case 'login':openLogin();break;
  }
});
document.addEventListener('error',e=>{const el=e.target;if(!el||el.tagName!=='IMG'||el.dataset.fb)return;el.dataset.fb='1';if(el.matches('.av,.pf-av img,.ep-av img,.pick-av img,.dr-accts img,.newpill img'))el.src=pfpURL('default',el.dataset.h||S.cur||'x');else{const b=el.closest('.mi,.cm,.mgrid button');if(b)b.style.display='none';else el.style.visibility='hidden'}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const l=$('#layer').lastElementChild;if(l)closeLayer(l)}});

/* ================= render ================= */
function render(o={}){const c=curView();const view=V[c.v]||V.home;const y=window.scrollY;
  const main=$('#main');main.innerHTML=view.html(c.p||{});if(view.mount)view.mount(c.p||{});renderChrome();if(o.keep)window.scrollTo(0,y)}
function renderChrome(){const v=curView().v,isOwn=v==='profile'&&(curView().p.h||S.cur)===S.cur;const a=me();if(!a)return;
  const items=[['home','홈',IC.home,IC.homeF],['explore','탐색하기',IC.search,IC.searchF],['notifs','알림',IC.bell,IC.bellF],['messages','쪽지',IC.mail,IC.mailF],['bookmarks','북마크',IC.bookmark,IC.bookmarkF],['profile','프로필',IC.user,IC.userF]];
  const rootV=R.stack[0].v;const onK=k=>k==='profile'?isOwn:(k===rootV&&!isOwn);
  $('#side').innerHTML=`<div class="side-in"><button class="logo-btn" data-act="nav" data-v="home" aria-label="홈">${logo()}</button><nav class="nav">${items.map(([k,l,i,f])=>`<button class="nav-i${onK(k)?' on':''}" data-act="nav" data-v="${k}" aria-label="${l}"><span class="nav-ic">${onK(k)?f:i}${k==='notifs'||k==='messages'?`<span class="badge" data-badge="${k}" hidden></span>`:''}</span><span class="lbl">${l}</span></button>`).join('')}</nav><button class="post-btn" data-act="compose" aria-label="트윗하기"><span class="post-lbl">트윗하기</span><span class="post-ic">${IC.feather}</span></button><button class="acct-btn" data-act="acctMenu"><img class="av" src="${esc(avatarOf(a.h))}" alt=""><span class="acct-meta"><b>${esc(a.n)}</b><span>@${esc(a.h)}</span></span><span class="acct-dots">${IC.dots}</span></button></div>`;
  const tb=items.slice(0,4);$('#tabbar').innerHTML=tb.map(([k,l,i,f])=>`<button data-act="nav" data-v="${k}" aria-label="${l}"><span class="nav-ic">${onK(k)?f:i}${k==='notifs'||k==='messages'?`<span class="badge" data-badge="${k}" hidden></span>`:''}</span></button>`).join('');
  const fab=$('#fab');const showFab=['home','explore','notifs','profile','messages','search'].includes(v)&&!(v==='profile'&&!isOwn);fab.hidden=!showFab;fab.innerHTML=v==='messages'?IC.mailPlus:IC.feather;fab.dataset.act=v==='messages'?'newDm':'compose';
  renderRight();updateBadges()}
function renderRight(){const r=$('#right');if(!r)return;if(getComputedStyle(r).display==='none'){r.innerHTML='';return}const v=curView().v;const tr=S.mt.trends?.list;
  r.innerHTML=`<div class="right-in">${v!=='explore'&&v!=='search'?`<div class="sbox-wrap"><label class="sbox">${IC.search}<input id="rsq" type="search" enterkeyhint="search" placeholder="검색" autocomplete="off"><button type="button" class="clr" data-act="clearSearch" aria-label="지우기">${IC.close}</button></label></div>`:''}
${v!=='explore'?`<div class="box"><h2 class="sec-t">무슨 일이 일어나고 있나요?</h2>${tr?tr.slice(0,5).map(trendHTML).join(''):spinner(true)}<button class="sec-more" data-act="nav" data-v="explore">더 보기</button></div>`:''}
${(()=>{const s=suggest(3);return s.length?`<div class="box"><h2 class="sec-t">팔로우 추천</h2>${s.map(h=>userRow(h)).join('')}<button class="sec-more" data-act="nav" data-v="explore">더 보기</button></div>`:''})()}
<div class="foot">© 2026 개위터</div></div>`;bindSearch();if(!tr)setTimeout(()=>genTrends(),1500)}
function onTrends(){renderRight();const v=curView().v;if(v==='explore')render({keep:true})}
function refreshCounts(t,now=Date.now()){const c=counts(t,now);
  $$(`[data-live="${t.id}"], article[data-id="${t.id}"]`).forEach(el=>{
    $$('.cnt[data-k]',el).forEach(s=>{if(s.closest('.qc'))return;const k=s.dataset.k;const val=k==='reply'?c.rp:k==='rt'?c.r+c.q:k==='like'?c.l:k==='views'?c.v:0;const txt=val?fmtNum(val):'';if(s.textContent!==txt){s.textContent=txt;s.classList.remove('roll');void s.offsetWidth;s.classList.add('roll')}});
    const st=$('#dtStats',el);if(st){const html=statsHTML(t,c);if(st.innerHTML!==html)st.innerHTML=html}})}

/* ================= ticker ================= */
let lastRel=0;
function onArrivals(){updateBadges();const v=curView();
  if(v.v==='tweet')refreshReplies();
  else if(v.v==='notifs'){const box=$('#nlist');if(box){const tab=v.p.tab||'all';const list=notifs().filter(x=>tab==='all'||x.k==='reply'||x.k==='quote'||x.k==='mention');box.innerHTML=list.length?list.slice(0,120).map(notifHTML).join(''):box.innerHTML;const a=me();a.ns=Date.now();saveAcc(a);updateBadges()}}
  else if(v.v==='home')checkNewPosts();
  else if(v.v==='chat'){const d=S.dm.get(dmId(S.cur,v.p.h));if(d)onDm(d)}
  else if(v.v==='messages')render({keep:true});
  $$('[data-live-fol]').forEach(b=>b.textContent=fmtNum(followerCount(b.dataset.liveFol)))}
function tick(){if(!S.cur)return;const now=Date.now();
  if(FUT.length&&FUT[0]<=now){while(FUT.length&&FUT[0]<=now)FUT.shift();onArrivals()}
  const seen=new Set();$$('[data-live]').forEach(el=>{const id=el.dataset.live;if(seen.has(id))return;seen.add(id);const t=S.tw.get(id);if(t)refreshCounts(t,now)});
  if(now-lastRel>30000){lastRel=now;$$('.tm[data-ts]').forEach(s=>{const v=fmtRel(+s.dataset.ts,now);if(s.textContent!==v)s.textContent=v})}}

/* ================= shell ================= */
function showAuth(){$('#shell').hidden=true;$('#tabbar').hidden=true;$('#fab').hidden=true;const a=$('#auth');a.hidden=false;a.innerHTML=`<div class="auth-in"><div class="auth-logo">${logo()}</div><div class="auth-main"><div class="auth-mlogo">${logo()}</div><h1>지금 일어나고 있는 일</h1><h2>지금 가입하세요.</h2><div class="auth-btns"><button class="btn-blue lg" data-act="signup">계정 만들기</button><div class="auth-q">이미 개위터에 가입하셨나요?</div><button class="btn-out blue-t lg" data-act="login">로그인</button></div></div></div><footer class="auth-ft">© 2026 개위터</footer>`;window.scrollTo(0,0)}
function enterShell(){$('#auth').hidden=true;$('#auth').innerHTML='';$('#shell').hidden=false;$('#tabbar').hidden=false;{const a=me();if(a&&a.h==='gang'&&!a.f0&&!a.fsetup){a.f0=4200+Math.floor(Math.random()*2600);a.fsetup=1;saveAcc(a)}}purgeBad();seedFeed();ensureCast();render();window.scrollTo(0,0);
  if(feedStale())genFeed(false);setTimeout(()=>genTrends(),4000);retryPending()}
async function retryPending(){const now=Date.now();for(const t of S.tw.values()){if(t.st==='p'&&isMine(t.a)&&now-t.at>20000){const blobs=[];for(const r of (t.md||[]).slice(0,4)){try{const u=mediaURL(r);if(u){const b=await (await fetch(u)).blob();blobs.push(b)}}catch(e){}}react(t,blobs)}}}
let lastW=window.innerWidth;window.addEventListener('resize',()=>{const w=window.innerWidth;if((w>1000)!==(lastW>1000)||(w>688)!==(lastW>688)){if(S.cur)renderChrome()}lastW=w});

/* ================= boot ================= */
async function hydrate(){
  const [ac,tw,np,dm,md,mt]=await Promise.all(['ac','tw','np','dm','md','mt'].map(n=>Store.loadAll(n)));
  ac.forEach(a=>{a.fw=a.fw||[];a.hid=a.hid||[];a.fb=a.fb||[];S.acc.set(a.h||a.id,a)});
  np.forEach(n=>{n.h=n.h||n.id;S.np.set(n.h,n)});
  md.forEach(m=>S.md.set(m.id,m.d));
  tw.sort((a,b)=>a.at-b.at).forEach(addTweet);
  dm.forEach(d=>S.dm.set(d.id,d));
  mt.forEach(m=>{const id=m.id;delete m.id;S.mt[id]=m});
  rebuildFuture();
}
async function boot(){
  $('#splash').innerHTML=logo();
  const t0=Date.now();
  await Store.init();initSample();
  if(Store.mode==='sb'){if(SBT.token){let r=null,net=false;try{r=await Store.sbLoad()}catch(e){net=true}
      if(r){await hydrate();await sleep(Math.max(0,450-(Date.now()-t0)));$('#splash').hidden=true;S.cur=ensureSbAccount();enterShell()}
      else{if(!net)setSbToken(null);$('#splash').hidden=true;showAuth();if(net)toast('서버에 연결할 수 없어요. 잠시 후 다시 열어 주세요.')}}
    else{await sleep(Math.max(0,450-(Date.now()-t0)));$('#splash').hidden=true;showAuth()}
    setInterval(tick,1000);return}
  const [ac,tw,np,dm,md,mt]=await Promise.all(['ac','tw','np','dm','md','mt'].map(n=>Store.loadAll(n)));
  ac.forEach(a=>{a.fw=a.fw||[];a.hid=a.hid||[];a.fb=a.fb||[];S.acc.set(a.h||a.id,a)});
  np.forEach(n=>{n.h=n.h||n.id;S.np.set(n.h,n)});
  md.forEach(m=>S.md.set(m.id,m.d));
  tw.sort((a,b)=>a.at-b.at).forEach(addTweet);
  dm.forEach(d=>S.dm.set(d.id,d));
  mt.forEach(m=>{const id=m.id;delete m.id;S.mt[id]=m});
  rebuildFuture();
  let cur=S.mt.session?.cur;if(!cur){try{cur=localStorage.getItem('gw1cur')}catch(e){}}
  await sleep(Math.max(0,450-(Date.now()-t0)));
  $('#splash').hidden=true;
  if(cur&&S.acc.has(cur)){S.cur=cur;if(!(S.mt.session?.on||[]).includes(cur))setSession(cur,[...(S.mt.session?.on||[]),cur]);enterShell()}else showAuth();
  setInterval(tick,1000);
  migrateAssets();
}
boot();
})();
