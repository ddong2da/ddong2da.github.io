:root{
  --ink:#5b2848; --ink2:#a0708c; --paper:#fff7fb; --glass:rgba(255,248,252,.94); --glass2:rgba(255,244,249,.98);
  --line:#f4a8c9; --pink:#ff86b8; --pinkD:#e0508f; --pinkL:#ffd3e5; --ribbon:#ff5c9b; --sakura:#ff9cc4; --gold:#c97a00; --ok:#35b076; --sky:#6d9be8;
  --f:"AobaPixel","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-disp:var(--f); --f-body:var(--f);
  --out:-2px 0 0 var(--pinkD),2px 0 0 var(--pinkD),0 -2px 0 var(--pinkD),0 2px 0 var(--pinkD),-2px -2px 0 var(--pinkD),2px 2px 0 var(--pinkD),-2px 2px 0 var(--pinkD),2px -2px 0 var(--pinkD);
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:#ffd6e6;color:var(--ink);font-family:var(--f);font-size:12px;
  -webkit-font-smoothing:none;-moz-osx-font-smoothing:unset;text-rendering:optimizeSpeed;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden}
#app.rot{width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
#app.menu{background:radial-gradient(circle at 50% 50%,#fff 0 13px,transparent 14px) 0 0/48px 48px,radial-gradient(circle at 50% 50%,rgba(255,255,255,.9) 0 13px,transparent 14px) 24px 24px/48px 48px,linear-gradient(180deg,#ffd9e8,#ffb3cf)}
#game{position:fixed;inset:0;touch-action:none}
#game canvas{display:block;width:100%;height:100%}
button{font-family:var(--f);color:var(--ink);cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:2px dashed var(--pinkD);outline-offset:2px}
.hidden{display:none!important}
.disp{font-family:var(--f)}
.pxi{width:1em;height:1em;display:inline-block;vertical-align:-.15em;image-rendering:pixelated;shape-rendering:crispEdges}

/* glossy pink game button */
.pb{position:relative;font-family:var(--f);font-size:24px;line-height:1;color:#fff;text-shadow:var(--out);border:2px solid var(--pinkD);border-radius:14px;padding:12px 16px;
  background:linear-gradient(180deg,#ffe0ee 0%,#ffaed0 46%,#ff86b8 54%,#ff9cc6 100%);box-shadow:0 4px 0 #c43f7a,inset 0 2px 0 rgba(255,255,255,.85),inset 0 -3px 0 rgba(196,63,122,.25)}
.pb::after{content:"";position:absolute;left:10px;top:4px;width:26%;height:26%;border-radius:99px;background:rgba(255,255,255,.65);pointer-events:none}
.pb:active{transform:translateY(3px);box-shadow:0 1px 0 #c43f7a,inset 0 2px 0 rgba(255,255,255,.85)}
.pb:disabled{filter:grayscale(.7) opacity(.6);cursor:default}
.pb.soft{color:var(--ink);text-shadow:none;background:linear-gradient(180deg,#fff 0%,#ffeaf3 50%,#ffdbe9 100%);border-color:var(--line);box-shadow:0 3px 0 #efa4c5,inset 0 2px 0 #fff}
.pb.soft::after{background:rgba(255,255,255,.9)}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
.card{background:var(--glass);border:2px solid var(--line);border-radius:12px;box-shadow:0 3px 0 rgba(224,80,143,.25)}
#clock{position:absolute;left:calc(6px + var(--sl,0px));top:calc(env(safe-area-inset-top,0px) + 6px);padding:7px 10px 8px;min-width:150px}
#clock .row{display:flex;align-items:baseline;gap:8px}
#clock .time{font-size:24px;line-height:1;color:var(--pinkD)}
#clock .day{font-size:12px;color:var(--ink2)}
#clock .phase{display:inline-block;margin-top:5px;font-size:12px;padding:3px 8px;border-radius:7px;background:var(--ribbon);color:#fff}
#clock .phase.free{background:#3fae7a}
#clock .phase.class{background:var(--sky)}
#bars{margin-top:6px;display:grid;gap:4px}
.bar{height:6px;border-radius:3px;background:rgba(91,40,72,.13);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .25s}
#where{position:absolute;right:calc(6px + var(--sr,0px));top:calc(env(safe-area-inset-top,0px) + 6px);padding:6px 10px;text-align:right}
#where b{font-size:12px;font-weight:400;display:block;color:var(--pinkD)}
#where span{font-size:12px;color:var(--ink2)}
#equip{position:absolute;right:calc(12px + var(--sr,0px));top:calc(env(safe-area-inset-top,0px) + 56px);padding:5px 9px;font-size:12px;display:flex;gap:6px;align-items:center}
#equip .pxi{font-size:20px}
#target{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding:6px 10px;min-width:180px;max-width:32%}
#target .nm{font-size:12px;color:var(--pinkD)}
#target .meta{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#target .meters{display:grid;grid-template-columns:auto 1fr;gap:3px 7px;align-items:center;margin-top:4px;font-size:12px}
#target .bar{height:5px}
#target .aff>i{background:var(--sakura)}
#target .sus>i{background:#8a5bd6}
#toasts{position:absolute;left:50%;transform:translateX(-50%);top:28%;display:grid;gap:6px;justify-items:center;width:min(92%,440px)}
.toast{background:var(--glass2);border:2px solid var(--line);padding:6px 12px;border-radius:10px;font-size:12px;line-height:1.5;animation:tin .25s ease-out;text-align:center;box-shadow:0 3px 0 rgba(224,80,143,.22)}
.toast.good{border-color:#7fd6a8} .toast.bad{border-color:#b892f0}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Bubbles + name tags */
#bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;color:var(--ink);font-size:12px;padding:5px 9px;border:2px solid var(--line);border-radius:10px;white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.bub:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-5px;border:5px solid transparent;border-top-color:var(--line);border-bottom:0}
.bub.alert{background:var(--ribbon);border-color:var(--pinkD);color:#fff}
.bub.think{background:#f3ecff;border-color:#c9b2f2}
.tag{position:absolute;transform:translate(-50%,-100%);font-size:12px;color:#fff;text-shadow:-1px 0 #5b2848,1px 0 #5b2848,0 -1px #5b2848,0 1px #5b2848;white-space:nowrap}
.tag .pxi{font-size:12px}

/* Controls */
#ctrl{position:fixed;inset:0;pointer-events:none}
#joy{position:absolute;left:calc(8px + var(--sl,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 8px);width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,134,184,.8);pointer-events:auto;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:linear-gradient(180deg,#ffe0ee,#ff86b8);border:2px solid var(--pinkD);box-shadow:0 3px 0 #c43f7a}
#btns{position:absolute;right:calc(14px + var(--sr,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:grid;grid-template-columns:repeat(3,auto);gap:8px;align-items:end;justify-items:center;pointer-events:auto}
.rb{position:relative;width:56px;height:56px;border-radius:50%;border:2px solid var(--pinkD);font-size:12px;line-height:1;padding:0;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;text-shadow:-1px 0 var(--pinkD),1px 0 var(--pinkD),0 -1px var(--pinkD),0 1px var(--pinkD);
  background:linear-gradient(180deg,#ffe0ee 0%,#ffaed0 46%,#ff86b8 54%,#ff9cc6 100%);box-shadow:0 3px 0 #c43f7a,inset 0 2px 0 rgba(255,255,255,.85);touch-action:none}
.rb::after{content:"";position:absolute;left:12px;top:6px;width:14px;height:8px;border-radius:99px;background:rgba(255,255,255,.7)}
.rb .pxi{font-size:24px;filter:drop-shadow(0 1px 0 rgba(196,63,122,.5))}
.rb:active{transform:translateY(2px);box-shadow:0 1px 0 #c43f7a}
.rb.on{background:linear-gradient(180deg,#ffd0e4,#ff5c9b);}
#bAct{width:74px;height:74px}
#bAct .pxi{font-size:30px}
#bAct.dim{filter:saturate(.35) brightness(1.05)}

const MG = {};

    <div id="mgMark" style="position:absolute;top:-2px;bottom:-2px;width:5px;margin-left:-2px;background:#fff;border-radius:3px"></div></div>
    <div class="sub" id="mgLog" style="min-height:3.2em"></div><button class="go" id="mgBtn" style="width:100%;margin-top:8px">${esc(labels[0])}</button></div>`, () => cancelAnimationFrame(raf));

  let center = place();
  const loop = t => { const dt = Math.min(0.05, (t - (last || t)) / 1000); last = t; if (!locked) { pos += dir * speed * (1 + r * 0.12) * dt; if (pos > 100) { pos = 100; dir = -1; } if (pos < 0) { pos = 0; dir = 1; } Mk.style.left = pos + '%'; } raf = requestAnimationFrame(loop); };

/* ================= day cycle, weather, sky ================= */
function rollWeather() { const r = hash('w' + G.day + G.nick); G.weather = G.day === 4 ? 'sun' : r < 0.25 ? 'rain' : r < 0.55 ? 'cloud' : 'sun'; }
const RAIN = (() => {
  const N = 1400, pos = new Float32Array(N * 3); for (let i = 0; i < N; i++) { pos[i * 3] = mrnd(-30, 30); pos[i * 3 + 1] = mrnd(0, 25); pos[i * 3 + 2] = mrnd(-30, 30); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xcfe3ff, size: 0.08, transparent: true, opacity: 0.7 })); p.frustumCulled = false; p.visible = false; scene.add(p); return p;
})();
const SKY = { dawn: new THREE.Color(0xffd6b8), day: new THREE.Color(0xbfdcff), eve: new THREE.Color(0xffa978), dusk: new THREE.Color(0x3d4170), rain: new THREE.Color(0x9aa5b1), tmp: new THREE.Color() };
function skyUpdate(dt) {
  const m = G.min; let c, li;
  if (m < 520) { c = SKY.tmp.copy(SKY.dawn).lerp(SKY.day, (m - 450) / 70); li = 0.8; }
  else if (m < 990) { c = SKY.tmp.copy(SKY.day); li = 1; }
  else if (m < 1065) { c = SKY.tmp.copy(SKY.day).lerp(SKY.eve, (m - 990) / 75); li = 0.9; }
  else { c = SKY.tmp.copy(SKY.eve).lerp(SKY.dusk, clamp((m - 1065) / 50, 0, 1)); li = lerp(0.85, 0.45, clamp((m - 1065) / 50, 0, 1)); }
  if (G.weather === 'rain') { c.lerp(SKY.rain, 0.7); li *= 0.72; } else if (G.weather === 'cloud') { c.lerp(SKY.rain, 0.35); li *= 0.88; }
  scene.background.copy(c); scene.fog.color.copy(c);
  sun.intensity = 0.85 * li; hemi.intensity = 0.72 * (0.6 + li * 0.4); amb.intensity = 0.2 + (1 - li) * 0.15;
  const a = (m - 450) / 660 * Math.PI; sun.position.set(Math.cos(a) * 80, 30 + Math.sin(a) * 70, 40); sun.color.setHSL(0.09, m > 1000 ? 0.8 : 0.3, 0.8);
  RAIN.visible = G.weather === 'rain' && !G.indoor(P.pos);
  if (RAIN.visible) { const p = RAIN.geometry.attributes.position.array; for (let i = 0; i < p.length; i += 3) { p[i + 1] -= dt * 18; if (p[i + 1] < 0) p[i + 1] += 25; } RAIN.geometry.attributes.position.needsUpdate = true; RAIN.position.set(camera.position.x, camera.position.y - 8, camera.position.z); }
}
let lastPhase = null;
function phaseEvents() {
  const ph = phaseAt(G.min);
  if (ph.id === lastPhase) return;
  const prev = lastPhase; lastPhase = ph.id; if (!prev) return;
  if (['class1', 'class2', 'class3', 'break', 'lunch', 'clean', 'club'].includes(ph.id)) SFX.bell();
  const msg = { class1: '🔔 1교시 시작! 2층 2학년 A반으로 가자.', break: '🔔 쉬는 시간!', class2: '🔔 3교시 시작!', lunch: '🔔 점심시간! 렌 선배는 옥상에 있대.', class3: '🔔 5교시 시작!', clean: '🧹 청소 시간!', club: '🔔 방과 후! 동아리 활동 시간이야.', after: '🌆 하교 시간이야. 슬슬 정문으로.', night: '🌙 하루가 끝났다.' }[ph.id];

  if (G.flags.pet && Math.random() < dt * 2) {
    const n = NPCS.find(n => n.present() && n.st === 'act' && !n.isT && Math.abs(n.p.y - p.y) < 1.5 && hyp(n.p.x, n.p.z, p.x, p.z) < 3.5 && n.dogDay !== G.day);
    if (n) { n.dogDay = G.day; n.aff = clamp(n.aff + 1, -100, 100); n.say(rpick([`꺄, 강아지다! ${dogName()}~!`, '귀여워…! 만져 봐도 돼?', '헉, 학교에 강아지가?!', '이리 와~ 쯧쯧!']), 2.8); }
  }
}
function dogTalk() {
  const d = DOG; d.name = dogName(); P.busy = true; DLG.classList.remove('hidden'); SFX.bark();
  d.c.yaw = Math.atan2(P.pos.x - d.p.x, P.pos.z - d.p.z); P.c.yaw = Math.atan2(d.p.x - P.pos.x, d.p.z - P.pos.z);
  const close = () => { DLG.classList.add('hidden'); P.busy = !OV.classList.contains('hidden'); };
  const main = line => {
    const o = [{ t: '쓰다듬기', s: '꼬리를 마구 흔든다', f: () => { d.say('헥헥♪'); SFX.bark(); main(rpick(['(배를 뒤집고 눕는다)', '(손을 핥는다)', '(꼬리가 프로펠러처럼 돈다)'])); } }];
    if (!G.flags.pet) o.push({ t: '같이 갈래?', s: '펫으로 데려간다', f: nameMenu });
    else {
      o.push(d.stay ? { t: '따라와!', s: '다시 졸졸 따라온다', f: () => { d.stay = false; d.ti = G.trail.length - 1; main('(벌떡 일어나 신나게 짖는다!)'); } } : { t: '기다려', s: '이 자리에 앉아 기다린다', f: () => { d.stay = true; main('(얌전히 앉아서 너를 바라본다)'); } });
      o.push({ t: '이름 바꾸기', f: nameMenu });
    }
    o.push({ t: '작별', f: close });
    setDialog(d, line, o);
  };
  const nameMenu = () => setDialog(d, '어떤 이름으로 부를까?', ['몽이', '초코', '콩이', '보리', '하루', '솜이'].map(nm => ({ t: nm, f: () => {
    const first = !G.flags.pet; G.flags.pet = { name: nm }; d.name = nm; d.stay = false; d.ti = G.trail.length - 1; SFX.ding(); save();
    if (first) UI.toast(`${nm}이(가) 가족이 됐다! 이제 어디든 졸졸 따라온다.`, 'good');
    main(first ? `${nm}: 멍! 멍멍! (꼬리를 흔들며 네 발치에 앉았다)` : `${nm}: 멍!`);
  } })).concat([{ t: '그만두기', f: () => main('…?') }]));
  main(G.flags.pet ? `${d.name}: 멍멍! (반갑게 뛰어온다)` : '무지개 집 안에 작고 동그란 강아지가 있다. 낑낑거리며 너를 올려다본다…');
}

boot();

</script>
