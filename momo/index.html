<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>桃</title>
<meta name="apple-mobile-web-app-title" content="桃">
<meta name="application-name" content="桃">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBEFF0">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* Layout: full-screen views pushed over a three-tab home (원고 / 책장 / 프로필). Lists on pale pink, writing on near-white paper.
   A published book is a stack of paper pages; turning one curls the leaf over from its corner and reveals the next page underneath. */
:root{
  --bg:#FBEFF0;
  --paper:#FFFAF9;
  --paper-back:#F8ECEC;
  --glass:rgba(251,239,240,.92);
  --paper-glass:rgba(255,250,249,.94);
  --ink:#3B2A30;
  --ink-2:#8A6D74;
  --ink-3:#B99DA3;
  --rose:#C0657A;
  --rose-deep:#A4505F;
  --rose-ink:#FFF7F6;
  --line:#EED6DB;
  --blush:#F6DCE0;
  --shade:rgba(110,60,72,.12);
  --shadow:rgba(80,40,52,.26);
  --spine:rgba(60,28,40,.18);
  --spine-hi:rgba(255,255,255,.16);
  --scrim:rgba(59,42,48,.3);
  --cv-ink:#4A2F37;
  --cv-blush:#F6C7D0;
  --cv-petal:#FBE0E5;
  --cv-milk:#F3AABA;
  --cv-peach:#F8B9A9;
  --cv-coral:#F4A098;
  --cv-rose:#E48FA1;
  --cv-lemon:#F7ECB0;
  --cv-lime:#D2E8B6;
  --cv-mint:#BFE5D6;
  --cv-sky:#C8DFF3;
  --cv-white:#EEECEB;
  --cv-black:#2E292C;
  --cv-light:#F6EFF0;
  --font:"Gowun Batang","Nanum Myeongjo","Noto Serif KR","AppleMyungjo",serif;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);
  --sr:env(safe-area-inset-right,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow:hidden}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
img{max-width:100%}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}

/* ---------- views ---------- */
.view{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg)}
.push{z-index:10;transform:translateX(100%);visibility:hidden;transition:transform .3s cubic-bezier(.25,.8,.25,1),visibility 0s linear .3s;box-shadow:-10px 0 28px -18px var(--shadow)}
.push.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.25,.8,.25,1),visibility 0s}
.wrap{width:100%;max-width:680px;margin:0 auto;padding-left:max(20px,var(--sl));padding-right:max(20px,var(--sr))}

/* ---------- buttons ---------- */
.btn{appearance:none;border:0;border-radius:8px;padding:10px 16px;font-size:14.5px;line-height:1.2;background:var(--rose);color:var(--rose-ink);white-space:nowrap;transition:background .15s,opacity .15s}
.btn:active{background:var(--rose-deep)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:active{background:var(--blush)}
@media (hover:hover){.btn:hover{background:var(--rose-deep)}.btn.ghost:hover{background:var(--blush)}}
.btn:disabled{opacity:.45;cursor:default}
.link{appearance:none;border:0;background:transparent;padding:9px 8px;border-radius:6px;font-size:14.5px;color:var(--ink);white-space:nowrap}
.link:active{background:var(--blush)}
@media (hover:hover){.link:hover{background:var(--blush)}}
.link.muted{color:var(--ink-2)}
.link.danger{color:var(--rose-deep)}

/* ---------- login ---------- */
.login{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;overflow-y:auto;background:var(--bg);padding-top:calc(var(--st) + 24px);padding-bottom:calc(var(--sb) + 24px);padding-left:max(28px,var(--sl));padding-right:max(28px,var(--sr))}
.login form{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
.login img{align-self:center;width:78px;height:78px;margin-bottom:22px;border-radius:19px;box-shadow:0 10px 22px -14px var(--shadow)}
.login input{height:50px;padding:0 16px;border:0;border-radius:10px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);font-size:16px}
.login input:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--rose)}
.login .btn{height:50px;margin-top:4px;font-size:15.5px}
.login .err{min-height:1.5em;margin:0;text-align:center;font-size:13px;color:var(--rose-deep)}
.login .link{align-self:center;color:var(--ink-2);font-size:14px}

/* ---------- home ---------- */
.home{padding-bottom:calc(var(--sb) + 76px)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:calc(var(--st) + 26px);padding-bottom:16px}
.h1{margin:0;font-weight:700;font-size:28px;line-height:1.2;letter-spacing:-.01em}
.sub{margin:4px 0 0;font-size:13px;color:var(--ink-2);min-height:1.5em;font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:16px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}
.row:active{background:var(--blush)}
.bk{position:relative;display:block;overflow:hidden;background-repeat:no-repeat;box-shadow:0 1px 1px var(--shade),0 5px 9px -6px var(--shadow)}
.bk::before{content:"";position:absolute;top:0;bottom:0;left:0;z-index:1;width:7%;min-width:3px;max-width:10px;background:linear-gradient(90deg,var(--spine),var(--spine-hi))}
.mini{flex:none;width:34px;height:47px;border-radius:2px 4px 4px 2px}
.mini.big{width:62px;height:86px}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row-title{font-weight:700;font-size:17px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.badge{font-size:11px;color:var(--rose-deep);background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
.chev{flex:none;color:var(--ink-3);font-size:20px;line-height:1}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding-bottom:var(--sb);padding-left:var(--sl);padding-right:var(--sr);background:var(--glass);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tab{appearance:none;position:relative;flex:1;max-width:200px;height:56px;border:0;background:transparent;font-size:15.5px;color:var(--ink-3)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:50%;bottom:9px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--rose)}

/* shelf */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:30px 18px;padding-top:22px;border-top:1px solid var(--line)}
@media (min-width:640px){.shelf{grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:36px 26px}}
.card{appearance:none;display:flex;flex-direction:column;gap:8px;min-width:0;margin:0;padding:0;border:0;background:none;text-align:left;container-type:inline-size}
.cover{display:flex;flex-direction:column;width:100%;max-width:100%;aspect-ratio:5/7;padding:15cqi 11cqi 11cqi 17cqi;border-radius:2px 5px 5px 2px;box-shadow:0 1px 1px var(--shade),0 10px 18px -12px var(--shadow);transition:transform .2s ease}
.card:active .cover{transform:translateY(1px) scale(.99)}
@media (hover:hover){.card:hover .cover{transform:translateY(-3px)}}
.cv-title{position:relative;font-weight:700;font-size:12cqi;line-height:1.38;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.cv-rule{position:relative;display:block;flex:none;width:16cqi;height:1px;margin-top:7cqi;background:currentColor;opacity:.45}
.cv-author{position:relative;margin-top:auto;font-size:8cqi;letter-spacing:.06em;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-blush{background-color:var(--cv-blush);color:var(--cv-ink)}
.cv-petal{background-color:var(--cv-petal);color:var(--cv-ink)}
.cv-milk{background-color:var(--cv-milk);color:var(--cv-ink)}
.cv-peach{background-color:var(--cv-peach);color:var(--cv-ink)}
.cv-coral{background-color:var(--cv-coral);color:var(--cv-ink)}
.cv-rose{background-color:var(--cv-rose);color:var(--cv-ink)}
.cv-lemon{background-color:var(--cv-lemon);color:var(--cv-ink)}
.cv-lime{background-color:var(--cv-lime);color:var(--cv-ink)}
.cv-mint{background-color:var(--cv-mint);color:var(--cv-ink)}
.cv-sky{background-color:var(--cv-sky);color:var(--cv-ink)}
.cv-white{background-color:var(--cv-white);color:var(--cv-ink)}
.cv-black{background-color:var(--cv-black);color:var(--cv-light)}
.card-title{font-size:13.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.card-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.meter{flex:1;height:2px;border-radius:2px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--rose)}

/* profile */
.me{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:calc(var(--st) + 48px);text-align:center}
.avatar{display:block;width:104px;height:104px;border-radius:50%;object-fit:cover;background:var(--blush);box-shadow:0 0 0 4px var(--paper),0 12px 26px -16px var(--shadow)}
.me-name{margin:12px 0 0;font-weight:700;font-size:23px;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.me-name small{font-weight:400;font-size:.72em;color:var(--ink-2)}
.me-bio{margin:0;max-width:24em;font-size:14.5px;line-height:1.75;color:var(--ink-2);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.me-stats{display:flex;width:100%;max-width:340px;margin-top:18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.me-stats div{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:16px 10px}
.me-stats div + div{border-left:1px solid var(--line)}
.me-stats b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:21px;font-variant-numeric:tabular-nums}
.me-stats span{white-space:nowrap;font-size:12.5px;color:var(--ink-2)}
.me .btn{margin-top:16px}
.me-foot{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:44px;font-size:13px;color:var(--ink-3)}
.me-foot .link{font-size:13px}

/* ---------- top bars ---------- */
.bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:4px;padding-top:calc(var(--st) + 6px);padding-bottom:6px;padding-left:max(8px,var(--sl));padding-right:max(8px,var(--sr));background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.grow{flex:1;min-width:0}
.back{display:flex;align-items:center;gap:4px;max-width:58%;min-width:0}
.back b{font-size:22px;font-weight:400;line-height:1;margin-top:-2px}
.back span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- story ---------- */
.s-head{display:flex;align-items:flex-start;gap:18px;padding-block:16px 22px}
.s-headtext{flex:1;min-width:0}
.s-title{margin:0;font-weight:700;font-size:25px;line-height:1.32;word-break:keep-all;overflow-wrap:anywhere;text-wrap:balance}
.s-author{margin:6px 0 0;font-size:14px;color:var(--ink-2)}
.s-stats{margin:10px 0 0;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pub{display:flex;gap:8px;margin-bottom:28px}
.pub .btn{flex:1;min-width:0;padding:13px 16px;font-size:15px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px;min-height:38px}
.sec h3{margin:0;font-size:13px;font-weight:400;letter-spacing:.08em;color:var(--ink-2)}
.prow{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.popen{appearance:none;flex:1;min-width:0;display:flex;align-items:flex-start;gap:12px;padding:15px 2px;border:0;background:transparent;text-align:left}
.popen:active{background:var(--blush)}
.pno{flex:none;width:1.8em;padding-top:1px;text-align:right;font-size:14px;line-height:1.5;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ptitle{font-weight:700;font-size:16px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle.none{font-weight:400;color:var(--ink-3)}
.pprev{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pmove{display:flex;gap:6px;flex:none}
.pmove button{appearance:none;width:38px;height:34px;border:0;border-radius:7px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);font-size:11px;color:var(--ink-2)}
.pmove button:disabled{opacity:.3;cursor:default}
.dock{position:sticky;bottom:0;display:flex;gap:10px;margin-top:26px;padding-top:18px;padding-bottom:calc(var(--sb) + 16px);background:linear-gradient(to bottom,rgba(251,239,240,0),var(--bg) 32%)}
.dock .btn{flex:1;padding:15px 16px;font-size:15px}

/* ---------- editor ---------- */
.ed{display:flex;flex-direction:column;overflow:hidden;background:var(--paper);top:var(--vvt,0px);bottom:auto;height:var(--vvh,100%)}
.ed .bar{position:relative;flex:none;background:var(--paper-glass)}
.ed-status{font-size:12.5px;color:var(--ink-3);white-space:nowrap;padding:0 6px;font-variant-numeric:tabular-nums}
.ed-col{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:680px;margin:0 auto;padding-left:max(22px,var(--sl));padding-right:max(22px,var(--sr))}
.ed-title{flex:none;display:block;width:100%;margin:0;padding:10px 0 4px;border:0;border-radius:0;background:transparent;font-weight:700;font-size:23px;line-height:1.4;color:var(--ink)}
.ed-date{flex:none;margin:2px 0 18px;font-size:12.5px;color:var(--ink-3)}
.ed-body{flex:1;min-height:0;display:block;width:100%;margin:0;padding:0 0 calc(var(--sb) + 48px);border:0;border-radius:0;background:transparent;resize:none;overflow-y:auto;font-size:17px;line-height:1.95;color:var(--ink);word-break:keep-all;overflow-wrap:break-word}
.ed-title:focus,.ed-body:focus{outline:none}
input::placeholder,textarea::placeholder{color:var(--ink-3);opacity:1}
.confirm{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px max(16px,var(--sr)) 10px max(16px,var(--sl));background:var(--blush);font-size:14px}
.confirm span{flex:1;min-width:8em}
.confirm .btn{padding:8px 13px;font-size:13.5px}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:39;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:40;max-height:88%;overflow-y:auto;overscroll-behavior:contain;background:var(--paper);border-radius:16px 16px 0 0;padding-top:8px;padding-bottom:calc(var(--sb) + 20px);padding-left:max(20px,var(--sl));padding-right:max(20px,var(--sr));transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s linear .28s;box-shadow:0 -10px 30px -20px var(--shadow)}
.sheet.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s}
@media (min-width:640px){.sheet{left:50%;right:auto;width:460px;margin-left:-230px}}
.grip{width:36px;height:4px;margin:0 auto 10px;border-radius:2px;background:var(--line)}
.sheet-h{margin:4px 0 8px;font-weight:700;font-size:18px}
.fld{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.fld > span{font-size:12.5px;color:var(--ink-2);letter-spacing:.04em}
.fld input,.fld textarea{width:100%;padding:4px 0;border:0;border-radius:0;background:transparent;font-size:17px;line-height:1.6;color:var(--ink);resize:none}
.fld input:focus,.fld textarea:focus{outline:none}
.fld #inTitle{font-weight:700;font-size:19px}
.swatches{display:grid;grid-template-columns:repeat(6,32px);justify-content:space-between;gap:14px 0;padding-top:6px;max-width:320px}
.sw{position:relative;display:block}
.sw input{position:absolute;inset:0;z-index:1;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.sw span{display:flex;align-items:center;justify-content:center;width:32px;height:44px;border-radius:2px 4px 4px 2px;box-shadow:0 1px 2px var(--shade);background-repeat:no-repeat;font-size:11px;color:var(--ink-2)}
.sw input:checked + span{outline:2px solid var(--rose);outline-offset:3px}
.sw input:focus-visible + span{outline:2px solid var(--ink);outline-offset:3px}
.sheet-actions{display:flex;gap:10px;padding-top:18px}
.sheet-actions .btn{flex:1;padding:13px}
.sheet-more{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:18px;padding-top:10px;border-top:1px solid var(--line)}
.sheet .confirm{margin-top:10px;border-radius:8px}
.av-edit{display:flex;align-items:center;gap:16px;padding:6px 0 14px;border-bottom:1px solid var(--line)}
.av-edit img{flex:none;width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--blush)}
.av-edit div{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.set-label{font-size:13.5px;color:var(--ink-2)}
.size{display:flex;align-items:center;gap:6px}
.size button{appearance:none;width:46px;height:40px;border:0;border-radius:8px;background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.size button:disabled{opacity:.35;cursor:default}
.size .s1{font-size:13px}.size .s2{font-size:20px}
.size output{min-width:2.6em;text-align:center;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.toc{list-style:none;margin:0;padding:0}
.toc button{appearance:none;display:flex;align-items:baseline;gap:8px;width:100%;padding:12px 0;border:0;background:transparent;text-align:left}
.toc .t{min-width:0;max-width:78%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.toc .lead{flex:1;min-width:14px;border-bottom:1px dotted var(--ink-3);transform:translateY(-4px)}
.toc .n{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.toc .cur .t{color:var(--rose-deep);font-weight:700}

/* ---------- reader ---------- */
.reader{z-index:30;overflow:hidden;background:var(--bg);user-select:none;-webkit-user-select:none}
.reader.phone{background:var(--paper)}
.stage{position:absolute;inset:0;padding-top:var(--st);padding-bottom:var(--sb);padding-left:var(--sl);padding-right:var(--sr)}
.measure{position:relative;width:100%;height:100%}
.pages{position:absolute;overflow:hidden}
.reader.spread .pages{box-shadow:0 1px 2px var(--shade),0 28px 54px -28px var(--shadow)}
.page{position:absolute;top:0;left:0;width:var(--pw);height:var(--ph);overflow:hidden;background:var(--paper)}
#pgB{left:var(--pw)}
.inner{position:absolute;inset:0}
.turn{position:absolute;top:0;left:0;z-index:4;width:var(--pw);height:var(--ph);pointer-events:none;visibility:hidden}
.turn.on{visibility:visible}
.turn.right{left:var(--pw)}
.turn.mirror{transform:scaleX(-1)}
.clip{position:absolute;inset:0;overflow:hidden}

<script>
'use strict';
(() => {
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = n => n.toLocaleString('ko-KR');
const chars = s => (s || '').replace(/\n/g, '').length;
const COLORS = ['white', 'petal', 'blush', 'milk', 'rose', 'coral', 'peach', 'lemon', 'lime', 'mint', 'sky', 'black'];
const COLOR_NAMES = {blush:'벚꽃', petal:'연분홍', milk:'딸기우유', peach:'복숭아', coral:'산호', rose:'장미', lemon:'레몬', lime:'연두', mint:'민트', sky:'하늘', white:'흰색', black:'검정'};
const OLD_COLORS = {sand: 'peach', lilac: 'sky', plum: 'rose'};
const SIZES = [15, 16.5, 18, 19.5, 21, 23];
const DEFAULT_AVATAR = 'icon-192.png';
const SB_URL = 'https://dqozoyzxsosnzegqqdpz.supabase.co';
const SB_KEY = 'sb_publishable_jXaCakxSow679VzOdyCWYQ_lwWJouCp';

/* ---------- small helpers ---------- */
function when(t) {
  if (!t) return '';
  const d = new Date(t), now = new Date();
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 864e5);
  if (diff === 0) return '오늘 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  if (diff === 1) return '어제';
  if (d.getFullYear() === now.getFullYear()) return `${d.getMonth() + 1}월 ${d.getDate()}일`;
  return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`;
}
const fullDate = t => { const d = new Date(t); return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`; };
let toastT;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('on'), 2300);
}
const coverClass = st => 'cv-' + st.color;
const coverStyle = () => '';
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { res(img); setTimeout(() => URL.revokeObjectURL(url), 2000); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
function shrink(img, maxSide, square) {
  let sw = img.naturalWidth, sh = img.naturalHeight, sx = 0, sy = 0;
  if (square) { const m = Math.min(sw, sh); sx = (sw - m) / 2; sy = (sh - m) / 2; sw = sh = m; }
  const sc = Math.min(1, maxSide / Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw * sc)), h = Math.max(1, Math.round(sh * sc));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
  x.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  return {img: c.toDataURL('image/jpeg', 0.84), a: w / h};
}

/* ---------- account ---------- */
const A = {token: null, user: null};
try { A.token = localStorage.getItem('momo.token'); A.user = localStorage.getItem('momo.user'); } catch (e) {}
function setAuth(token, user) {
  A.token = token; A.user = user;
  try {
    if (token) { localStorage.setItem('momo.token', token); localStorage.setItem('momo.user', user); }
    else { localStorage.removeItem('momo.token'); localStorage.removeItem('momo.user'); }
  } catch (e) {}
}
async function rpc(fn, args, keepalive) {
  const body = JSON.stringify(args);
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST', keepalive: !!keepalive && body.length < 60000,
    headers: {apikey: SB_KEY, 'Content-Type': 'application/json'}, body
  });
  if (!r.ok) { const e = new Error('http ' + r.status); e.status = r.status; throw e; }
  return r.json();
}

/* ---------- local copy (this device) ---------- */
const Store = (() => {
  let db = null;
  const mem = {stories: new Map(), meta: new Map()};
  const open = () => new Promise((res, rej) => {
    if (!('indexedDB' in window)) return rej(new Error('no idb'));
    let r;
    try { r = indexedDB.open('momo', 2); } catch (e) { return rej(e); }
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('stories')) d.createObjectStore('stories', {keyPath: 'id'});
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('blocked'));
  });
  const tx = (names, kind, fn) => new Promise((res, rej) => {
    const t = db.transaction(names, kind);
    const req = fn(t);
    t.oncomplete = () => res(req && req.result);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error('abort'));
  });
  return {
    async init() {
      try { db = await Promise.race([open(), sleep(4000).then(() => { throw new Error('timeout'); })]); }
      catch (e) { db = null; }
    },
    async all() { return db ? (await tx('stories', 'readonly', t => t.objectStore('stories').getAll())) || [] : [...mem.stories.values()]; },
    async put(st) { if (db) return tx('stories', 'readwrite', t => t.objectStore('stories').put(st)); mem.stories.set(st.id, st); },
    async del(id) { if (db) return tx('stories', 'readwrite', t => t.objectStore('stories').delete(id)); mem.stories.delete(id); },
    async get(k) { return db ? tx('meta', 'readonly', t => t.objectStore('meta').get(k)) : mem.meta.get(k); },
    async set(k, v) { if (db) return tx('meta', 'readwrite', t => t.objectStore('meta').put(v, k)); mem.meta.set(k, v); },
    async clear() {
      if (db) return tx(['stories', 'meta'], 'readwrite', t => { t.objectStore('stories').clear(); return t.objectStore('meta').clear(); });
      mem.stories.clear(); mem.meta.clear();
    }
  };
})();

function normalize(s) {
  if (!s || typeof s.id !== 'string' || !/^[a-z0-9]{4,40}$/.test(s.id)) return null;
  const now = Date.now();
  const str = v => typeof v === 'string' ? v : '';
  const post = p => ({id: typeof p.id === 'string' ? p.id : newId(), title: str(p.title), body: str(p.body), created: +p.created || now, updated: +p.updated || +p.created || now});
  const out = {
    id: s.id, title: str(s.title) || '제목 없음',
    color: COLORS.includes(s.color) ? s.color : (OLD_COLORS[s.color] || 'blush'),
    created: +s.created || now, updated: +s.updated || now, edited: +s.edited || +s.updated || now,
    posts: Array.isArray(s.posts) ? s.posts.filter(Boolean).map(post) : [],
    pub: null, read: null, sv: +s.sv || 0
  };
  if (s.pub && Array.isArray(s.pub.posts)) out.pub = {at: +s.pub.at || now, posts: s.pub.posts.filter(Boolean).map(p => ({title: str(p.title), body: str(p.body)}))};
  if (s.read && typeof s.read === 'object') out.read = {p: Number.isFinite(+s.read.p) ? +s.read.p : -1, f: +s.read.f || 0, pct: Math.max(0, Math.min(100, +s.read.pct || 0)), at: +s.read.at || 0};

}
const wire = st => { const o = Object.assign({}, st); delete o.sv; delete o.photo; return o; };

const S = {stories: [], ready: false};

function ensureSince() {
  const first = S.stories.reduce((m, s) => Math.min(m, s.created || Infinity), Infinity);
  const cand = Math.min(P.since || Infinity, first, Date.now());
  if (cand !== P.since) { P.since = cand; return true; }
  return false;
}
function dayCount() {
  const a = new Date(P.since || Date.now()), b = new Date();
  const d0 = new Date(a.getFullYear(), a.getMonth(), a.getDate()), d1 = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.max(1, Math.round((d1 - d0) / 864e5) + 1);

/* ---------- saving ---------- */
const localQ = new Map(), remoteQ = new Set();
let localT = null, remoteT = null, remoteBusy = false;
function touch(st, content = true) {
  const now = Date.now();
  st.updated = now;
  if (content) st.edited = now;
  save(st);
}
function save(st) {
  localQ.set(st.id, st);
  remoteQ.add(st.id);
  setStatus('saving');
  clearTimeout(localT); localT = setTimeout(flushLocal, 400);
  clearTimeout(remoteT); remoteT = setTimeout(flushRemote, 1800);
}
async function flushLocal() {
  clearTimeout(localT); localT = null;
  const items = [...localQ.values()];
  localQ.clear();
  for (const st of items) { try { await Store.put(st); } catch (e) {} }
}
async function flushRemote(keepalive) {
  clearTimeout(remoteT); remoteT = null;
  if (!A.token || !remoteQ.size) return;
  if (remoteBusy) { remoteT = setTimeout(flushRemote, 600); return; }
  remoteBusy = true;
  const ids = [...remoteQ];
  remoteQ.clear();
  try {
    for (let i = 0; i < ids.length; i++) {
      const st = S.stories.find(s => s.id === ids[i]);
      if (!st) continue;
      const body = wire(st);
      try {
        const r = await rpc('momo_put', {p_token: A.token, p_story: body}, keepalive);
        if (r && r.error === 'not_logged_in') { expired(); return; }
        if (r && r.ok) { st.sv = body.updated; Store.put(st).catch(() => {}); }
        else if (r && r.error === 'too_big') toast('글이 너무 길어서 저장하지 못했어요');
      } catch (e) {
        ids.slice(i).forEach(id => remoteQ.add(id));
        throw e;
      }
    }
    setStatus(remoteQ.size ? 'saving' : 'saved');
  } catch (e) {
    const missing = e && e.status === 404;
    setStatus(missing ? 'saved' : 'offline');
    remoteT = setTimeout(flushRemote, missing ? 30000 : 6000);
  } finally { remoteBusy = false; }
}
function flushAll(keepalive) { flushLocal(); flushRemote(keepalive); }
window.addEventListener('online', () => flushRemote());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { flushPos(); flushAll(true); } });

  }, 700);

async function sync() {
  let r;
  try { r = await rpc('momo_load', {p_token: A.token}); } catch (e) { return; }
  if (!r) return;
  if (r.error === 'not_logged_in') { expired(); return; }
  if (r.error) return;
  let tomb = [];
  try { tomb = (await Store.get('tomb')) || []; } catch (e) {}
  for (const id of tomb) rpc('momo_del', {p_token: A.token, p_id: id}).then(() => dropTomb(id)).catch(() => {});
  const local = new Map(S.stories.map(s => [s.id, s]));
  const next = [];
  for (const raw of (Array.isArray(r.stories) ? r.stories : [])) {
    const s = normalize(raw);
    if (!s || tomb.includes(s.id)) continue;
    const L = local.get(s.id);
    local.delete(s.id);
    if (L && (L.updated || 0) > (s.updated || 0)) { next.push(L); remoteQ.add(L.id); }
    else if (L) { Object.assign(L, s, {sv: s.updated}); next.push(L); }
    else { s.sv = s.updated; next.push(s); }
  }
  for (const L of local.values()) {
    if (!L.sv) { next.push(L); remoteQ.add(L.id); }
    else Store.del(L.id).catch(() => {});
  }
  S.stories = next;
  next.forEach(s => Store.put(s).catch(() => {}));
  if (r.profile && typeof r.profile === 'object') {
    const p = r.profile;
    P.nick = typeof p.nick === 'string' ? p.nick : P.nick;
    P.bio = typeof p.bio === 'string' ? p.bio : P.bio;
    P.avatar = typeof p.avatar === 'string' && p.avatar.startsWith('data:image/') ? p.avatar : '';
    if (+p.since > 0) P.since = Math.min(+p.since, P.since || Infinity);
    P.size = Number.isInteger(p.size) && p.size >= 0 && p.size < SIZES.length ? p.size : P.size;
    Store.set('profile', {...P}).catch(() => {});
  }
  if (ensureSince() || !r.profile || !(+r.profile.since > 0)) saveProfile();
  askNickIfNeeded();
  if (curStory && !S.stories.includes(curStory)) curStory = S.stories.find(s => s.id === curStory.id) || curStory;
  renderHome();
  if (stack.includes('story')) renderStory();
  if (remoteQ.size) flushRemote();
}
async function addTomb(id) { try { const t = (await Store.get('tomb')) || []; if (!t.includes(id)) t.push(id); await Store.set('tomb', t); } catch (e) {} }
async function dropTomb(id) { try { const t = ((await Store.get('tomb')) || []).filter(x => x !== id); await Store.set('tomb', t); } catch (e) {} }

/* ---------- reader ---------- */
const reader = $('#reader'), measure = $('#measure'), pagesEl = $('#pages');

  const posts = R.preview ? draftPosts(b) : (b.pub ? b.pub.posts : []);
  let h = '';
  let i = 0, all = b.title;
  posts.forEach((p, n) => {
    h += `<h2 class="ch" data-p="${i++}">${esc(p.title || String(n + 1))}</h2>`;
    let ni = true, blank = 0;
    for (const raw of (p.body || '').replace(/\r\n?/g, '\n').split('\n')) {
      const line = raw.replace(/^[\s　]+|\s+$/g, '');

      if (blank >= 2 && !ni) { h += '<div class="gap" aria-hidden="true"></div>'; ni = true; }
      blank = 0;
      if (/^([*＊·•~=\-]\s*){3,}$/.test(line)) { h += `<p class="orn" data-p="${i++}">＊ ＊ ＊</p>`; ni = true; continue; }
      h += `<p${ni ? ' class="ni"' : ''} data-p="${i++}">${esc(line)}</p>`;

function fontsReady() {
  if (!document.fonts || !document.fonts.load) return Promise.resolve();
  const text = (R.chars || '가') + '0123456789';
  return Promise.race([
    Promise.all([document.fonts.load('400 18px "Gowun Batang"', text), document.fonts.load('700 18px "Gowun Batang"', text)]).catch(() => {}),
    sleep(3500)

}

function colOfLeft(x) { return Math.floor((x - pgA.flow.getBoundingClientRect().left - R.M + 2) / R.pageW); }

function layout(keep) {
  if (!R.book) return;
  const anchor = keep ? anchorInfo() : null;
  const W = measure.clientWidth, H = measure.clientHeight;
  if (!W || !H) return;
  const spread = W >= 700 && H >= 480;
  let pageW, pageH, M, tm, bm;
  if (spread) {
    if (W / 2 <= 580) { pageW = Math.floor(W / 2); pageH = Math.floor(H); }
    else { pageW = 560; pageH = Math.floor(Math.min(H - 40, 860)); }
    M = pageW < 460 ? 32 : 46; tm = 54; bm = 54;
  } else { pageW = Math.floor(W); pageH = Math.floor(H); M = W < 380 ? 22 : 28; tm = 46; bm = 50; }
  const big = Math.ceil(Math.hypot(pageW, pageH) * 4);
  Object.assign(R, {spread, pageW, pageH, M, tm, bm, big});
  reader.classList.toggle('spread', spread);
  reader.classList.toggle('phone', !spread);
  pgB.el.hidden = !spread;
  const ps = pagesEl.style, tw = pageW * (spread ? 2 : 1);
  ps.width = tw + 'px';
  ps.height = pageH + 'px';
  ps.left = Math.round((W - tw) / 2) + 'px';
  ps.top = Math.round((H - pageH) / 2) + 'px';
  for (const [k, v] of [['--pw', pageW], ['--ph', pageH], ['--m', M], ['--tm', tm], ['--bm', bm], ['--cw', pageW - 2 * M], ['--ch', pageH - tm - bm]]) ps.setProperty(k, v + 'px');
  lBox.style.width = lBox.style.height = fBox.style.width = fBox.style.height = big + 'px';
  uShade.style.height = big + 'px';
  pgA.flow.style.transform = 'translateX(0px)';
  const last = pgA.flow.lastElementChild;
  R.total = last ? endCol(last) + 1 : 1;
  R.chapters.forEach(c => { c.col = startCol(c.el); });
  R.chapterCols = new Set(R.chapters.map(c => c.col));
  range.max = R.total;
  stopTurn();
  if (anchor) goToPara(anchor.p, anchor.f);
  else goTo(Math.min(R.cur, R.total - 1));
}

function anchorInfo() {
  const ps = R.paras;
  if (!ps.length || !R.pageW || R.cur === 0) return {p: -1, f: 0};
  let lo = 0, hi = ps.length - 1, ans = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (startCol(ps[mid]) <= R.cur) { ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  if (ans < 0) return {p: -1, f: 0};
  return {p: ans, f: Math.max(0, R.cur - startCol(ps[ans]))};
}
function goToPara(p, f) {
  if (p == null || p < 0 || !R.paras.length) { goTo(0); return; }
  const el = R.paras[Math.min(p, R.paras.length - 1)];
  goTo(Math.min(startCol(el) + (f || 0), endCol(el)));
}

function chapterAt(c) {
  let t = '';
  for (const chp of R.chapters) { if (chp.col <= c) t = chp.title; else break; }
  return t;
}
function setPage(pg, c) {
  const ok = c >= 0 && c < R.total;
  pg.flow.style.visibility = ok ? '' : 'hidden';
  if (ok) pg.flow.style.transform = `translateX(${-c * R.pageW}px)`;
  let head = '', fo = '';
  if (ok) {
    fo = String(c + 1);
    if (!R.chapterCols.has(c)) head = R.spread && c % 2 === 0 ? R.book.title : (chapterAt(c) || R.book.title);
  }
  pg.deco.innerHTML = `<div class="rh"><span>${esc(head)}</span></div><div class="fo">${fo}</div>`;
}
function showRest() { setPage(pgA, R.cur); if (R.spread) setPage(pgB, R.cur + 1); }
function updatePanel() {
  range.value = R.cur + 1;
  pgEl.textContent = `${R.cur + 1} / ${R.total}쪽`;
}
function goTo(c) {
  c = Math.max(0, Math.min(R.total - 1, c));
  if (R.spread) c -= c % 2;
  const changed = c !== R.cur;
  R.cur = c;
  showRest();
  updatePanel();
  if (changed && R.ready) schedulePos();
}

/* page curl: pages are moved and clipped with transforms only, so nothing is redrawn while a page turns */
const T = {active: false, mode: 'fold', dir: 0, C: null, P: null, raf: 0, frame: 0, done: null};

}

}
function renderCurl() {

  else { n = {x: vx / len, y: vy / len}; M = {x: (C.x + p.x) / 2, y: (C.y + p.y) / 2}; }
  const d0 = M.x * n.x + M.y * n.y;
  const [lf, li] = boxPair(-n.x, -n.y, M);
  lBox.style.transform = lf; leafPg.el.style.transform = li;
  const [ff, fi] = boxPair(n.x, n.y, M);
  fBox.style.transform = ff; flapPg.el.style.transform = fi;
  uShade.style.transform = ff;
  const a = 1 - 2 * n.x * n.x, b = -2 * n.x * n.y, d = 1 - 2 * n.y * n.y;
  fRoot.style.transform = mtx(a, b, b, d, 2 * d0 * n.x, 2 * d0 * n.y);
  fRoot.style.visibility = len < 0.5 ? 'hidden' : '';

const drawSoon = () => { if (!T.frame) T.frame = requestAnimationFrame(renderCurl); };
function canTurn(dir) { return dir > 0 ? R.cur + stepSize() <= R.total - 1 : R.cur - stepSize() >= 0; }
function startTurn(dir, cy) {

  turnEl.classList.toggle('right', R.spread && dir > 0);
  turnEl.classList.toggle('mirror', R.spread && dir < 0);
  if (!R.spread) {
    if (dir > 0) { setPage(leafPg, c); setPage(pgA, c + 1); T.mode = 'fold'; T.P = {x: W, y: cy}; }
    else { setPage(leafPg, c - 1); setPage(pgA, c); T.mode = 'unfold'; T.P = {x: -W, y: cy}; }
  } else {
    T.mode = 'fold'; T.P = {x: W, y: cy};

    else { setPage(leafPg, c); setPage(flapPg, c - 1); setPage(pgA, c - 2); setPage(pgB, c + 1); }

}
function stopTurn() {

function finishAnim() { if (T.raf && T.done) { const f = T.done; cancelAnimationFrame(T.raf); T.raf = 0; f(); } }

function turn(dir) {

/* gestures */
const tap = $('#tap');
let drag = null;
function local(e) { const r = pagesEl.getBoundingClientRect(); return {x: e.clientX - r.left, y: e.clientY - r.top}; }
tap.addEventListener('pointerdown', e => {
  if (e.button > 0 || !R.ready) return;
  finishAnim();
  const q = local(e);
  drag = {id: e.pointerId, x: e.clientX, y: e.clientY, q, t: performance.now(), moving: false, hist: [{x: e.clientX, t: performance.now()}]};

  if (drag.hist.length > 6) drag.hist.shift();
  if (!drag.moving) {
    if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy) * 1.1) return;
    const dir = dx < 0 ? 1 : -1;
    if (reduced || !startTurn(dir, drag.q.y < R.pageH / 2 ? 0 : R.pageH)) {
      if (dir > 0 && !canTurn(1) && !drag.warned) { drag.warned = true; toast('마지막 쪽이에요'); }
      return;
    }
    drag.moving = true;
  }
  const W = R.pageW;
  if (!R.spread) T.P = {x: (T.mode === 'fold' ? W : -W) + dx * 2, y: T.C.y + dy};

    const vx = (lastS.x - first.x) / Math.max(1, lastS.t - first.t);
    const W = R.pageW;
    const prog = T.mode === 'fold' ? (W - T.P.x) / (2 * W) : (T.P.x + W) / (2 * W);
    const fling = T.dir > 0 ? vx < -0.35 : vx > 0.35, back = T.dir > 0 ? vx > 0.35 : vx < -0.35;

    return;
  }
  if (d.moving) return;
  const sx = e.clientX - d.x;
  if (Math.abs(sx) > 40) { turn(sx < 0 ? 1 : -1); return; }
  if (performance.now() - d.t > 600) return;
  const r = tap.getBoundingClientRect();
  const x = e.clientX - r.left;
  if (x < r.width * 0.3) turn(-1);
  else if (x > r.width * 0.7) turn(1);

});
tap.addEventListener('pointercancel', () => { if (drag && drag.moving && T.active) endTurn(false, 220, 0); drag = null; });
range.addEventListener('input', () => { stopTurn(); goTo(+range.value - 1); });

let relayT = null;
function relayoutSoon() { clearTimeout(relayT); relayT = setTimeout(() => { if (R.ready && R.book) layout(true); }, 150); }
if (window.ResizeObserver) new ResizeObserver(relayoutSoon).observe(measure);
else window.addEventListener('resize', relayoutSoon);
if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', relayoutSoon);

let posT = null;
function schedulePos() { clearTimeout(posT); posT = setTimeout(flushPos, 800); }
function flushPos() {
  clearTimeout(posT); posT = null;
  const b = R.book;

  const a = anchorInfo();
  const lastVis = Math.min(R.total - 1, R.cur + (R.spread ? 1 : 0));
  const pct = R.total <= 1 ? 0 : Math.round(lastVis / (R.total - 1) * 100);
  const r = b.read || {};
  if (r.p === a.p && r.f === a.f && r.pct === pct) return;
  b.read = {p: a.p, f: a.f, pct, at: Date.now()};
  save(b);
  flushLocal();
}

async function openReader(b, preview) {

}
function leaveReader() {

  if (!R.book) return;
  layout(false);
  if (a) goToPara(a.p, a.f);
}
$('#sizeDown').addEventListener('click', () => changeSize(-1));
$('#sizeUp').addEventListener('click', () => changeSize(1));

/* keyboard (computer) */
document.addEventListener('keydown', e => {
  const top = stack[stack.length - 1];
  if (!$('#login').hidden) return;
  if (e.key === 'Escape') {
    if ($('.sheet.on')) { closeSheets(); return; }
    if (top === 'reader' && reader.classList.contains('ui')) { reader.classList.remove('ui'); return; }
    if (top) back();
    return;
  }
  if (top === 'editor' && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); flushAll(); return; }
  if (top !== 'reader' || $('.sheet.on')) return;
  if (e.target === range || ((e.key === ' ' || e.key === 'Enter') && e.target.tagName === 'BUTTON')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); turn(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); turn(-1); }
});

/* ---------- start ---------- */
(async function init() {
  let tab = 'write';
  try { const t = localStorage.getItem('momo.tab'); if (t === 'shelf' || t === 'me') tab = t; } catch (e) {}
  setTab(tab);
  await Store.init();
  if (!A.token) { showLogin(); return; }
  let owner = null;
  try { owner = await Store.get('owner'); } catch (e) {}
  if (owner && owner !== A.user) { try { await Store.clear(); await Store.set('owner', A.user); } catch (e) {} }
  await loadLocal();
  renderHome();
  sync();
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
