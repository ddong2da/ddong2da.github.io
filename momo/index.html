<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>桃</title>
<meta name="apple-mobile-web-app-title" content="桃">
<meta name="application-name" content="桃">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBEFF0">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: full-screen views pushed over a two-tab home (원고 / 책장). Lists sit on pale pink, writing on near-white paper,
   and a published book reads as one paper page on phones or an open two-page spread on wide screens. One light look on purpose. */
:root{
  --bg:#FBEFF0;
  --paper:#FFFAF9;
  --glass:rgba(251,239,240,.92);
  --paper-glass:rgba(255,250,249,.94);
  --ink:#3B2A30;
  --ink-2:#8A6D74;
  --ink-3:#B99DA3;
  --rose:#C0657A;
  --rose-deep:#A4505F;
  --rose-ink:#FFF7F6;
  --line:#EED6DB;
  --blush:#F6DCE0;
  --shade:rgba(110,60,72,.12);
  --shadow:rgba(80,40,52,.26);
  --spine:rgba(60,28,40,.16);
  --spine-hi:rgba(255,255,255,.16);
  --scrim:rgba(59,42,48,.3);
  --cv-blush:#F2C6CE; --cv-blush-ink:#4B2E36;
  --cv-rose:#CE8293;  --cv-rose-ink:#FFF5F4;
  --cv-sand:#EFE1D1;  --cv-sand-ink:#4A3A32;
  --cv-lilac:#D9CBE3; --cv-lilac-ink:#3D3147;
  --cv-plum:#764455;  --cv-plum-ink:#F7E4E9;
  --serif:"Gowun Batang","Nanum Myeongjo","Noto Serif KR","AppleMyungjo",serif;
  --sans:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);
  --sr:env(safe-area-inset-right,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow:hidden}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
img{max-width:100%}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}

/* ---------- views ---------- */
.view{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg)}
.push{z-index:10;transform:translateX(100%);visibility:hidden;transition:transform .3s cubic-bezier(.25,.8,.25,1),visibility 0s linear .3s;box-shadow:-10px 0 28px -18px var(--shadow)}
.push.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.25,.8,.25,1),visibility 0s}
.wrap{width:100%;max-width:680px;margin:0 auto;padding-left:max(20px,var(--sl));padding-right:max(20px,var(--sr))}

/* ---------- buttons ---------- */
.btn{appearance:none;border:0;border-radius:8px;padding:10px 16px;font-size:14.5px;line-height:1.2;background:var(--rose);color:var(--rose-ink);white-space:nowrap;transition:background .15s,opacity .15s}
.btn:active{background:var(--rose-deep)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:active{background:var(--blush)}
@media (hover:hover){.btn:hover{background:var(--rose-deep)}.btn.ghost:hover{background:var(--blush)}}
.btn:disabled{opacity:.45;cursor:default}
.link{appearance:none;border:0;background:transparent;padding:9px 8px;border-radius:6px;font-size:14.5px;color:var(--ink);white-space:nowrap}
.link:active{background:var(--blush)}
@media (hover:hover){.link:hover{background:var(--blush)}}
.link.muted{color:var(--ink-2)}
.link.danger{color:var(--rose-deep)}

/* ---------- home ---------- */
.home{padding-bottom:calc(var(--sb) + 76px)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:calc(var(--st) + 26px);padding-bottom:16px}
.h1{margin:0;font-family:var(--serif);font-weight:700;font-size:28px;line-height:1.2;letter-spacing:-.01em}
.sub{margin:4px 0 0;font-size:13px;color:var(--ink-2);min-height:1.5em;font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:16px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}
.row:active{background:var(--blush)}
.mini{flex:none;position:relative;display:block;width:34px;height:47px;border-radius:2px 4px 4px 2px;overflow:hidden;box-shadow:0 1px 1px var(--shade),0 5px 9px -6px var(--shadow)}
.mini::before,.cover::before{content:"";position:absolute;top:0;bottom:0;left:0;width:16%;max-width:10px;background:linear-gradient(90deg,var(--spine),var(--spine-hi))}
.mini.big{width:62px;height:86px}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row-title{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.badge{font-size:11px;letter-spacing:.03em;color:var(--rose-deep);background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
.chev{flex:none;color:var(--ink-3);font-size:20px;line-height:1}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding:44px 0 12px}
.empty p,.intro{margin:0;color:var(--ink-2);font-size:14px;line-height:1.75;max-width:30em}
.intro{margin-bottom:22px}
.foot{display:flex;flex-direction:column;gap:4px;margin-top:44px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.foot p{margin:0;line-height:1.65}
.foot-actions{display:flex;flex-wrap:wrap;gap:2px;margin-left:-8px}
.foot .link{font-size:13px;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding-bottom:var(--sb);padding-left:var(--sl);padding-right:var(--sr);background:var(--glass);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tab{appearance:none;position:relative;flex:1;max-width:220px;height:56px;border:0;background:transparent;font-family:var(--serif);font-size:15.5px;color:var(--ink-3)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:50%;bottom:9px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--rose)}

/* shelf */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:30px 18px}
@media (min-width:640px){.shelf{grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:36px 26px}}
.card{appearance:none;display:flex;flex-direction:column;gap:8px;min-width:0;margin:0;padding:0;border:0;background:none;text-align:left;container-type:inline-size}
.cover{position:relative;display:flex;flex-direction:column;width:100%;max-width:100%;aspect-ratio:5/7;padding:15cqi 11cqi 11cqi 17cqi;border-radius:2px 5px 5px 2px;overflow:hidden;box-shadow:0 1px 1px var(--shade),0 10px 18px -12px var(--shadow);transition:transform .2s ease}
.card:active .cover{transform:translateY(1px) scale(.99)}
@media (hover:hover){.card:hover .cover{transform:translateY(-3px)}}
.cv-title{font-family:var(--serif);font-weight:700;font-size:12cqi;line-height:1.38;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.cv-rule{display:block;flex:none;width:16cqi;height:1px;margin-top:7cqi;background:currentColor;opacity:.45}
.cv-author{margin-top:auto;font-size:8cqi;letter-spacing:.06em;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-blush{background:var(--cv-blush);color:var(--cv-blush-ink)}
.cv-rose{background:var(--cv-rose);color:var(--cv-rose-ink)}
.cv-sand{background:var(--cv-sand);color:var(--cv-sand-ink)}
.cv-lilac{background:var(--cv-lilac);color:var(--cv-lilac-ink)}
.cv-plum{background:var(--cv-plum);color:var(--cv-plum-ink)}
.card-title{font-size:13.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.card-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.meter{flex:1;height:2px;border-radius:2px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--rose)}

/* ---------- top bars ---------- */
.bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:4px;padding-top:calc(var(--st) + 6px);padding-bottom:6px;padding-left:max(8px,var(--sl));padding-right:max(8px,var(--sr));background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.grow{flex:1;min-width:0}
.back{display:flex;align-items:center;gap:4px;max-width:58%;min-width:0}
.back b{font-size:22px;font-weight:400;line-height:1;margin-top:-2px}
.back span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- story ---------- */
.s-head{display:flex;align-items:flex-start;gap:18px;padding-block:16px 22px}
.s-headtext{flex:1;min-width:0}
.s-title{margin:0;font-family:var(--serif);font-weight:700;font-size:25px;line-height:1.32;word-break:keep-all;overflow-wrap:anywhere;text-wrap:balance}
.s-author{margin:6px 0 0;font-size:14px;color:var(--ink-2)}
.s-stats{margin:10px 0 0;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pub{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:28px;padding:14px 16px;border-radius:10px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.pub-text{flex:1;min-width:12em;font-size:13px;line-height:1.55;color:var(--ink-2)}
.pub-text b{display:block;font-weight:400;font-size:14.5px;color:var(--ink)}
.pub-btns{display:flex;gap:8px;flex:none}
.sec{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.sec h3{margin:0;font-size:13px;font-weight:400;letter-spacing:.08em;color:var(--ink-2)}
.prow{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.popen{appearance:none;flex:1;min-width:0;display:flex;align-items:flex-start;gap:12px;padding:15px 2px;border:0;background:transparent;text-align:left}
.popen:active{background:var(--blush)}
.pno{flex:none;width:1.8em;padding-top:1px;text-align:right;font-family:var(--serif);font-size:14px;line-height:1.5;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ptitle{font-family:var(--serif);font-weight:700;font-size:16px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle.none{font-weight:400;color:var(--ink-3)}
.pprev{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pmove{display:flex;gap:6px;flex:none}
.pmove button{appearance:none;width:38px;height:34px;border:0;border-radius:7px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);font-size:11px;color:var(--ink-2)}
.pmove button:disabled{opacity:.3;cursor:default}
.empty-line{margin:18px 0 0;font-size:14px;color:var(--ink-2);line-height:1.7}
.dock{position:sticky;bottom:0;display:flex;gap:10px;margin-top:26px;padding-top:18px;padding-bottom:calc(var(--sb) + 16px);background:linear-gradient(to bottom,rgba(251,239,240,0),var(--bg) 32%)}
.dock .btn{flex:1;padding:15px 16px;font-size:15px}

/* ---------- editor ---------- */
.ed{display:flex;flex-direction:column;overflow:hidden;background:var(--paper);top:var(--vvt,0px);bottom:auto;height:var(--vvh,100%)}
.ed .bar{position:relative;flex:none;background:var(--paper-glass)}
.ed-status{font-size:12.5px;color:var(--ink-3);white-space:nowrap;padding:0 6px;font-variant-numeric:tabular-nums}
.ed-col{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:680px;margin:0 auto;padding-left:max(22px,var(--sl));padding-right:max(22px,var(--sr))}
.ed-title{flex:none;display:block;width:100%;margin:0;padding:10px 0 4px;border:0;border-radius:0;background:transparent;font-family:var(--serif);font-weight:700;font-size:23px;line-height:1.4;color:var(--ink)}
.ed-date{flex:none;margin:2px 0 18px;font-size:12.5px;color:var(--ink-3)}
.ed-body{flex:1;min-height:0;display:block;width:100%;margin:0;padding:0 0 calc(var(--sb) + 48px);border:0;border-radius:0;background:transparent;resize:none;overflow-y:auto;font-family:var(--wf,var(--serif));font-size:17px;line-height:1.95;color:var(--ink);word-break:keep-all;overflow-wrap:break-word}
.ed-title:focus,.ed-body:focus{outline:none}
input::placeholder,textarea::placeholder{color:var(--ink-3);opacity:1}
.confirm{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px max(16px,var(--sr)) 10px max(16px,var(--sl));background:var(--blush);font-size:13.5px}
.confirm span{flex:1;min-width:11em;line-height:1.5}
.confirm .btn{padding:8px 13px;font-size:13.5px}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:39;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:40;max-height:86%;overflow-y:auto;overscroll-behavior:contain;background:var(--paper);border-radius:16px 16px 0 0;padding-top:8px;padding-bottom:calc(var(--sb) + 20px);padding-left:max(20px,var(--sl));padding-right:max(20px,var(--sr));transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s linear .28s;box-shadow:0 -10px 30px -20px var(--shadow)}
.sheet.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s}
@media (min-width:640px){.sheet{left:50%;right:auto;width:460px;margin-left:-230px}}
.grip{width:36px;height:4px;margin:0 auto 10px;border-radius:2px;background:var(--line)}
.sheet-h{margin:4px 0 8px;font-family:var(--serif);font-weight:700;font-size:18px}
.fld{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.fld > span{font-size:12.5px;color:var(--ink-2);letter-spacing:.04em}
.fld input{width:100%;padding:4px 0;border:0;border-radius:0;background:transparent;font-size:17px;color:var(--ink)}
.fld input:focus{outline:none}
.fld #inTitle{font-family:var(--serif);font-weight:700;font-size:19px}
.swatches{display:flex;flex-wrap:wrap;gap:14px;padding-top:4px}
.sw{position:relative;display:block}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.sw span{display:block;width:32px;height:44px;border-radius:2px 4px 4px 2px;box-shadow:0 1px 2px var(--shade)}
.sw input:checked + span{outline:2px solid var(--rose);outline-offset:3px}
.sw input:focus-visible + span{outline:2px solid var(--ink);outline-offset:3px}
.sheet-actions{display:flex;gap:10px;padding-top:18px}
.sheet-actions .btn{flex:1;padding:13px}
.sheet-more{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:18px;padding-top:10px;border-top:1px solid var(--line)}
.sheet .confirm{margin-top:10px;border-radius:8px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-label{font-size:13.5px;color:var(--ink-2)}
.size{display:flex;align-items:center;gap:6px}
.size button{appearance:none;width:46px;height:40px;border:0;border-radius:8px;background:transparent;box-shadow:inset 0 0 0 1px var(--line);font-family:var(--serif);color:var(--ink)}
.size button:disabled{opacity:.35;cursor:default}
.size .s1{font-size:13px}.size .s2{font-size:20px}
.size output{min-width:2.6em;text-align:center;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.seg{display:flex;overflow:hidden;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{appearance:none;padding:9px 18px;border:0;background:transparent;font-size:15px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--blush);color:var(--ink)}
.ff-serif{font-family:var(--serif)}.ff-sans{font-family:var(--sans)}
.toc{list-style:none;margin:0;padding:0}
.toc button{appearance:none;display:flex;align-items:baseline;gap:8px;width:100%;padding:12px 0;border:0;background:transparent;text-align:left}
.toc .t{min-width:0;max-width:78%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--serif);font-size:15px}
.toc .lead{flex:1;min-width:14px;border-bottom:1px dotted var(--ink-3);transform:translateY(-4px)}
.toc .n{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.toc .cur .t{color:var(--rose-deep);font-weight:700}

/* ---------- reader ---------- */
.reader{z-index:30;overflow:hidden;background:var(--bg);user-select:none;-webkit-user-select:none}
.reader.phone{background:var(--paper)}
.stage{position:absolute;inset:0;padding-top:var(--st);padding-bottom:var(--sb);padding-left:var(--sl);padding-right:var(--sr)}
.measure{position:relative;width:100%;height:100%}
.pages{position:absolute;overflow:hidden;background:var(--paper)}
.reader.card .pages,.reader.spread .pages{border-radius:3px;box-shadow:0 1px 2px var(--shade),0 26px 50px -26px var(--shadow)}
.reader.spread .pages::after{content:"";position:absolute;top:0;bottom:0;left:50%;z-index:2;width:70px;margin-left:-35px;pointer-events:none;background:linear-gradient(90deg,rgba(110,60,72,0),var(--shade) 48%,var(--shade) 52%,rgba(110,60,72,0))}
.flow{position:absolute;left:0;top:var(--tm);box-sizing:content-box;width:var(--cw);height:var(--ch);padding-left:var(--m);column-width:var(--cw);column-gap:calc(var(--m) * 2);column-fill:auto;font-family:var(--rf,var(--serif));font-size:var(--fs,18px);line-height:1.86;color:var(--ink);text-align:justify;word-break:normal;line-break:strict;overflow-wrap:break-word;orphans:2;widows:2}
.flow p{margin:0;text-indent:1em}
.flow p.ni{text-indent:0}
.flow .gap{height:1.86em}
.flow .orn{margin:1.1em 0;text-align:center;text-indent:0;font-size:.8em;letter-spacing:.3em;color:var(--ink-3);break-inside:avoid}
.flow h2.ch{margin:0;padding-top:calc(var(--ch) * .2);padding-bottom:2.1em;font-size:1.3em;font-weight:700;line-height:1.5;text-align:left;text-indent:0;break-before:column;-webkit-column-break-before:always;break-after:avoid;-webkit-column-break-after:avoid;break-inside:avoid;word-break:keep-all}
.flow h2.ch::before{content:"";display:block;width:1.4em;height:1px;margin-bottom:1.1em;background:var(--rose)}
.tp{display:flex;flex-direction:column;align-items:center;justify-content:center;height:calc(var(--ch) - 2px);text-align:center;text-indent:0;break-inside:avoid}
.tp-title{font-family:var(--serif);font-size:1.7em;font-weight:700;line-height:1.4;word-break:keep-all;text-wrap:balance}
.tp-rule{width:2.2em;height:1px;margin:1.4em auto;background:var(--rose)}
.tp-author{font-family:var(--serif);font-size:.9em;letter-spacing:.1em;color:var(--ink-2)}
.deco{position:absolute;inset:0;z-index:3;pointer-events:none}
.slot{position:absolute;top:0;bottom:0}
.rh{position:absolute;left:var(--m);right:var(--m);top:0;height:var(--tm);display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.14em;color:var(--ink-3);white-space:nowrap}
.rh span{overflow:hidden;text-overflow:ellipsis}

<script>
'use strict';
(() => {
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = n => n.toLocaleString('ko-KR');
const chars = s => (s || '').replace(/\n/g, '').length;
const COLORS = ['blush', 'rose', 'sand', 'lilac', 'plum'];
const COLOR_NAMES = {blush:'벚꽃', rose:'장미', sand:'모래', lilac:'라일락', plum:'자두'};
const SIZES = [15, 16.5, 18, 19.5, 21, 23];

const SAMPLE = {
  id: 'sample', sample: true, title: '사월의 제본소', author: '견본', color: 'blush', read: null,
  posts: [
    {title: '풀 냄새', body: `골목 끝 제본소에는 간판이 없었다. 대신 유리문 안쪽에 실로 꿰맨 책 한 권이 늘 펼쳐져 있었고, 바람이 드는 날이면 그 책장이 저 혼자 한 장씩 넘어갔다. 동네 사람들은 책장이 넘어가는 걸 보고 오늘 문이 열려 있는지를 알았다.
윤서가 그 문을 처음 민 건 사월 첫날이었다. 손에는 고무줄로 묶은 원고 뭉치가 들려 있었다. 삼 년 동안 밤마다 조금씩 써 온 소설이었다. 누구에게 보여 줄 생각도 없이, 그저 끝까지 가 보고 싶어서 쓴 글.
“책으로 만들고 싶어서요. 딱 한 권만요.”
작업대 너머에서 노인이 안경을 고쳐 썼다. 가게 안에는 오래된 종이와 밀가루 풀 냄새가 엷게 배어 있었다. 노인은 원고 첫 장을 한참 들여다보더니, 끝까지 읽지도 않고 고개를 끄덕였다.
“한 권이면 실로 꿰매야지. 풀로만 붙인 책은 금방 갈라져요. 오래 둘 책은 실로 묶는 거고.”
“오래 둘 만한 책인지는 모르겠어요.”
“쓴 사람이 끝까지 쓴 책이면, 그걸로 오래 가요.”
윤서는 대답 대신 웃었다. 창밖에서 벚꽃잎 하나가 날아와 유리에 붙었다가 천천히 미끄러졌다.
* * *
노인이 표지 천 견본을 꺼냈다. 짙은 남색과 밤색, 먹색 사이에 연분홍 한 장이 끼어 있었다. 윤서는 잠깐 망설이다가 그 분홍을 짚었다. 소설 속 계절이 처음부터 끝까지 봄이었으니까.
“좋은 색이네. 손때가 타면 더 좋아져요.”
노인은 그렇게 말하고는 원고를 가지런히 모아 작업대 한쪽에 올려 두었다. 그 위로 오후의 볕이 한 뼘쯤 내려앉아 있었다.`},
    {title: '마지막 장', body: `책은 열흘 뒤에 나왔다. 노인은 완성된 책을 얇은 습자지에 싸서 건네며, 맨 뒤에 한 장을 비워 두었다고 했다.
“원고에는 없던 장이에요. 다 쓰고 나서 생각나는 게 있으면 거기다 쓰라고.”
윤서는 집으로 돌아가는 버스 안에서 책을 처음부터 끝까지 넘겼다. 제 문장이 활자가 되어 종이 위에 가만히 앉아 있는 모습은 낯설면서도 다정했다. 원고로 읽을 때는 몰랐던 어색한 문장도, 몇 날을 붙들고 있던 마지막 줄도, 이제는 모두 한 권의 일부였다.
빈 장에 이르러서야 손이 멈췄다. 하얀 종이 위로 창밖의 빛이 잔물결처럼 흔들렸다.
그날 밤 윤서는 책상 앞에 앉아 빈 장 맨 위에 한 줄을 적었다.
다음 이야기는 여름에서 시작한다.`}
  ]
};

/* ---------- dates ---------- */
function when(t) {
  if (!t) return '';
  const d = new Date(t), now = new Date();
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 864e5);
  if (diff === 0) return '오늘 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  if (diff === 1) return '어제';
  if (d.getFullYear() === now.getFullYear()) return `${d.getMonth() + 1}월 ${d.getDate()}일`;
  return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`;
}
const fullDate = t => { const d = new Date(t); return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`; };

/* ---------- storage (this device) ---------- */
const Store = (() => {
  let db = null, mode = 'mem', mem = {stories: {}, prefs: null};
  const LS = 'momo.v1';
  const open = () => new Promise((res, rej) => {
    if (!('indexedDB' in window)) return rej(new Error('no idb'));
    let r;
    try { r = indexedDB.open('momo', 1); } catch (e) { return rej(e); }
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('stories')) d.createObjectStore('stories', {keyPath: 'id'});
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('blocked'));
  });
  const tx = (name, kind, fn) => new Promise((res, rej) => {
    const t = db.transaction(name, kind);
    const req = fn(t.objectStore(name));
    t.oncomplete = () => res(req && req.result);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error('abort'));
  });
  const lsWrite = () => {
    try { localStorage.setItem(LS, JSON.stringify(mem)); }
    catch (e) { const err = new Error('full'); err.code = 'full'; throw err; }
  };
  return {
    get mode() { return mode; },
    async init() {
      try {
        db = await Promise.race([open(), sleep(4000).then(() => { throw new Error('timeout'); })]);
        mode = 'idb';
      } catch (e) {
        db = null;
        try {
          localStorage.setItem('momo.t', '1'); localStorage.removeItem('momo.t');
          mode = 'ls';
          try { mem = JSON.parse(localStorage.getItem(LS) || 'null') || mem; } catch (e2) {}
        } catch (e3) { mode = 'mem'; }
      }
    },
    async all() { return db ? (await tx('stories', 'readonly', s => s.getAll())) || [] : Object.values(mem.stories); },
    async put(st) {
      if (db) return tx('stories', 'readwrite', s => s.put(st));
      mem.stories[st.id] = JSON.parse(JSON.stringify(st));
      if (mode === 'ls') lsWrite();
    },
    async del(id) {
      if (db) return tx('stories', 'readwrite', s => s.delete(id));
      delete mem.stories[id];
      if (mode === 'ls') lsWrite();
    },
    async getPrefs() { return db ? tx('meta', 'readonly', s => s.get('prefs')) : mem.prefs; },
    async putPrefs(p) {
      if (db) return tx('meta', 'readwrite', s => s.put(p, 'prefs'));
      mem.prefs = p;
      if (mode === 'ls') lsWrite();
    }
  };
})();

function normalize(s) {
  if (!s || typeof s.id !== 'string') return null;
  const now = Date.now();
  const str = v => typeof v === 'string' ? v : '';
  const post = p => ({id: typeof p.id === 'string' ? p.id : newId(), title: str(p.title), body: str(p.body), created: +p.created || now, updated: +p.updated || +p.created || now});
  const out = {
    id: s.id, title: str(s.title) || '제목 없음', author: str(s.author),
    color: COLORS.includes(s.color) ? s.color : 'blush',
    created: +s.created || now, updated: +s.updated || now, edited: +s.edited || +s.updated || now,
    posts: Array.isArray(s.posts) ? s.posts.filter(Boolean).map(post) : [],
    pub: null, read: null
  };
  if (s.pub && Array.isArray(s.pub.posts)) out.pub = {at: +s.pub.at || now, posts: s.pub.posts.filter(Boolean).map(p => ({title: str(p.title), body: str(p.body)}))};
  if (s.read && typeof s.read === 'object') out.read = {p: Number.isFinite(+s.read.p) ? +s.read.p : -1, f: +s.read.f || 0, pct: Math.max(0, Math.min(100, +s.read.pct || 0)), at: +s.read.at || 0};
  return out;
}

const S = {stories: [], prefs: {size: 2, font: 'serif'}, ready: false};
let curStory = null, curPost = null, newPostOpen = false, reorder = false, infoMode = 'new';

/* ---------- saving ---------- */
const pending = new Map();
let saveT = null, saving = false;
function touch(st, content = true) {
  const now = Date.now();
  st.updated = now;
  if (content) st.edited = now;
  queueSave(st);
}
function queueSave(st) {
  pending.set(st.id, st);
  setStatus('saving');
  clearTimeout(saveT);
  saveT = setTimeout(flush, 600);
}
async function flush() {
  clearTimeout(saveT); saveT = null;
  if (saving) { saveT = setTimeout(flush, 300); return; }
  if (!pending.size) return;
  const items = [...pending.values()];
  pending.clear();
  saving = true;
  try {
    for (const st of items) await Store.put(st);
    setStatus('saved');
  } catch (e) {
    items.forEach(st => { if (!pending.has(st.id)) pending.set(st.id, st); });
    setStatus('error');
    if (e && e.code === 'full') toast('저장 공간이 가득 찼어요. 백업한 뒤 안 쓰는 작품을 지워 주세요.');
    else { toast('저장하지 못했어요. 잠시 뒤 다시 저장할게요.'); saveT = setTimeout(flush, 4000); }
  } finally { saving = false; }
}
let persistAsked = false;
function askPersist() {
  if (persistAsked) return;
  persistAsked = true;
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { flushPos(); flush(); } });
window.addEventListener('pagehide', () => { flushPos(); flush(); });

/* ---------- toast ---------- */
let toastT;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('on'), 2300);
}

/* ---------- viewport (keyboard) ---------- */
function vv() {
  const v = window.visualViewport, r = document.documentElement.style;
  if (!v) return;
  r.setProperty('--vvh', v.height + 'px');
  r.setProperty('--vvt', v.offsetTop + 'px');
  r.setProperty('--kb', Math.max(0, window.innerHeight - v.height - v.offsetTop) + 'px');
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', vv);
  visualViewport.addEventListener('scroll', vv);
}
window.addEventListener('resize', vv);
vv();

/* ---------- navigation ---------- */
const VIEWS = {story: $('#story'), editor: $('#editor'), reader: $('#reader')};
const stack = [];
function push(name) {
  stack.push(name);
  VIEWS[name].classList.add('on');
  VIEWS[name].setAttribute('aria-hidden', 'false');
  try { history.pushState({momo: stack.length}, ''); } catch (e) {}
}
function back() {
  if (!stack.length) return;
  if (history.state && history.state.momo === stack.length) history.back();
  else pop();
}
function pop() {
  const name = stack.pop();
  if (!name) return;
  if (name === 'editor') leaveEditor();
  if (name === 'reader') leaveReader();
  if (name === 'story') { curStory = null; renderHome(); }
  VIEWS[name].classList.remove('on');
  VIEWS[name].setAttribute('aria-hidden', 'true');
}
window.addEventListener('popstate', () => { closeSheets(); if (stack.length) pop(); });
try { if (history.state && history.state.momo) history.replaceState(null, ''); } catch (e) {}
document.addEventListener('click', e => { if (e.target.closest('[data-back]')) back(); });

/* ---------- home ---------- */
const needsRepub = st => !!st.pub && (st.edited || 0) > st.pub.at;
const statsOf = st => ({n: st.posts.length, c: st.posts.reduce((a, p) => a + chars(p.body), 0)});

function setTab(t) {
  $('#tabWrite').setAttribute('aria-selected', String(t === 'write'));
  $('#tabShelf').setAttribute('aria-selected', String(t === 'shelf'));
  $('#paneWrite').hidden = t !== 'write';
  $('#paneShelf').hidden = t !== 'shelf';
  $('#home').scrollTop = 0;
  try { localStorage.setItem('momo.tab', t); } catch (e) {}
}
$('#tabWrite').addEventListener('click', () => setTab('write'));
$('#tabShelf').addEventListener('click', () => setTab('shelf'));

function renderHome() { renderWrite(); renderShelf(); }

function renderWrite() {
  if (!S.ready) { $('#writeSub').textContent = '여는 중'; return; }
  const list = [...S.stories].sort((a, b) => (b.updated || 0) - (a.updated || 0));
  $('#writeSub').textContent = list.length ? `작품 ${list.length}편` : '';
  $('#writeEmpty').hidden = !!list.length;
  $('#storyList').hidden = !list.length;
  $('#storyList').innerHTML = list.map(st => {
    const {n, c} = statsOf(st);
    const badge = st.pub ? `<span class="badge">${needsRepub(st) ? '고친 내용 있음' : '발행됨'}</span>` : '';
    return `<li><button class="row" type="button" data-id="${esc(st.id)}">
      <span class="mini cv-${st.color}"></span>
      <span class="row-main">
        <span class="row-title">${esc(st.title)}</span>
        <span class="row-meta"><span>글 ${n}편</span><span aria-hidden="true">·</span><span>${num(c)}자</span><span aria-hidden="true">·</span><span>${when(st.updated)}</span>${badge}</span>
      </span>
      <span class="chev" aria-hidden="true">›</span>
    </button></li>`;
  }).join('');
  const m = Store.mode;
  $('#footNote').textContent = m === 'mem'
    ? '지금은 저장이 안 되는 상태예요. 창을 닫으면 쓴 글이 사라져요.'
    : '쓴 글은 이 기기에만 저장돼요. 가끔 백업 파일을 만들어 두면 안심이에요.';
}

function renderShelf() {
  if (!S.ready) return;
  const books = S.stories.filter(s => s.pub)
    .sort((a, b) => Math.max(b.read ? b.read.at : 0, b.pub.at) - Math.max(a.read ? a.read.at : 0, a.pub.at));
  $('#shelfSub').textContent = books.length ? `책 ${books.length}권` : '';
  $('#shelfEmpty').hidden = !!books.length;
  $('#shelfGrid').innerHTML = (books.length ? books : [SAMPLE]).map(b => {
    const pct = b.read ? b.read.pct : 0;
    let meta;
    if (b.sample) meta = `<span class="badge">견본</span><span>넘겨 보기</span>`;
    else meta = `<span class="meter"><i style="width:${pct}%"></i></span><span>${!b.read || !b.read.at ? '새 책' : pct >= 100 ? '다 읽음' : pct + '%'}</span>`;
    return `<button class="card" type="button" data-id="${esc(b.id)}" aria-label="${esc(b.title)} 읽기">
      <span class="cover cv-${b.color}"><span class="cv-title">${esc(b.title)}</span><span class="cv-rule"></span>${b.author ? `<span class="cv-author">${esc(b.author)}</span>` : ''}</span>
      <span class="card-title">${esc(b.title)}</span>
      <span class="card-meta">${meta}</span>
    </button>`;
  }).join('');
}

$('#storyList').addEventListener('click', e => {

$('#shelfGrid').addEventListener('click', e => {

/* ---------- story ---------- */
function openStory(st) {
  curStory = st; reorder = false;
  renderStory();
  $('#story').scrollTop = 0;
  push('story');
}
function preview(body) {
  const l = (body || '').split('\n').find(x => x.trim());
  return l ? l.trim().slice(0, 90) : '';
}
function renderStory() {
  const st = curStory; if (!st) return;
  $('#sCover').className = 'mini big cv-' + st.color;
  $('#sTitle').textContent = st.title;
  $('#sAuthor').textContent = st.author;
  $('#sAuthor').hidden = !st.author;
  const {n, c} = statsOf(st);
  $('#sStats').textContent = `글 ${n}편 · ${num(c)}자 · 원고지 약 ${num(Math.ceil(c / 200))}매`;
  let pub;
  if (!st.pub) pub = `<div class="pub-text"><b>아직 발행 전이에요</b>발행하면 책장에서 책처럼 넘겨 읽을 수 있어요.</div><div class="pub-btns"><button class="btn" type="button" data-act="publish">책 발행</button></div>`;
  else if (needsRepub(st)) pub = `<div class="pub-text"><b>발행한 뒤에 고친 내용이 있어요</b>다시 발행하면 책에도 반영돼요.</div><div class="pub-btns"><button class="btn ghost" type="button" data-act="read">책 보기</button><button class="btn" type="button" data-act="publish">다시 발행</button></div>`;
  else pub = `<div class="pub-text"><b>발행했어요</b>${fullDate(st.pub.at)}</div><div class="pub-btns"><button class="btn" type="button" data-act="read">책 보기</button></div>`;
  $('#sPub').innerHTML = pub;
  $('#sOrder').hidden = st.posts.length < 2;
  $('#sOrder').textContent = reorder ? '다 했어요' : '순서 바꾸기';
  $('#postEmpty').hidden = !!st.posts.length;
  $('#postList').hidden = !st.posts.length;
  $('#postList').innerHTML = st.posts.map((p, i) => {
    const t = p.title.trim(), pv = preview(p.body);
    return `<li class="prow">
      <button class="popen" type="button" data-i="${i}"${reorder ? ' tabindex="-1"' : ''}>
        <span class="pno">${i + 1}</span>
        <span class="pmain">
          <span class="ptitle${t ? '' : ' none'}">${esc(t || '제목 없음')}</span>
          ${pv ? `<span class="pprev">${esc(pv)}</span>` : ''}
          <span class="pmeta">${when(p.updated)} · ${num(chars(p.body))}자</span>
        </span>
      </button>
      ${reorder ? `<span class="pmove"><button type="button" data-up="${i}" aria-label="위로" ${i === 0 ? 'disabled' : ''}>▲</button><button type="button" data-down="${i}" aria-label="아래로" ${i === st.posts.length - 1 ? 'disabled' : ''}>▼</button></span>` : ''}
    </li>`;
  }).join('');
}
$('#sPub').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || !curStory) return;
  if (b.dataset.act === 'publish') publish(curStory);
  else openReader(curStory);
});
$('#sOrder').addEventListener('click', () => { reorder = !reorder; renderStory(); });
$('#postList').addEventListener('click', e => {
  const up = e.target.closest('[data-up]'), down = e.target.closest('[data-down]');
  if (up) return move(+up.dataset.up, -1);
  if (down) return move(+down.dataset.down, 1);
  const open = e.target.closest('.popen');
  if (open && !reorder) { const p = curStory.posts[+open.dataset.i]; if (p) openEditor(p, false); }
});
function move(i, d) {
  const a = curStory.posts, j = i + d;
  if (j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]];
  touch(curStory);
  renderStory();
}
$('#sNewPost').addEventListener('click', () => {
  const now = Date.now();
  const p = {id: newId(), title: '', body: '', created: now, updated: now};
  curStory.posts.push(p);
  openEditor(p, true);
});
$('#sInfo').addEventListener('click', () => openInfo('edit'));

async function publish(st) {
  const posts = st.posts.filter(p => p.title.trim() || p.body.trim()).map(p => ({title: p.title.trim(), body: p.body}));
  if (!posts.length) { toast('발행할 글이 없어요. 먼저 글을 써 주세요.'); return; }
  const first = !st.pub;
  const now = Date.now();
  st.pub = {at: Math.max(now, st.edited || 0), posts};
  st.updated = now;
  queueSave(st);
  await flush();
  renderStory(); renderHome();
  toast(first ? '책장에 꽂았어요' : '다시 발행했어요');
  openReader(st);
}

  if (!curPost) return;
  const n = chars($('#eBody').value);
  const word = s === 'saving' ? '저장 중' : s === 'saved' ? '저장됨' : s === 'error' ? '저장 안 됨' : '';

}

function leaveEditor() {
  const st = curStory, p = curPost;
  curPost = null;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (st && p && !p.title.trim() && !p.body.trim()) {
    const i = st.posts.indexOf(p);
    if (i >= 0) { st.posts.splice(i, 1); if (p.updated !== p.created || !newPostOpen) touch(st); }
  }
  flush();
  renderStory(); renderHome();
}
$('#eDel').addEventListener('click', () => { $('#eDelConfirm').hidden = false; });
$('#eDelNo').addEventListener('click', () => { $('#eDelConfirm').hidden = true; });
$('#eDelYes').addEventListener('click', () => {

/* ---------- backup ---------- */
$('#doExport').addEventListener('click', async () => {
  await flush();
  if (!S.stories.length) { toast('아직 백업할 작품이 없어요'); return; }
  const d = new Date();
  const name = `momo-backup-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`;
  const blob = new Blob([JSON.stringify({app: 'momo', version: 1, savedAt: d.toISOString(), stories: S.stories})], {type: 'application/json'});
  if (matchMedia('(pointer: coarse)').matches && navigator.canShare) {
    try {
      const file = new File([blob], name, {type: 'application/json'});
      if (navigator.canShare({files: [file]})) { await navigator.share({files: [file]}); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('백업 파일을 만들었어요');
});
$('#doImport').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const list = Array.isArray(data) ? data : data && data.stories;
    if (!Array.isArray(list)) throw new Error('bad');
    let n = 0;
    for (const raw of list) {
      const st = normalize(raw); if (!st) continue;
      const ex = S.stories.find(s => s.id === st.id);
      if (ex && (ex.updated || 0) >= st.updated) continue;
      if (ex) Object.assign(ex, st); else S.stories.push(st);
      await Store.put(ex || st);
      n++;
    }
    renderHome();
    toast(n ? `작품 ${n}편을 불러왔어요` : '새로 불러올 작품이 없어요');
  } catch (err) { toast('백업 파일을 읽지 못했어요'); }
});

/* ---------- reader ---------- */
const reader = $('#reader'), measure = $('#measure'), pagesEl = $('#pages'), flow = $('#flow'), deco = $('#deco');
const range = $('#rRange'), pgEl = $('#rPg');
const R = {book: null, ready: false, view: 0, views: 1, total: 1, perView: 1, pageW: 0, pageH: 0, M: 0, tm: 0, bm: 0, paras: [], chapters: [], chapterCols: new Set(), chars: ''};

function applyType() {
  const fam = S.prefs.font === 'sans' ? 'var(--sans)' : 'var(--serif)';
  flow.style.setProperty('--fs', SIZES[S.prefs.size] + 'px');
  flow.style.setProperty('--rf', fam);
  document.documentElement.style.setProperty('--wf', fam);
  $('#sizeOut').textContent = S.prefs.size + 1;
  $('#sizeDown').disabled = S.prefs.size <= 0;
  $('#sizeUp').disabled = S.prefs.size >= SIZES.length - 1;
  $('#fSerif').setAttribute('aria-pressed', String(S.prefs.font !== 'sans'));
  $('#fSans').setAttribute('aria-pressed', String(S.prefs.font === 'sans'));
}

function buildFlow(b) {
  const posts = b.sample ? b.posts : (b.pub ? b.pub.posts : []);
  let h = `<div class="tp"><div class="tp-title">${esc(b.title)}</div><div class="tp-rule"></div>${b.author ? `<div class="tp-author">${esc(b.author)}</div>` : ''}</div>`;
  let i = 0, all = b.title + b.author;
  posts.forEach((p, n) => {
    h += `<h2 class="ch" data-p="${i++}">${esc(p.title || String(n + 1))}</h2>`;
    let ni = true, blank = 0;
    for (const raw of (p.body || '').replace(/\r\n?/g, '\n').split('\n')) {
      const line = raw.replace(/^[\s　]+|\s+$/g, '');
      if (!line) { blank++; continue; }
      if (blank >= 2 && !ni) { h += '<div class="gap" aria-hidden="true"></div>'; ni = true; }
      blank = 0;
      if (/^([*＊·•~=\-]\s*){3,}$/.test(line)) { h += `<p class="orn" data-p="${i++}">＊ ＊ ＊</p>`; ni = true; continue; }
      h += `<p${ni ? ' class="ni"' : ''} data-p="${i++}">${esc(line)}</p>`;
      ni = false;
    }
    all += (p.title || '') + (p.body || '');
  });
  flow.innerHTML = h;
  R.paras = Array.from(flow.querySelectorAll('[data-p]'));
  R.chapters = Array.from(flow.querySelectorAll('h2.ch')).map(el => ({el, title: el.textContent, col: 0}));
  R.chapterCols = new Set();
  R.chars = Array.from(new Set(all)).join('');
  $('#rToc').hidden = R.chapters.length < 2;
}

function fontsReady() {
  if (!document.fonts || !document.fonts.load) return Promise.resolve();
  const text = (R.chars || '가') + '0123456789';
  const fam = S.prefs.font === 'sans' ? '"Gowun Dodum"' : '"Gowun Batang"';
  const jobs = [
    document.fonts.load(`400 18px ${fam}`, text),
    document.fonts.load(`700 18px "Gowun Batang"`, text),
    document.fonts.load(`400 12px "Gowun Dodum"`, text.slice(0, 2000))
  ];
  return Promise.race([Promise.all(jobs).catch(() => {}), sleep(3500)]);
}

function colOfLeft(x) { return Math.floor((x - flow.getBoundingClientRect().left - R.M + 2) / R.pageW); }
function startCol(el) { const rs = el.getClientRects(); return rs.length ? Math.max(0, colOfLeft(rs[0].left)) : 0; }
function endCol(el) { const rs = el.getClientRects(); return rs.length ? Math.max(0, colOfLeft(rs[rs.length - 1].left)) : 0; }

function layout(keep) {
  if (!R.book) return;
  const anchor = keep ? anchorInfo() : null;
  const W = measure.clientWidth, H = measure.clientHeight;
  if (!W || !H) return;
  const spread = W >= 860 && W > H * 1.15;
  const phone = !spread && W <= 600;
  let pageW, pageH, M, tm, bm;
  if (spread) { pageW = Math.floor(Math.min((W - 64) / 2, 540)); pageH = Math.floor(Math.min(H - 48, pageW * 1.48)); M = 50; tm = 62; bm = 60; }
  else if (phone) { pageW = Math.floor(W); pageH = Math.floor(H); M = W < 380 ? 22 : 28; tm = 46; bm = 50; }
  else { pageW = Math.floor(Math.min(W - 48, 600)); pageH = Math.floor(Math.min(H - 40, pageW * 1.5)); M = 48; tm = 62; bm = 60; }
  const perView = spread ? 2 : 1;
  const cw = pageW - 2 * M, ch = pageH - tm - bm;
  Object.assign(R, {perView, pageW, pageH, M, tm, bm});
  reader.classList.toggle('spread', spread);
  reader.classList.toggle('phone', phone);
  reader.classList.toggle('card', !spread && !phone);
  const ps = pagesEl.style;
  ps.width = pageW * perView + 'px';
  ps.height = pageH + 'px';
  ps.left = Math.round((W - pageW * perView) / 2) + 'px';
  ps.top = Math.round((H - pageH) / 2) + 'px';
  ps.setProperty('--m', M + 'px');
  ps.setProperty('--tm', tm + 'px');
  ps.setProperty('--bm', bm + 'px');
  ps.setProperty('--cw', cw + 'px');
  ps.setProperty('--ch', ch + 'px');
  flow.style.transition = 'none';
  flow.style.transform = 'translateX(0px)';
  const last = flow.lastElementChild;
  R.total = last ? endCol(last) + 1 : 1;
  R.views = Math.max(1, Math.ceil(R.total / perView));
  R.chapters.forEach(c => { c.col = startCol(c.el); });
  R.chapterCols = new Set(R.chapters.map(c => c.col));
  range.max = R.total;
  if (anchor) goToPara(anchor.p, anchor.f);
  else goToView(Math.min(R.view, R.views - 1), false);
}

function anchorInfo() {
  const ps = R.paras;
  if (!ps.length || !R.pageW) return {p: -1, f: 0};
  const first = R.view * R.perView;
  if (first === 0) return {p: -1, f: 0};
  let lo = 0, hi = ps.length - 1, ans = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (startCol(ps[mid]) <= first) { ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  if (ans < 0) return {p: -1, f: 0};
  return {p: ans, f: Math.max(0, first - startCol(ps[ans]))};
}

function goToPara(p, f) {
  if (p == null || p < 0 || !R.paras.length) { goToView(0, false); return; }
  const el = R.paras[Math.min(p, R.paras.length - 1)];
  const c = Math.min(startCol(el) + (f || 0), endCol(el));
  goToView(Math.floor(c / R.perView), false);
}

const baseX = () => -R.view * R.pageW * R.perView;
function goToView(v, animate = true) {
  v = Math.max(0, Math.min(R.views - 1, v));
  const changed = v !== R.view;
  R.view = v;
  flow.style.transition = animate && !reduced ? 'transform .42s cubic-bezier(.25,.75,.2,1)' : 'none';
  flow.style.transform = `translateX(${baseX()}px)`;
  drawDeco();
  if (changed && R.ready) schedulePos();
}
function chapterAt(c) {
  let t = '';
  for (const chp of R.chapters) { if (chp.col <= c) t = chp.title; else break; }
  return t;
}
function drawDeco() {
  if (!R.book) return;
  let html = '';
  for (let s = 0; s < R.perView; s++) {
    const c = R.view * R.perView + s;
    let head = '', fo = '';
    if (c < R.total && c > 0) {
      fo = String(c + 1);
      if (!R.chapterCols.has(c)) {
        const ct = chapterAt(c);
        head = R.perView === 2 && s === 0 ? R.book.title : (ct || R.book.title);
      }
    }
    html += `<div class="slot" style="left:${s * R.pageW}px;width:${R.pageW}px"><div class="rh"><span>${esc(head)}</span></div><div class="fo">${fo}</div></div>`;
  }
  deco.innerHTML = html;
  const first = R.view * R.perView;
  range.value = first + 1;
  pgEl.textContent = `${first + 1} / ${R.total}쪽`;
}

function next() {
  if (R.view < R.views - 1) { goToView(R.view + 1); reader.classList.remove('ui'); }
  else { goToView(R.view); toast('마지막 쪽이에요'); }
}
function prev() {
  if (R.view > 0) { goToView(R.view - 1); reader.classList.remove('ui'); }
  else goToView(0);
}

let posT = null;
function schedulePos() { clearTimeout(posT); posT = setTimeout(flushPos, 800); }
function flushPos() {
  clearTimeout(posT); posT = null;
  const b = R.book;
  if (!b || !R.ready) return;
  const a = anchorInfo();
  const lastC = Math.min(R.total - 1, R.view * R.perView + R.perView - 1);
  const pct = R.total <= 1 ? 0 : Math.round(lastC / (R.total - 1) * 100);
  const r = b.read || {};
  if (r.p === a.p && r.f === a.f && r.pct === pct) return;
  b.read = {p: a.p, f: a.f, pct, at: Date.now()};
  if (!b.sample) { queueSave(b); flush(); }
}

async function openReader(b) {
  R.book = b; R.ready = false; R.view = 0;
  $('#rTitle').textContent = b.title;
  applyType();
  buildFlow(b);
  deco.innerHTML = '';
  reader.classList.add('ui');
  push('reader');
  await fontsReady();
  if (R.book !== b) return;
  layout(false);
  goToPara(b.read ? b.read.p : -1, b.read ? b.read.f : 0);
  R.ready = true;
}
function leaveReader() {
  flushPos();
  closeSheets();
  R.ready = false; R.book = null;
  reader.classList.remove('ui');
  renderShelf();
}

/* gestures */
const tap = $('#tap');
let drag = null;
tap.addEventListener('pointerdown', e => {
  if (e.button > 0 || !R.ready) return;
  drag = {id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now(), dx: 0, moving: false};
  try { tap.setPointerCapture(e.pointerId); } catch (err) {}
});
tap.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moving && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) { drag.moving = true; flow.style.transition = 'none'; }
  if (drag.moving) {
    drag.dx = dx;
    const edge = (R.view === 0 && dx > 0) || (R.view >= R.views - 1 && dx < 0);
    flow.style.transform = `translateX(${baseX() + (edge ? dx * 0.25 : dx)}px)`;
  }
});
tap.addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  if (d.moving) {
    const th = Math.min(70, R.pageW * 0.14);
    if (d.dx < -th) next(); else if (d.dx > th) prev(); else goToView(R.view);
    return;
  }
  if (performance.now() - d.t > 600) return;
  const rect = tap.getBoundingClientRect();
  const x = e.clientX - rect.left;
  if (x < rect.width * 0.3) prev();
  else if (x > rect.width * 0.7) next();
  else reader.classList.toggle('ui');
});
tap.addEventListener('pointercancel', () => { if (drag && drag.moving) goToView(R.view); drag = null; });
range.addEventListener('input', () => goToView(Math.floor((+range.value - 1) / R.perView), false));

let relayT = null;
function relayoutSoon() { clearTimeout(relayT); relayT = setTimeout(() => { if (R.ready && R.book) layout(true); }, 150); }
if (window.ResizeObserver) new ResizeObserver(relayoutSoon).observe(measure);
else window.addEventListener('resize', relayoutSoon);
if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', relayoutSoon);

/* reader sheets */
$('#rSet').addEventListener('click', () => openSheet($('#setSheet')));
$('#rToc').addEventListener('click', () => {
  const cur = R.view * R.perView;
  let curIdx = -1;
  R.chapters.forEach((c, i) => { if (c.col <= cur + R.perView - 1) curIdx = i; });
  $('#toc').innerHTML = R.chapters.map((c, i) =>
    `<li><button type="button" data-i="${i}"${i === curIdx ? ' class="cur"' : ''}><span class="t">${esc(c.title)}</span><span class="lead"></span><span class="n">${c.col + 1}</span></button></li>`).join('');
  openSheet($('#tocSheet'));
});
$('#toc').addEventListener('click', e => {
  const b = e.target.closest('[data-i]'); if (!b) return;
  const c = R.chapters[+b.dataset.i]; if (!c) return;
  closeSheets();
  goToView(Math.floor(c.col / R.perView), false);
  reader.classList.remove('ui');
});
let prefT = null;
async function changeType(fn) {
  fn();
  applyType();
  clearTimeout(prefT);
  prefT = setTimeout(() => { Store.putPrefs({...S.prefs}).catch(() => {}); }, 700);
  if (!R.book) return;
  const a = R.ready ? anchorInfo() : null;
  await fontsReady();
  if (!R.book) return;
  layout(false);
  if (a) goToPara(a.p, a.f);
}
$('#sizeDown').addEventListener('click', () => changeType(() => { S.prefs.size = Math.max(0, S.prefs.size - 1); }));
$('#sizeUp').addEventListener('click', () => changeType(() => { S.prefs.size = Math.min(SIZES.length - 1, S.prefs.size + 1); }));
$('#fSerif').addEventListener('click', () => changeType(() => { S.prefs.font = 'serif'; }));
$('#fSans').addEventListener('click', () => changeType(() => { S.prefs.font = 'sans'; }));

/* keyboard (computer) */
document.addEventListener('keydown', e => {
  const top = stack[stack.length - 1];
  if (e.key === 'Escape') {
    if ($('.sheet.on')) { closeSheets(); return; }
    if (top === 'reader' && reader.classList.contains('ui')) { reader.classList.remove('ui'); return; }
    if (top) back();
    return;
  }
  if (top === 'editor' && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); flush(); return; }
  if (top !== 'reader' || $('.sheet.on')) return;
  if (e.target === range || ((e.key === ' ' || e.key === 'Enter') && e.target.tagName === 'BUTTON')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
});

/* ---------- start ---------- */
(async function init() {
  let tab = 'write';
  try { tab = localStorage.getItem('momo.tab') === 'shelf' ? 'shelf' : 'write'; } catch (e) {}
  setTab(tab);
  renderHome();
  await Store.init();
  try { S.stories = (await Store.all()).map(normalize).filter(Boolean); } catch (e) { S.stories = []; }
  try {
    const p = await Store.getPrefs();
    if (p) S.prefs = {size: Number.isInteger(p.size) && p.size >= 0 && p.size < SIZES.length ? p.size : 2, font: p.font === 'sans' ? 'sans' : 'serif'};
  } catch (e) {}
  applyType();
  S.ready = true;
  renderHome();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();
</script>
</body>
