let au;function aud(){try{au=new AudioContext();const l=au.createBiquadFilter();l.type='lowpass';l.frequency.value=260;const g=au.createGain();g.gain.value=.07;[55,58.3,110.5].forEach(f=>{const o=au.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(l);o.start()});l.connect(g);g.connect(au.destination)}catch(e){}}
function blip(n){if(!au)return;const o=au.createOscillator(),g=au.createGain();o.frequency.value=n[0]=='그'?70:n[0]=='유'?300:220;o.type='square';g.gain.value=.012;g.gain.exponentialRampToValueAtTime(.0001,au.currentTime+.05);o.connect(g);g.connect(au.destination);o.start();o.stop(au.currentTime+.06)}
